# Pre-commit hooks — https://pre-commit.com
# Instalación: pipx install pre-commit (NO ejecutar `pre-commit install`:
# los hooks corren vía `git config core.hooksPath .githooks`, cuyo pre-commit
# delega a `pre-commit run`. `pre-commit install` escribiría en .git/hooks,
# ignorado bajo core.hooksPath, y los gates de Python/JS/docs nunca correrían.
# Actualizar revs: pre-commit autoupdate --config .githooks/pre-commit-config.yaml
# (config fuera de la raiz: todo uso manual exige -c/--config)
# Sistema único: este archivo define TODOS los gates deterministas del stage
# pre-commit. El stage pre-push sigue nativo en .githooks/pre-push (barrera SIPP).
# CI-01: gate para formatters — cada hook está scoped a su lenguaje/directorio.
repos:
  # ── Rust root (workspace) ────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        files: '\.rs$'
      - id: cargo-clippy
        name: cargo clippy (subset rápido)
        entry: cargo clippy -p vantadb --no-default-features --features cli,fjall,memmap2,fs2,roaring -j 2 -- -D warnings
        language: system
        pass_filenames: false
        files: '\.rs$'
        # Saltar con: SKIP=cargo-clippy git commit (nativo de pre-commit).
        # El gate completo (workspace/all-targets/all-features) corre en CI + pre-push.

  # ── Python (vantadb-python/) ─────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.2
    hooks:
      # Linter. Sin --fix: falla si hay violaciones (check).
      # Scope: solo vantadb-python (medido 2026-10-29: integrations/providers/
      # evals/benchmarks/embeddings arrastran 481 errores legacy — limpiarlos
      # primero antes de ampliar el scope o cada commit fallaria).
      - id: ruff-check
        files: '^vantadb-python/.*\.pyi?$'
      # Formatter. Escribe in-place y falla si reformatea (gate).
      - id: ruff-format
        files: '^vantadb-python/.*\.pyi?$'

  # ── JS/TS/JSON (repo) — usa .prettierrc.json de la raíz (printWidth 100) ───
  # Scope: todo el codigo JS/TS/CSS/JSON salvo generados y vendors.
  # El `web/` original no existe en este repo (era scope muerto).
  # NOTA: pre-commit/mirrors-prettier está ARCHIVADO (última version v3.1.0), así
  # que `pre-commit autoupdate` no lo mueve. Migracion pendiente a
  # rbubley/mirrors-prettier (mismo hook id `prettier`) cuando se quiera subir
  # de prettier 3.1; hoy funciona y el gate usa esta misma version.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: '\.(mjs|cjs|js|jsx|ts|tsx|mts|cts|css|scss|json|jsonc)$'
        exclude: '(^|/)(node_modules|dist|build|pkg|coverage|\.next)/|package-lock\.json$'

  # ── Docs (docs/) — mirror local de docs-gates.yml ──────────────────────
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    # v0.23.2 = latest stable. v0.23.0+ requiere Node ≥ 22 (EOL Node 20/18).
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: ['--config', '.github/markdownlint-cli2.yaml']
        # Mismo scope que CI (`docs/**/*.md` en docs-gates.yml) pero
        # filtrado por staged files. NO --fix: hook es gate, no formatter.
        files: '^docs/.*\.mdx?$'