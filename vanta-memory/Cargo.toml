[package]
name = "vanta-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "VantaDB Memory Engine: four-layer (L0-L3) LLM-driven memory pipeline (port of TDAM, host-neutral)"
license = "Apache-2.0"
repository = "https://github.com/ness-e/Vantadb"
homepage = "https://vantadb.dev"
documentation = "https://docs.rs/vanta-memory"
keywords = ["memory", "llm", "agents", "embedded", "database"]
categories = ["database-implementations"]
# DIST-01 (2026-10-04): publicable (antes `publish = false`). El primer release es
# owner-coordinado — crates.io Trusted Publishing exige que el crate exista (la
# primera publicación requiere API token). release-plz queda en hold
# (`release = false` en release-plz.toml) hasta el bootstrap. Ver docs/dev/tasks/DIST-01.md.

[dependencies]
# `version` requerido para publicar: crates.io no admite deps path-only (Cargo
# book, "Local paths in published crates").
vantadb = { path = "../", version = "0.8.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
# chrono is re-exported via vantadb::sdk::VantaValue::DateTime; used in seed
# round-trip parsing (MD import → DateTime detection via RFC3339).
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Only pulled in with `llm-driver` (standalone OpenAI-compatible runner).
# Matches the workspace pattern (src/llm.rs: reqwest blocking + json).
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"], optional = true }
# Only pulled in with `precise-tokens` (D21 amendment, ADR-029): exact cl100k
# BPE token counting instead of the chars/3 heuristic. Pinned minor to guard
# against tokenizer drift vs OpenAI's API (Risk Register).
tiktoken-rs = { version = "0.12", optional = true }
# Only pulled in with `http-server` (WIRE-15): the scheduler loop helper needs
# the Tokio driver primitives (spawn/spawn_blocking, interval, watch). The
# pull-based pass (`services/scheduler::run_pass`) adds no Tokio usage to the
# default build (pre-mortem ADR-0054 T2).
tokio = { version = "1", features = ["rt", "time", "sync", "macros"], optional = true }

[dev-dependencies]
tempfile = "3"
# MEM-46: unification enables `vantadb::llm` (EmbeddingProvider trait) during
# tests so D19 fakes can implement the real core trait. Production default
# build stays lean (no reqwest from the core).
vantadb = { path = "../", features = ["remote-inference"] }

[features]
# LLM-driven paths (L1 extraction, L2 scenes, L3 persona, recall composer).
# Default off: the crate degrades to LLM-free capture/dedup/store (never blocks,
# never loses data) when no LLM runner is plugged in. Enables the real HTTP
# transport of the standalone runner + the async wrapper trait.
llm-driver = ["dep:reqwest"]

# MEM-46: expose `core_embedding_hook` (wraps `vantadb::llm::get_embedding_provider`)
# so hosts can attach real embeddings to L1 writes. Default off — records stay
# vector-free unless a hook is injected into `L1DedupConfig`.
embeddings = ["vantadb/remote-inference"]

# EMB-04: local ONNX embeddings via `LocalOnnxProvider` (ort+tokenizers).
# Alias for `vantadb/embed-local`; enables `L1DedupConfig::with_local_provider()`
# and `l1_writer::local_embedding_hook()` without requiring a networked provider.
embed-local = ["vantadb/embed-local"]

# Deterministic fake LLM runner for tests (see MEM-08b).
mock = []

# Persistent backend for the `vanta-seed` binary (MEM-39). Without it the
# binary falls back to in-memory storage (import is not persisted).
fjall = ["vantadb/fjall"]

# MEM-55 + WIRE-15: bridges the core HTTP server's `/conversation/add` route
# to the memory pipeline (`services/conversation_hook`) and enables the
# scheduler loop helper (`services/scheduler`, Tokio driver — the pull-based
# `run_pass` is available without this feature). Pulls the core's `server`
# feature (axum/tokio) — opt-in so the default build stays lean.
http-server = ["vantadb/server", "dep:tokio"]

# D21 amendment (ADR-029): exact token counts via tiktoken-rs cl100k_base.
# Opt-in: default build keeps the lean chars/3 heuristic (no new deps, no
# binary weight); hosts that need CJK/code precision pay the ~2-6MB cost.
precise-tokens = ["dep:tiktoken-rs"]

[lints]
workspace = true
