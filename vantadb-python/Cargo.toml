[package]
name = "vantadb_py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "VantaDB Python SDK: source-installed embedded persistent memory bindings"
license = "Apache-2.0"
publish = false

[lib]
name = "vantadb_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311", "chrono"] }
rayon = "1.12"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
# O(1) LRU cache (AUD-039): same version the core crate resolves (0.18.x in lockfile).
# Do not downgrade to the tantivy-transitive 0.16.x.
lru = "0.18"

# In-process reference to the core engine (zero network overhead)
vantadb = { path = "../", default-features = false, features = ["fjall", "memmap2", "rayon"] }
# WIRE-07: durability gate (OpGate) + ERR-022 clamp policy — std-only leaf.
vantadb-ffi-core = { path = "../vantadb-ffi-core" }
# DIST-02: cognitive layer (L0 capture + recall). Default features keep it
# LLM-free: without a runner the pipeline degrades per P4 (never blocks, never
# loses data); recall falls back to keyword overlap (D38) and reports it.
vanta-memory = { path = "../vanta-memory", default-features = false }

[lints]
workspace = true
