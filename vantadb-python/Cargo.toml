[package]
name = "vantadb_py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "VantaDB Python SDK: source-installed embedded persistent memory bindings"
license = "Apache-2.0"
publish = false

[lib]
name = "vantadb_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true, features = ["extension-module", "abi3-py311", "chrono"] }
rayon = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
serde_json = { workspace = true }
tracing = { workspace = true }
# O(1) LRU cache (AUD-039): same version the core crate resolves (0.18.x in lockfile).
# tantivy 0.27 pins lru ^0.18.2, so 0.19 would split the graph: stay in sync here.
lru = { workspace = true }

# In-process reference to the core engine (zero network overhead)
vantadb = { workspace = true, features = ["fjall", "memmap2", "rayon"] }
# WIRE-07: durability gate (OpGate) + ERR-022 clamp policy — std-only leaf.
vantadb-ffi-core = { workspace = true }
# DIST-02: cognitive layer (L0 capture + recall). Default features keep it
# LLM-free: without a runner the pipeline degrades per P4 (never blocks, never
# loses data); recall falls back to keyword overlap (D38) and reports it.
vanta-memory = { workspace = true }

[lints]
workspace = true
