ShortDescription: Embedded persistent memory and hybrid retrieval engine for AI agents
Description: |-
  VantaDB is an embedded persistent memory and vector retrieval engine for local-first AI applications.
  It combines BM25 full-text search, HNSW dense vector search, and Reciprocal Rank Fusion (RRF) with zero external dependencies.
  Includes the vanta-cli developer tool and vantadb-server HTTP/MCP daemon.
Tags:
