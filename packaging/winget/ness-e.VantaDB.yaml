  - memory
  - vector-search
  - rag
  - rust
  - local-first
  - mcp
ReleaseNotesUrl: https://github.com/ness-e/Vantadb/releases/tag/v0.9.0
ReleaseNotes: |-
  VantaDB v0.9.0 release:
  - Embedded vector & hybrid search with FastGate token reduction (<0.1ms)
  - Zero external dependencies (no Docker, no external Postgres/Redis)
  - Native GDPR Article 17 Purge Certificates with SHA-256 chain verification
  - MCP daemon integration for agent runtimes (Claude, Cursor, Windsurf)
  - Signed release binaries with Cosign keyless OIDC and minisign
