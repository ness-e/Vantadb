# OSV-Scanner config (FIND-150) — suppls `cargo audit` in CI (ci-rust.yml job `osv`).
# Licenses stay in `deny.toml`; this file only triages vulnerability IDs.
# Mirror of deny.toml [advisories] + .cargo/audit.toml triage: every ignore
# here MUST have owner + expiry + tracked-reference, same as deny.toml.
# Config applies to the colocated ./Cargo.lock (does not propagate to
# feature-freez/desktop/src-tauri, fuzz/, providers/*, vantadb-node/ — separate lockfiles).

# RUSTSEC-2023-0089 (atomic-polyfill unmaintained) - REMOVED 2026-11-23: the
# advisory no longer matches ./Cargo.lock. postcard is 1.1.3 and the lock has
# neither `heapless` nor `atomic-polyfill` (postcard 1.1.3 does not pull the
# heapless -> atomic-polyfill chain); `portable-atomic` is 1.15.0. OSV-Scanner
# flagged this entry as an unused ignore, which is exactly the stale-ignore
# signal this file's header warns about. Re-add only if the advisory matches
# the lock again.

