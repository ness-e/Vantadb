# GHSA-qwgh-2vcv-g2f7 (block-buffer 0.10.4, panic corrupts inline buffer cursor, CVSS 6.3).
# Pulled via jsonwebtoken 11.1.0 -> sha2 0.10.9 -> digest 0.10.7. Exploit needs a
# panicking compress callback whose panic is caught AND the buffer reused afterwards;
# VantaDB never supplies callbacks to the digest compress path (internal hashing only).
# Fix path: jsonwebtoken upgrade to the sha2/digest-0.11 chain (digest 0.11 already in graph).
# Owner: vanta-lead.
[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = "2027-01-26T00:00:00Z"
reason = "No panicking callbacks into digest compress path; internal hashing only. Tracked jsonwebtoken upgrade to sha2/digest-0.11 chain (already partially in graph). Owner: vanta-lead."

