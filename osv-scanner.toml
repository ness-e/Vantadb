# OSV-Scanner config (FIND-150) — suppls `cargo audit` in CI (ci-rust.yml job `osv`).
# Licenses stay in `deny.toml`; this file only triages vulnerability IDs.
# Mirror of deny.toml [advisories] + .cargo/audit.toml triage: every ignore
# here MUST have owner + expiry + tracked-reference, same as deny.toml.
# Config applies to the colocated ./Cargo.lock (does not propagate to
# feature-freez/desktop/src-tauri, fuzz/, providers/*, vantadb-node/ — separate lockfiles).

# RUSTSEC-2023-0089: atomic-polyfill unmaintained (transitive postcard->heapless).
# Owner: vanta-lead | Tracked: postcard 2.0 -> heapless 0.9 + portable-atomic.
[[IgnoredVulns]]
id = "RUSTSEC-2023-0089"
ignoreUntil = "2027-01-01T00:00:00Z"
reason = "Mirror of deny.toml triage: transitive only, no own-code use; tracked postcard 2.0 migration. Owner: vanta-lead."

# RUSTSEC-2023-0071: rsa Marvin Attack (transitive via jsonwebtoken 11).
# AST-007: VantaDB pins Algorithm::HS256 (src/server/jwt.rs) + HMAC keys only.
[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = "2027-01-01T00:00:00Z"
reason = "Mirror of deny.toml triage (AST-007): no RSA private-key op reachable; advisory states no safe upgrade. Owner: vanta-lead."

# RUSTSEC-2024-0436: paste unmaintained (transitive tikv-jemalloc-ctl, build-time
# proc macro only). Mirror of .cargo/audit.toml triage. Owner: vanta-lead.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = "2027-01-01T00:00:00Z"
reason = "Mirror of audit.toml triage: build-time only, no runtime impact. Tracked: tikv/jemalloc-ctl#60. Owner: vanta-lead."

# RUSTSEC-2026-0253: lru (transitive via tantivy; direct dep is already 0.18.5
# >= patched 0.18.2). REMOVED 2026-10-30: tantivy is now 0.27 and the lock only
# carries lru 0.18.5, so the advisory no longer matches anything.

# RUSTSEC-2026-0387 (crypto-bigint 0.5.5 timing variability, via jsonwebtoken ->
# rsa). Same triage as RUSTSEC-2023-0071: VantaDB pins Algorithm::HS256 (HMAC),
# so the RSA path is never exercised.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
ignoreUntil = "2027-01-26T00:00:00Z"
reason = "Mirror of deny.toml triage: HS256-only, no EC private-key ops. Tracked jsonwebtoken upgrade (also drops rsa/p256/p384/sha2-0.10/digest-0.10/block-buffer-0.10 chains). Owner: vanta-lead."

# GHSA-qwgh-2vcv-g2f7 (block-buffer 0.10.4, panic corrupts inline buffer cursor, CVSS 6.3).
# Pulled via jsonwebtoken 11.1.0 -> sha2 0.10.9 -> digest 0.10.7. Exploit needs a
# panicking compress callback whose panic is caught AND the buffer reused afterwards;
# VantaDB never supplies callbacks to the digest compress path (internal hashing only).
# Fix path: jsonwebtoken upgrade to the sha2/digest-0.11 chain (digest 0.11 already in graph).
# Owner: vanta-lead.
[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = "2027-01-26T00:00:00Z"
reason = "No panicking callbacks into digest compress path; internal hashing only. Tracked jsonwebtoken upgrade to sha2/digest-0.11 chain (already partially in graph). Owner: vanta-lead."

