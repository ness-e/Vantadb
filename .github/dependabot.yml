# Dependabot — automated dependency updates
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    open-pull-requests-limit: 15
    groups:
      rust-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      rust-minor:
        patterns:
          - "*"
        update-types:
          - "minor"

  # ponytail: solo /vantadb-python — los 10 integrations/* son stubs sin publicar
  # en PyPI (MKT-18f); añadir sus entradas cuando se publiquen.
  - package-ecosystem: "pip"
    directory: "/vantadb-python"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    groups:
      python-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Cobertura total modo SOLO-ALERTAS (decisión owner 2026-09-19):
  # open-pull-requests-limit: 0 = sin PRs semanales de versiones; las alertas
  # de seguridad siguen llegando a la pestaña Security. Si además se apaga
  # "Dependabot security updates" (Settings → Code security), cero PRs.
  # Para activar PRs en un directorio, subir su limit (ej: 5).
  # (web/ extraído a ness-e/Vantadb-web Fase 2 — su dependabot vive en ese repo)
  - package-ecosystem: "npm"
    directory: "/vantadb-ts"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/vantadb-node"
    target-branch: "develop"
