    open-pull-requests-limit: 0

  # ponytail: providers/* son crates AISLADOS (fuera del workspace raíz).
  # El cargo "/" no los ve; sin estas entradas ni siquiera hay monitoreo de
  # versiones. Solo-alertas. (La entrada de desktop/src-tauri se eliminó por
  # freeze 2026-10-16 — ver FIND-341; su lockfile vive en feature-freez/.)
  - package-ecosystem: "cargo"
    directory: "/providers/ollama"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
