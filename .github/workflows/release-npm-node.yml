name: 'RELEASE: NPM — vantadb-node'

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish package to npm'
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Dry run (no actual publish)"
        required: false
        default: "false"
  # PRE-PUB lane manual: sin trigger de tags (el fanout ya no lo llama).
  # Se publica solo por workflow_dispatch.
  pull_request:
    paths:
      - "vantadb-node/**"
      - ".github/workflows/release-npm-node.yml"

permissions:
  contents: read
  id-token: write # Required for npm trusted publishing (OIDC)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build matrix: one job per target platform
  build:
    name: Build ${{ matrix.target }}
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
          # PRE-PUB: musl/darwin recortados (eran 7). Al lanzar, reactivar
          # la matriz completa.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Build vantadb-node (${{ matrix.target }})
        working-directory: vantadb-node
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          npm ci
          CROSS_FLAG=""
          if [ "$RUNNER_OS" = "Linux" ] && [ "$RUST_TARGET" != "x86_64-unknown-linux-gnu" ]; then
            CROSS_FLAG="--cross-compile"
          fi
          npx napi build --platform --release --target "$RUST_TARGET" $CROSS_FLAG --js index.cjs
          npx napi build --platform --release --target "$RUST_TARGET" $CROSS_FLAG --esm --js index.js

      - name: Upload native binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vantadb-node-${{ matrix.target }}
          path: vantadb-node/*.node
          if-no-files-found: error

      - name: Upload JS/TS artifacts (only from one job)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vantadb-node-js
          path: |
            vantadb-node/index.cjs
            vantadb-node/index.js
            vantadb-node/index.d.ts
            vantadb-node/package.json
            vantadb-node/README.md
          if-no-files-found: error

  # Test job: runs on Linux to verify the build works
  test:
    name: Tests (vantadb-node)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Linux build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vantadb-node-x86_64-unknown-linux-gnu
          path: vantadb-node
      - name: Download JS/TS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vantadb-node-js
          path: vantadb-node
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies (vitest binary; artifacts above carry no node_modules)
        run: npm ci
        working-directory: vantadb-node
      - name: Run tests
        run: npm test
        working-directory: vantadb-node

  publish:
    name: Publish vantadb-node to npm
    needs: [build, test]
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/node-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish != false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Download all native binaries
      - name: Download all native binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vantadb-node-*
          path: vantadb-node
          merge-multiple: true

      # Download JS/TS artifacts
      - name: Download JS/TS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vantadb-node-js
          path: vantadb-node

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing requires npm >= 11.5.1 (Node 22 ships npm 10).
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Verify all targets present
        run: |
          echo "Checking for required native binaries..."
          ls -la vantadb-node/*.node
          # PRE-PUB: matriz recortada a 2 targets (eran 7).
          count=$(find vantadb-node -name "*.node" | wc -l)
          echo "Found $count native binaries"
          if [ "$count" -lt 2 ]; then
            echo "ERROR: Expected at least 2 native binaries, found $count"
            exit 1
          fi

      - name: Pack for publishing
        run: |
          npm pack
        working-directory: vantadb-node

      - name: Check if version already published
        id: check-node
        working-directory: vantadb-node
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "vantadb-node@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::vantadb-node@${VERSION} already published — skipping publish. On a release tag this means the version was not bumped for the release — gate: scripts/docs/check-npm-versions.mjs, runbook: docs/dev/workflow/PUBLISH.md"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} not published — will publish"
          fi

      - name: Smoke-test packed tarball
        working-directory: vantadb-node
        run: |
          TARBALL=$(ls ./*.tgz)
          mkdir -p /tmp/smoke-test && cd /tmp/smoke-test
          npm install --ignore-scripts "${GITHUB_WORKSPACE}/vantadb-node/${TARBALL}"
          node -e "const { VantaDb } = require('vantadb-node'); console.log('Smoke test OK:', typeof VantaDb.connect)"

      - name: Attest build provenance
        # CATEGORY: INFORMATIONAL — npm provenance attestation; supply-chain hygiene, no bloquea publish
        continue-on-error: true # CATEGORY: BEST-EFFORT - la atestacion de procedencia es una senal adicional sobre el publish (que ya valida el artefacto subido); no debe bloquear la publicacion
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'vantadb-node/*.tgz'

      # (Attach to Release retirado: este workflow nunca recibe el evento
      # 'release', el bloque era codigo muerto.)

      - name: Publish to npm
        if: steps.check-node.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ${{ inputs.dry_run == 'true' && '--dry-run' || '' }} --access public ./*.tgz
        working-directory: vantadb-node