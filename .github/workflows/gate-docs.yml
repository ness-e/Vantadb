name: 'GATE: Docs — Lint & Frontmatter'

on:
  push:
    branches: [main]
    paths: ["docs/**", "src/server/router.rs", "src/server/routing.rs", "scripts/**", "Cargo.toml", "vantadb-ts/package.json", "vantadb-node/package.json"]
  pull_request:
    branches: [main, develop]
    paths: ["docs/**", "src/server/router.rs", "src/server/routing.rs", "scripts/**", "Cargo.toml", "vantadb-ts/package.json", "vantadb-node/package.json"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Lint Markdown
        run: npx markdownlint-cli2 "docs/**/*.md"

  check-format:
    name: Check Frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check frontmatter required fields
        run: |
          PASS=true
          for f in $(find docs -name "*.md"); do
            if head -1 "$f" | grep -q "^---$"; then
              title=$(sed -n '/^---$/,/^---$/p' "$f" | grep -i "^title:" | head -1)
              if [ -z "$title" ]; then
                echo "::error file=$f::Missing frontmatter field: title"
                PASS=false
              fi
            fi
          done
          if [ "$PASS" != "true" ]; then exit 1; fi
          echo "All documents have valid frontmatter."

  check-api-version:
    name: Check API Docs Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check OpenAPI/router parity (GOV-B4)
        run: node scripts/check_openapi_parity.mjs
      - name: Check docs/api headers match workspace version
        run: |
          VER=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | grep '^version' | head -1 | awk '{print $3}' | tr -d '"')
          echo "Workspace version: $VER"
          FAIL=0
          # openapi.yaml info.version (first version: line in file)
          OAPI=$(grep -m1 '^  version:' docs/api/openapi.yaml | awk '{print $2}' | tr -d '"')
          echo "openapi.yaml: $OAPI"
          if [ "$OAPI" != "$VER" ]; then
            echo "::error file=docs/api/openapi.yaml::version $OAPI != workspace $VER"
            FAIL=1
          fi
          # MCP.md implementation version (tracks workspace version; HTTP_API.md is protocol version 0.0.4 — intentionally not checked)
          MCP=$(grep -m1 'Current MCP implementation version:' docs/api/MCP.md | awk '{print $NF}')
          echo "MCP.md: $MCP"
          if [ "$MCP" != "$VER" ]; then
            echo "::error file=docs/api/MCP.md::version $MCP != workspace $VER"
            FAIL=1
          fi
          if [ "$FAIL" != "0" ]; then exit 1; fi
          echo "All tracked API doc headers match workspace version $VER."

  # FIND-230: the sibling of `check-api-version` for npm packaging. A stale
  # `vantadb-ts/package.json` made the 0.8.0 tag ask npm for an already
  # published version, so release-npm-61 skipped the publish in a green run
  # (run 37045932895). Pure string comparison, no network, no build.
  check-npm-versions:
    name: Check npm package versions match workspace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Self-test
        run: node scripts/docs/check-npm-versions.mjs --self-test
      - name: Gate — npm versions match the workspace version
        run: node scripts/docs/check-npm-versions.mjs
      - name: Machine-readable report on failure
        if: failure()
        run: node scripts/docs/check-npm-versions.mjs --json
        continue-on-error: true # CATEGORY: INFORMATIONAL - extra detail for a red build; the gate step already failed

  check-frontier:
    name: Check Product Frontier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate product frontier (docs vs features/routes)
        run: pwsh -NoProfile -File scripts/validate-frontier.ps1
