# CI Gate — reusable workflow.
# Heavy/scheduled workflows call this first: if the CI of the current main
# commit is red, the gate fails and dependent jobs (needs: ci-gate) are skipped,
# avoiding hours of wasted heavy runs that would fail anyway.

name: CI Gate

on:
  workflow_call:
    inputs:
      event_name:
        type: string
        required: true

permissions:
  checks: read

jobs:
  ci-gate:
    name: Main is green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check main CI status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          SHA="${GITHUB_SHA}"
          # En PRs GITHUB_SHA es el merge efímero (sin check-runs) → usar el head SHA (EST-03).
          if [ -n "${HEAD_SHA}" ]; then
            SHA="${HEAD_SHA}"
          fi
          REPO="${{ github.repository }}"
          echo "Checking CI status for ${REPO} @ ${SHA}"
          REQUIRED=(
            "Format Check"
            "Clippy Lints"
            "Tests (Linux)"
            "Tests (Windows)"
            "Tests (macOS)"
            "MSRV Check (1.94.1)"
            "Experimental Crates Check"
            "Security Audit"
            "OSV-Scanner"
            "Unused Deps (cargo-machete)"
            "Miri (UB Detection)"
            "Dependency Policy Check"
            "Analyze"
          )
          # Semver Checks excluded: guard ref==main/base_ref==main skips it on develop (no check-run → false red).
          # ADR Gate excluded: guard event==pull_request skips it on push/schedule (no check-run → false red).
          FAILED=0
          for c in "${REQUIRED[@]}"; do
            CONCLUSION=$(gh api "repos/${REPO}/commits/${SHA}/check-runs?per_page=100&filter=latest" \
              --jq ".check_runs[] | select(.name==\"${c}\" and .status==\"completed\") | .conclusion" | head -n1)
            echo "  ${c} -> ${CONCLUSION:-<not found>}"
            case "${CONCLUSION}" in
              success) ;;
              failure|timed_out|cancelled|action_required) FAILED=1 ;;
              *) FAILED=1 ;; # fail-closed: missing/pending check fails the gate
            esac
          done
          if [ "${FAILED}" = "1" ]; then
            echo "::error::main CI is red — aborting this heavy run"
            exit 1
          fi
          echo "Main CI is green — proceeding"
