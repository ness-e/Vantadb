# CI Gate — reusable workflow.
# Heavy/scheduled workflows call this first: if the CI of the current main
# commit is red, the gate fails and dependent jobs (needs: ci-gate) are skipped,
# avoiding hours of wasted heavy runs that would fail anyway.
# Re-checked 2026-09-24 (EST-03): measures main HEAD; skipped/neutral pass;
# checks with no completed runs on main are tolerated with a WARN.

name: CI Gate

on:
  workflow_call:
    inputs:
      event_name:
        type: string
        required: true

permissions:
  checks: read

jobs:
  ci-gate:
    name: Main is green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check main CI status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          # Gate intent (see header): assert that the CI of the MAIN branch head is
          # green before heavy/scheduled runs. Always resolve main's HEAD via API:
          # PR merges create ephemeral SHAs with no check-runs, and querying the
          # PR/caller SHA fails closed while its checks are still pending (EST-03).
          SHA=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          echo "Checking CI status for ${REPO} @ main HEAD ${SHA}"
          REQUIRED=(
            "Format Check"
            "Clippy Lints"
            "Tests (Linux)"
            "Tests (Windows)"
            "Tests (macOS)"
            "MSRV Check (1.94.1)"
            "Experimental Crates Check"
            "Security Audit"
            "OSV-Scanner"
            "Unused Deps (cargo-machete)"
            "Miri (UB Detection)"
            "Dependency Policy Check"
            "Analyze"
          )
          # Semver Checks excluded: guard ref==main/base_ref==main skips it on develop (no check-run → false red).
          # ADR Gate excluded: guard event==pull_request skips it on push/schedule (no check-run → false red).
          # EST-03 policy (owner-approved 2026-09-24): one API call, latest completed
          # conclusion per check name; success|skipped|neutral pass (some guards skip
          # by design); failure|timed_out|cancelled|action_required fail; checks with
          # no completed runs on main are tolerated with a WARN (never-run != red).
          RUNS=$(gh api "repos/${REPO}/commits/${SHA}/check-runs?per_page=100&filter=latest")
          FAILED=0
          for c in "${REQUIRED[@]}"; do
            CONCLUSION=$(jq -r --arg c "${c}" \
              '[.check_runs[] | select(.name==$c and .status=="completed")] | sort_by(.started_at) | last | .conclusion // "<missing>"' \
              <<<"${RUNS}")
            echo "  ${c} -> ${CONCLUSION}"
            case "${CONCLUSION}" in
              success|skipped|neutral) ;;
              failure|timed_out|cancelled|action_required) FAILED=1 ;;
              *) echo "::warning::${c} has no completed runs on main — tolerated (EST-03)" ;;
            esac
          done
          if [ "${FAILED}" = "1" ]; then
            echo "::error::main CI is red — aborting this heavy run"
            exit 1
          fi
          echo "Main CI is green — proceeding"
