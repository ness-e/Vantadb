# DIST-21: native Node-API load matrix + packaging contract for Electron desktop hosts.
# Scope: NEW workflow only (existing 18 workflows + release*.yml untouched).
# SHAs pinned per docs/dev/workflow/RULES.md (pattern: ci-fleet.yml — SHA + "# <version>" comment).
# Full Electron-headless job (real app.asar + asarUnpack) is S2b in docs/dev/tasks/DIST-19.md
# and needs Ego's Electron harness — this workflow covers the ABI/load half on all 3 OSes.

name: electron-node

on:
  pull_request:
    branches: [main]
    paths:
      - "vantadb-node/**"
      - ".github/workflows/electron-node.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-matrix:
    name: native load (${{ matrix.os }})
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vantadb-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - run: npm ci
      - run: npm run build
      - name: smoke load .node (connect + put + get + close)
        run: |
          node -e "const m = require('./index.cjs'); const VantaDb = m.VantaDb || m.VantaDB; (async () => { const db = await VantaDb.connect(require('os').tmpdir() + '/vanta-smoke'); await db.put({namespace: 'smoke', key: 'k', payload: 'hi'}); const r = await db.get('smoke', 'k'); if (!r) throw new Error('get empty'); await db.close(); console.log('smoke ok'); })()"
      - run: npm test

  packaging-contract:
    name: packaging contract (asarUnpack)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vantadb-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: assert .node shippable + targets cover win/mac/linux
        run: |
          node -e "const p = require('./package.json'); if (!p.files.some(f => f.includes('.node'))) throw new Error('files[] must ship *.node'); const t = p.napi.targets.join(' '); for (const s of ['windows', 'linux', 'darwin']) if (!t.includes(s)) throw new Error('missing target ' + s); console.log('packaging contract ok:', p.napi.targets.length, 'targets')"
      - name: asarUnpack checklist for Electron host
        run: |
          echo "Host packager MUST set asarUnpack: ['**/*.node'] so NativeVantaDB loads from unpacked asar (S2b validates against real Electron)"
