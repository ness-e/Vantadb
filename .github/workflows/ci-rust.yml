name: "CI: Rust — Build & Lint + Tests"

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".config/nextest.toml"
      - ".github/workflows/ci-rust.yml"
      - ".github/actions/rust-setup/**"
      - ".cargo/**"
      - "deny.toml"
      - "osv-scanner.toml"
      - "rust-toolchain.toml"
      - "vantadb-*/**"
      - "vanta-memory/**"
      - "vanta-proxy/**"
      - "integrations/**"
      - "providers/**"
      - ".gitleaks.toml"
      - ".secretlintrc.json"
      - ".secretlintignore"
      - "release-plz.toml"
      - "release-manifest.json"
      - "cliff.toml"
  # FIND-770: `pull_request` NO lleva `paths:` a proposito. Un workflow que no
  # arranca no reporta NINGUN check-run: sus checks quedan en `Pending` y el PR
  # no se puede mergear si son required
  # (docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
  # §on.<push|pull_request>.<paths>). 10 de los 14 contexts required de
  # `develop` (ruleset 23692587) salen de este fichero, y fuera de la lista
  # quedaban 1280 de 2353 ficheros tracked (54,4 %) - 959 bajo `docs/`.
  #
  # El filtro NO se pierde: se mueve adentro, al job `rust-scope`, porque los
  # patrones existen para no correr en cada PR los jobs caros que no puede
  # afectar (medido en el run 45821093876: Tests Windows 3426 s, macOS 1586 s,
  # Linux 658 s, Clippy 671 s). Un job omitido por `if:` SI reporta su
  # check-run, con conclusion `skipped`, que GitHub trata como 'Success' y no
  # bloquea el merge aunque el check sea required
  # (docs.github.com/en/pull-requests/reference/status-checks).
  # Mismo razonamiento y mismo remedio que `FIND-765` en `docs-gates.yml`.
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

# FIND-764: `cancel-in-progress` SOLO en `pull_request`. El grupo es
# `github.ref`, y ese ref significa cosas distintas por evento:
#
# - `push` -> `refs/heads/develop`. El run que se mata es el UNICO de este
#   workflow que va a reportar por ese SHA, y el SHA se queda en la historia de
#   la rama: matarlo deja un commit integrado sin suite. Medido el 2026-11-26 en
#   `cd7d8c5f7` (integrado en `develop`): el run termino en `cancelled`;
#   `Tests (Windows)` murio a los 35m23s y su check-run nombra el mecanismo en
#   la anotacion -"Canceling since a higher priority waiting request for
#   CI: Rust - Build & Lint + Tests-refs/heads/develop exists"-. En el mismo
#   SHA, `Tests (Linux)` habia quedado `cancelled` a los 17m53s sin ejecutar un
#   test (murio compilando `vantadb_py`, 0 `test result`), pero ningun run de
#   `ci-rust` existia a esa hora: esa cancelacion NO se pudo atribuir. Es el
#   segundo modo de fallo del mismo sintoma: un SHA sin suite, por causas que el
#   resumen del run no distingue. Frecuencia del dia: 1 de 9 runs de `develop`.
# - `pull_request` -> `refs/pull/N/merge`, que GitHub RECONSTRUYE en cada push:
#   el head revisado trae su propio run nuevo, asi que cancelar el viejo tira
#   trabajo de un SHA que ya nadie revisa. Mismo criterio y mismo remedio que
#   `FIND-771` en `docs-gates.yml`.
#
# Coste de serializar los push, medido sobre los 9 runs de `develop` de hoy:
# duracion del run 24m13s-69m35s (mediana 39m32s), y de los 8 huecos entre
# pushes solo 1 (49m21s) cae dentro del run anterior -> habria esperado, sin
# perder nada; los otros 7 llegaron con 12m27s-2h36m12s de margen sobre el
# `updatedAt` del anterior. Ningun PR espera: su grupo es otro ref.
#
# Los bloques `concurrency` de job llevan la misma expresion, por la misma
# razon: con el grupo de workflow serializando el ref son inertes hoy -solo un
# run por ref ejecuta jobs, asi que `fmt-refs/heads/develop` jamas tiene dos
# contendientes-, pero un cambio futuro del grupo de workflow no debe resucitar
# esta clase en un check required.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-scope:
    # FIND-770: `on.pull_request` no lleva `paths:` (ver el bloque `on:`), asi
    # que el filtro vive aqui. Este job contesta "¿este PR toca alguno de los
    # patrones Rust?" y `clippy` -que es el primer eslabon de la cadena de
    # compilacion- se gatea con su respuesta.
    #
    # `rust=false` NO deja ningun context sin reportar: `clippy` se omite por
    # `if:` y los 9 jobs que lo llevan en `needs` (tests Linux/Windows/macOS,
    # embeddings, coverage, miri, asan, experimental, release-combo) se omiten
    # por dependencia -"If a job fails or is skipped, all jobs that need it are
    # skipped", workflow-syntax §jobs.<job_id>.needs-. Un job omitido reporta su
    # check-run como `skipped` = 'Success', incluso si es required
    # (docs.github.com/en/pull-requests/reference/status-checks).
    #
    # Fail-open a proposito, misma politica que `wasm-scope` (FIND-725): no es
    # un PR, base irresoluble, diff fallido o un scope que no termina bien
    # corren los gates. Un falso positivo cuesta minutos de runner; un falso
    # negativo pierde una suite entera en silencio (`skipped`, no `failure`).
    #
    # Este job NO lleva `if:` propio, y no es un olvido: en un `push` sale por
    # el primer branch del script (no es `pull_request`) y cuesta ~5 s de
    # checkout. Ponerle un `if: github.event_name == 'pull_request'` haria que
    # en cada push quedara `skipped`, y con eso `clippy` y los 8 jobs de su
    # cadena tambien: el deadlock, por la puerta del guard.
    name: Rust Scope (PR paths)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.changed.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Shallow clone basta: la base se busca por SHA abajo (mismo truco que
        # `adr-gate`) y un diff de arboles no necesita historia.

      - name: Detect Rust-relevant changes in the PR range
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "event=$EVENT_NAME (not a pull_request) — running the Rust gates"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${BASE_SHA:-}" ]; then
            echo "::warning::no base SHA on this pull_request — fail-open: running the Rust gates"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git fetch --depth 1 origin "$BASE_SHA"; then
            echo "::warning::cannot fetch base commit $BASE_SHA — fail-open: running the Rust gates"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `--no-renames` + `-z`/`quotePath=false`: los dos mismos traps que
          # `wasm-scope` (un fichero movido imprime solo su ruta nueva; git
          # C-quotea rutas no-ASCII y el `"` inicial romperia el match).
          if ! changed="$(git -c core.quotePath=false diff --name-only --no-renames -z "$BASE_SHA" HEAD | tr '\0' '\n')"; then
            echo "::warning::git diff $BASE_SHA..HEAD failed — fail-open: running the Rust gates"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Espejo de `on.push.paths` (24 patrones; superset de los 22 que
          # llevaba `pull_request`: `.cargo/**` y `.github/actions/rust-setup/**`
          # eran solo de push). Mantener las dos listas en sync: un path que
          # dispara el workflow en push tiene que disparar los gates en el PR.
          # Anclado con ^ y terminado en `/` o `$` para que un prefijo no se
          # escape (`src/` no debe casar `src-tauri/`).
          PATTERNS='^(src/|tests/|benches/|Cargo\.toml$|Cargo\.lock$|build\.rs$|\.config/nextest\.toml$|\.github/workflows/ci-rust\.yml$|\.github/actions/rust-setup/|\.cargo/|deny\.toml$|osv-scanner\.toml$|rust-toolchain\.toml$|vantadb-[^/]+/|vanta-memory/|vanta-proxy/|integrations/|providers/|\.gitleaks\.toml$|\.secretlintrc\.json$|\.secretlintignore$|release-plz\.toml$|release-manifest\.json$|cliff\.toml$)'

          echo "--- files changed in $BASE_SHA..HEAD ---"
          printf '%s\n' "$changed"
          # Here-string, no pipe: `printf ... | grep -q` bajo `set -o pipefail`
          # hace que un `grep` que sale en el primer match cierre el pipe y
          # `printf` muera con SIGPIPE (141) -> el pipeline da no-cero y la
          # respuesta seria `rust=false` con un PR que SI toca Rust. Silencioso
          # y en la direccion catastrofica.
          #
          # `rc`: `grep` devuelve 0 (match), 1 (sin match) o 2 (regex rota).
          # Tratar 2 como "sin match" apagaria los gates en TODOS los PRs por un
          # typo en el patron, sin que nada se ponga rojo: fail-open.
          rc=0
          grep -qE "$PATTERNS" <<< "$changed" || rc=$?
          case "$rc" in
            0) echo "rust=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "rust=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::warning::grep exited $rc (malformed pattern?) — fail-open: running the Rust gates"
               echo "rust=true" >> "$GITHUB_OUTPUT" ;;
          esac

  secret-scan:
    name: Secret Scan (gitleaks + secretlint)
    # TEC-10 (Q27 Opción B) + BIZ-18: Blindaje obligatorio de secretos en CI.
    # Detecta tokens de crates.io, PyPI, npm, GitHub PATs, private keys y APIs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: secret-scan-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Run secretlint
        run:
          npx --yes -p secretlint -p @secretlint/secretlint-rule-preset-recommend secretlint "**/*"

  fmt:
    name: Format Check
    # Sin guard de dependabot (FIND-472): un job omitido por `if:` reporta
    # 'skipped' y GitHub cuenta 'skipped' como required check SATISFECHO.
    # Este check es barato (fmt (rustfmt) tarda segundos y ya compila el codigo) y es required: si se omite, un PR de
    # Dependabot mergearia sin el. Los jobs caros siguen blindados.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fmt-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          components: rustfmt
          swap-mb: 0
          install-system-deps: false

      - name: Format Check
        run: cargo fmt --check

  clippy:
    name: Clippy Lints
    # Sin guard de dependabot (FIND-472): un job omitido por `if:` reporta
    # 'skipped' y GitHub cuenta 'skipped' como required check SATISFECHO.
    # Este check es barato (clippy compila el codigo: es el control mas barato que existe) y es required: si se omite, un PR de
    # Dependabot mergearia sin el. Los jobs caros siguen blindados.
    #
    # FIND-770: el guard nuevo es por PATH, no por actor, y no contradice lo de
    # arriba: un PR de Dependabot toca `Cargo.toml`/`Cargo.lock`, que estan en
    # los patrones de `rust-scope`, asi que corre clippy igual. Lo que se omite
    # es un PR que no toca ni un fichero que el build lea (`docs/**` & cia).
    # Sobre `skipped` como 'Success' requerido, ver el comentario de abajo.
    needs: [rust-scope]
    if: >-
      !cancelled() && (needs.rust-scope.outputs.rust == 'true' ||
      needs.rust-scope.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: lint-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
          install-nextest: false
          install-system-deps: true
          swap-mb: 4096

      - name: Clippy Lints (core)
        # AUD-018: gate extended to vantadb-wasm / vantadb-server / vantadb-mcp.
        # Verified 2026-08-12: clippy clean on all three (exit 0, no warnings).
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  semver-checks:
    # RELEASE-01: gate so a breaking change in the public API can never publish.
    # release-plz.toml has semver_check = true, but nothing ran cargo-semver-checks
    # as a CI gate — this job closes that gap. Compares the current tree against
    # the latest published version on crates.io (0.4.x baseline vs 0.5.0).
    # Only `vantadb` is checked: vantadb-wasm is npm-distributed (release = false),
    # and python/server/mcp are not crates.io-distributed.
    # SCOPE: main pushes + PRs targeting main only (base_ref guards PRs aimed
    # at develop). On develop the baseline comparison is permanently red while
    # features accumulate pre-release (13 majors today heading into 0.6.0) —
    # pure noise that hides real regressions. The release decision (major vs
    # minor) is made once, at the develop→main PR.
    # HARD-01: rails inventory + triage of accepted deltas:
    # docs/api/COMPATIBILITY.md. Companion snapshot job: public-api-snapshot.
    name: Semver Checks (public API)
    # FIND-770: mismo guard por path que `clippy`. Sin el, un PR solo-docs
    # contra `main` gastaria ~30 min de nightly rustdoc en un cambio que no
    # puede tocar la API publica.
    needs: [rust-scope]
    runs-on: ubuntu-latest
    if: >-
      !cancelled() && github.actor != 'dependabot[bot]' &&
      (github.ref == 'refs/heads/main' || github.base_ref == 'main') &&
      (needs.rust-scope.outputs.rust == 'true' || needs.rust-scope.result != 'success')
    timeout-minutes: 30
    concurrency:
      group: semver-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          install-nextest: false
          install-llvm-cov: false
          install-system-deps: true
          swap-mb: 4096

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-semver-checks

      - name: Verify cargo-semver-checks is present (HARD-01, no silent skip)
        run: cargo semver-checks --version

      - name: Semver check (vantadb vs latest published)
        continue-on-error: true # CATEGORY: INFORMATIONAL - pre-release delta signal on develop->main PR; exits 0 on release commit bump (docs/api/COMPATIBILITY.md)
        run: cargo semver-checks -p vantadb --release-type minor

  public-api-snapshot:
    # HARD-01: golden snapshot of the `vantadb` public API
    # (tests/api/public-api.txt <- tests/api/public_api.rs; nightly rustdoc JSON
    # + public-api). Same scope as semver-checks: generation needs a nightly
    # rustdoc build (measured 2026-09-27: ~81 s warm, ~6 min on the first cold
    # rustdoc build; not Fast-Gate material). A surface change must update the
    # snapshot (VANTADB_PUBLIC_API_UPDATE=1) in the PR; rails inventory:
    # docs/api/COMPATIBILITY.md.
    name: Public API Snapshot
    # FIND-770: mismo guard por path que `clippy` (45 min de nightly rustdoc).
    needs: [rust-scope]
    runs-on: ubuntu-latest
    if: >-
      !cancelled() && github.actor != 'dependabot[bot]' &&
      (github.ref == 'refs/heads/main' || github.base_ref == 'main') &&
      (needs.rust-scope.outputs.rust == 'true' || needs.rust-scope.result != 'success')
    timeout-minutes: 45
    concurrency:
      group: public-api-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          install-nextest: true
          install-llvm-cov: false
          install-system-deps: true
          swap-mb: 4096

      - name: Public API snapshot matches committed golden file
        run: cargo nextest run -p vantadb --test public_api --run-ignored ignored-only --locked

  adr-gate:
    # REGLA-5: public API changes require an ADR. Without this job the rule
    # depended on agent memory — this is the mechanical gate. Runs only on PRs
    # (push to main already passed its own PR gate); compares the PR changeset
    # against the base SHA and fails when public API files changed unless an
    # ADR (docs/dev/architecture/adr/ADR-NNN-*.md) was added OR the PR is explicitly
    # marked [no-adr] in the title/description with a justification.
    # Lazy by design: one depth-1 fetch + two-tree diff — no full history.
    name: ADR Gate (public API)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch base SHA
        run: git fetch --depth 1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Detect API surface + ADR changes
        id: detect
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only "$BASE" HEAD)"
          echo "--- changed files ---"
          printf '%s\n' "$changed"

          api=""
          for p in src/ vantadb-python/ vantadb-ts/ vantadb-server/ vantadb-wasm/; do
            if printf '%s\n' "$changed" | grep -q "^$p"; then
              api="${p%/}"
              break
            fi
          done
          # Single-line: a multiline value breaks the $GITHUB_OUTPUT file-command
          # parser ("Invalid format" / "Unable to process file command 'output'"
          # when a PR touches 2+ ADRs — run 35467546726). paste joins with spaces.
          adr="$(printf '%s\n' "$changed" | grep -E '^docs/dev/architecture/adr/ADR-[0-9]{3}' | paste -sd' ' - || true)"

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "adr=$adr" >> "$GITHUB_OUTPUT"

      - name: Fail — API change without ADR
        if: >-
          steps.detect.outputs.api != '' && steps.detect.outputs.adr == '' &&
          !contains(github.event.pull_request.title, '[no-adr]') &&
          !contains(github.event.pull_request.body, '[no-adr]')
        run: |
          echo "::error::Public API surface changed (${{ steps.detect.outputs.api }}) without an ADR."
          echo "::error::Add an ADR to docs/dev/architecture/adr/ (format ADR-NNN, see ADR-0001) or, if no ADR is warranted, mark this PR '[no-adr]' in the title/description with a one-line justification."
          exit 1

      - name: Acknowledge [no-adr] marker
        if: >-
          steps.detect.outputs.api != '' && steps.detect.outputs.adr == '' &&
          (contains(github.event.pull_request.title, '[no-adr]')
              || contains(github.event.pull_request.body, '[no-adr]'))
        run: |
          echo "::warning::PR marked [no-adr] — a reviewer must confirm the public API change needs no ADR."

      - name: OK — ADR present
        if: steps.detect.outputs.adr != ''
        run: 'echo "ADR present: ${{ steps.detect.outputs.adr }}"'

  test:
    name: Tests (Linux)
    # FIND-787: el actor-guard de dependabot SE QUITÓ a propósito. Con el guard de
    # abajo required, un job saltado por `if:` haría rojo todo PR de dependabot; y un
    # required que se salta deja el candado sin medir (GitHub cuenta `skipped` como
    # satisfecho). Dependabot toca Cargo.toml/Cargo.lock, que es justo donde esta
    # suite mide. Coste aceptado por el owner: la suite corre entera en sus PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [fmt, clippy, secret-scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
          install-nextest: true
          install-system-deps: true
          swap-mb: 8192
          shared-key: linux-stable

      - name: Cache benchmark dataset (GloVe 100d)
        id: cache-benchmark
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/benchmark/glove.6B.100d.txt
          key: glove-100d-${{ hashFiles('scripts/download_benchmark_datasets.sh') }}

      - name: Download benchmark datasets
        if: steps.cache-benchmark.outputs.cache-hit != 'true'
        run: bash scripts/download_benchmark_datasets.sh
        shell: bash

      - name: Run tests (Audit profile, core)
        # FIND-392: explicit -p per default-member (vantadb, python, memory,
        # server, mcp) preserves prior default-members coverage; --locked
        # prevents Cargo.lock drift.
        run:
          cargo nextest run --profile audit --features "cli,arrow,tls,opentelemetry"
          -p vantadb -p vantadb_py -p vanta-memory -p vantadb-server -p vantadb-mcp
          --locked

      - name: Upload test report (failures only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-linux
          path: junit.xml
          if-no-files-found: warn

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    needs: [fmt, clippy, secret-scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: 1.95.0
          components: clippy
          install-nextest: true
          shared-key: windows-stable

      - name: Cargo check (Windows smoke test)
        # FIND-392: -p per default-member + --locked (same coverage as before).
        run:
          cargo check -p vantadb -p vantadb_py -p vanta-memory -p vantadb-server
          -p vantadb-mcp --locked

      - name: Clippy (Windows)
        # CATEGORY: EXPERIMENTAL — excludes experimental crates.
        run:
          cargo clippy --workspace --all-targets --all-features --exclude vantadb-wasm --exclude
          vantadb-server --exclude vantadb-mcp --locked -- -D warnings

      - name: Run quick integrity tests (Windows)
        shell: pwsh
        # FIND-392: -p per default-member + --locked (same coverage as before).
        run:
          cargo nextest run --profile ci-windows --features "cli,arrow,tls,opentelemetry"
          -p vantadb -p vantadb_py -p vanta-memory -p vantadb-server -p vantadb-mcp
          --locked

      - name: Upload test report (failures only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-windows
          path: junit.xml
          if-no-files-found: warn

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [fmt, clippy, secret-scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
          install-nextest: true
          shared-key: macos-stable

      - name: Install system dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install rocksdb llvm
          echo "ROCKSDB_LIB_DIR=$(brew --prefix rocksdb)/lib" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Cargo check (macOS smoke test)
        # FIND-392: -p per default-member + --locked (same coverage as before).
        run:
          cargo check -p vantadb -p vantadb_py -p vanta-memory -p vantadb-server
          -p vantadb-mcp --locked

      - name: Clippy (macOS)
        # CATEGORY: EXPERIMENTAL — excludes experimental crates.
        run:
          cargo clippy --workspace --all-targets --all-features --exclude vantadb-wasm --exclude
          vantadb-server --exclude vantadb-mcp --locked -- -D warnings

      - name: Run tests (Audit profile, core)
        shell: bash
        # FIND-392: -p per default-member + --locked (same coverage as before).
        run:
          cargo nextest run --profile audit --features "cli,arrow,tls,opentelemetry"
          -p vantadb -p vantadb_py -p vanta-memory -p vantadb-server -p vantadb-mcp
          --locked

      - name: Upload test report (failures only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-macos
          path: junit.xml
          if-no-files-found: warn

  tests-guard:
    # FIND-787 (2026-11-26): un job que se salta reporta `skipped`, y GitHub
    # cuenta `skipped` como required check SATISFECHO. Textual, en
    # docs.github.com/en/pull-requests/reference/status-checks: "A job that is
    # skipped will report its status as 'Success'. It will not prevent a pull
    # request from merging, even if it is a required check." Medido en el
    # push `43e41f055`: `Secret Scan` en rojo -> los tres `Tests
    # (Linux/Windows/macOS)` quedaron `skipped` (`steps: []`, `runner` vacio,
    # `started_at` 21:29:32Z POSTERIOR a `completed_at` 21:29:31Z: nunca
    # vieron un runner) y el
    # candado de `develop` se cerro con la suite SIN ejecutar un solo test.
    # `Secret Scan` no esta entre los 14 contexts required de 23692587, asi
    # que nada mas bloqueaba: el unico efecto del rojo fue apagar tres gates.
    #
    # Este job es la mitad que faltaba. `needs` + `if: always()` lo hacen
    # correr SIEMPRE, incluso cuando los tres se saltaron, y convierte el
    # `skipped` en ROJO nombrando el job. No reemplaza a los tres (ellos
    # siguen siendo los required): agrega el unico veredicto que ellos no
    # pueden dar -"se ejecuto?"- sin exigir que corran cuando `rust-scope` ya
    # midio que no hay nada que medir.
    #
    # Por que NO un check que solo se publique cuando la suite ejecuta
    # (la otra opcion de la fila): un context required ausente queda
    # `Pending` para siempre -el deadlock de `FIND-765`, y la forma de
    # `FIND-791`-. Un required TIENE que reportar en cada run; lo unico
    # elegible es que el reporte de "no ejecuto" sea rojo. Eso es este job.
    #
    # Inerte hasta que el owner lo agregue al ruleset (decision suya, ver
    # docs/dev/tasks/FIND-787.md "Cambio de ruleset propuesto"). No es el
    # deadlock de FIND-765 justamente porque reporta siempre: `ci-rust.yml`
    # no lleva `paths:` en `pull_request:` (FIND-770) y `if: always()` no
    # depende del evento ni del actor.
    name: Tests Executed (guard)
    needs: [rust-scope, test, test-windows, test-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Mismo bloque que el resto de jobs del fichero, por el mismo motivo que
    # documenta el `concurrency:` de workflow: hoy es inerte (el grupo de
    # workflow serializa el ref), pero un cambio futuro de ese grupo no debe
    # resucitar la clase en un check required.
    concurrency:
      group: tests-guard-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Fail when a required test check was skipped instead of executed
        env:
          SCOPE: ${{ needs.rust-scope.outputs.rust }}
          SCOPE_RESULT: ${{ needs.rust-scope.result }}
          LINUX: ${{ needs.test.result }}
          WINDOWS: ${{ needs.test-windows.result }}
          MACOS: ${{ needs.test-macos.result }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          # Unico `skipped` legitimo: `rust-scope` MIDIO el diff del PR y no
          # hay nada que el build Rust lea. No es una omision, es una decision
          # con evidencia; el job la registra y pasa. Fail-closed en el resto:
          # scope roto o sin valor -> se exige ejecucion.
          if [ "${SCOPE:-}" = "false" ] && [ "${SCOPE_RESULT:-}" = "success" ]; then
            echo "rust-scope measured the diff: not a Rust change -> the test suites are out of scope"
            exit 0
          fi

          failed=""
          for entry in "Tests (Linux)=${LINUX:-unknown}" "Tests (Windows)=${WINDOWS:-unknown}" "Tests (macOS)=${MACOS:-unknown}"; do
            job="${entry%=*}"
            case "${entry##*=}" in
              success|failure) echo "  ${job} -> ${entry##*=} (executed)" ;;
              *) failed="${failed}${job} (${entry##*=}); "
                 echo "::error::${job} reported '${entry##*=}' (actor ${ACTOR:-unknown}) - a required check satisfied by a skip measured nothing (FIND-787)" ;;
            esac
          done

          if [ -n "$failed" ]; then
            echo "::error::The required test suite did not execute: ${failed}fix the upstream cause and re-run - do not merge on a skip"
            exit 1
          fi
          echo "All three required test suites executed"

  test-embedding-features:
    name: Tests (embeddings features)
    # FIND-489: el gate NO corria los tests del lib con `remote-inference` ni con
    # `embed-local`, asi que un contrato roto del brazo vectorial llego a `develop`
    # con 5 tests preexistentes en rojo y ningun check lo vio (FIND-413). Con esas
    # features cambia el contrato del operador vectorial (provider caido -> error,
    # no 0 hits) y el `cfg` de `LlmCfg::for_local_model` solo tiene llamador en el
    # build `embed-local`, asi que hacen falta **las dos** combinaciones por separado.
    # Es un job de LIB: lo que cambia con esas features es el contrato, y los tests
    # del lib lo cubren sin red (el embedder se inyecta).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fmt, clippy, secret-scan]
    # Matriz: las 2 combinaciones en paralelo (~18 min pared en vez de ~36).
    strategy:
      fail-fast: false
      matrix:
        features: [remote-inference, embed-local]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          install-nextest: true
          install-system-deps: true
          swap-mb: 8192
          shared-key: embedding-${{ matrix.features }}

      - name: Run lib tests (${{ matrix.features }})
        run:
          cargo nextest run -p vantadb --lib --profile audit --features
          "cli,arrow,tls,opentelemetry,${{ matrix.features }}" --locked

  msrv:
    name: MSRV Check (1.95.0)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: 1.95.0
          install-nextest: false
          install-llvm-cov: false

      - name: cargo check (MSRV, core)
        run: cargo check --locked

  minimal-versions:
    name: Minimal Versions Check (-Zminimal-versions)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CATEGORY: EXPERIMENTAL — nightly-only -Zminimal-versions is unstable.
    # Failure does not indicate a regression in default builds.
    continue-on-error: true # CATEGORY: NON-CRITICAL - senal advisory de resolucion con -Zminimal-versions: puede fallar por versiones no publicadas; no bloquea el merge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          install-nextest: false
          install-llvm-cov: false

      - name: cargo check (minimal-versions, core)
        run: cargo +nightly check -Zminimal-versions

  coverage:
    name: Code Coverage (cargo-llvm-cov)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [fmt, clippy, secret-scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          components: llvm-tools-preview
          install-nextest: true
          install-llvm-cov: true
          install-system-deps: true
          swap-mb: 8192
          shared-key: linux-coverage

      - name: Cache benchmark dataset (GloVe 100d)
        id: cache-benchmark
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/benchmark/glove.6B.100d.txt
          key: glove-100d-${{ hashFiles('scripts/download_benchmark_datasets.sh') }}

      - name: Download benchmark datasets
        if: steps.cache-benchmark.outputs.cache-hit != 'true'
        run: bash scripts/download_benchmark_datasets.sh
        shell: bash

      - name: Run tests with coverage
        # CATEGORY: EXPERIMENTAL — --exclude flags skip experimental crates (server, mcp, wasm).
        run: |
          cargo llvm-cov nextest \
            --profile audit \
            --workspace \
            --locked \
            --features "cli,arrow,tls,opentelemetry" \
            --exclude vantadb-wasm \
            --exclude vantadb-server \
            --exclude vantadb-mcp \
            --lcov --output-path lcov.info \
            --ignore-filename-regex '(tests/|benches/|crash_injection)' \
            2>&1
          echo "--- Coverage Summary ---"
          cargo llvm-cov report --locked \
            --ignore-filename-regex '(tests/|benches/)'

      - name: Enforce coverage threshold (>=80%, ADR-015 coverage policy)
        shell: bash
        run: |
          # ADR-015-coverage-policy: root-gate 80% en CI (bindings/wasm/server/mcp miden en runners nativos)
          cargo llvm-cov report --locked --json \
            --ignore-filename-regex '(tests/|benches/)' \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          data = d.get('data', [])
          if not data:
            print('ERROR: llvm-cov JSON has no data array')
            sys.exit(1)
          totals = data[0].get('totals', {})
          lines = totals.get('lines', {})
          pct = lines.get('percent', 0.0)
          ok = pct >= 80.0
          print(f'Line coverage: {pct:.1f}% {\"✅\" if ok else \"❌\"}')
          sys.exit(0 if ok else 1)
          "

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  wasm-scope:
    # FIND-725: the WASM gate decided on `github.event.head_commit.modified`, which
    # holds the files of the LAST commit of the push only. A multi-commit push whose
    # tip was a docs commit skipped the browser tests even when an earlier commit of
    # the same push touched vantadb-wasm/ (run 45510840907: head `ec1bf9d58` = docs
    # => `WASM (wasm-pack browser tests)` reported `skipped`). This job answers
    # "did the push touch vantadb-wasm/?" over the whole push range and publishes it
    # as an output; `wasm-test` consumes it.
    #
    # The trigger was never wrong: `on.push.paths` already uses a two-dot diff of the
    # push range (workflow-syntax §"Git diff comparisons"). Only the job predicate
    # disagreed with it.
    #
    # Fail-open by design: a missing/unresolvable base, a failed diff, a failed
    # scope job or a non-push event runs the tests. A false positive costs ~2 min;
    # a false negative loses WASM coverage silently (`skipped`, not `failure`).
    #
    # Dependabot PRs skip it: `wasm-test` is excluded for that actor anyway, and
    # unlike fmt/clippy/audit/deny/osv/machete this job is NOT a required check
    # (FIND-472), so the guard costs no coverage.
    name: WASM Scope (push range)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wasm: ${{ steps.changed.outputs.wasm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Shallow clone is enough: the base commit is fetched by SHA below (same
        # trick as adr-gate) and a tree diff needs no history.

      - name: Detect vantadb-wasm changes in the push range
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"

          # `pull_request` carries no `event.before`: keep the previous behaviour
          # (always run) instead of inventing a range. `workflow_dispatch` used to
          # fall through the old predicate and skip the job — a manual dispatch now
          # runs the tests, which is the intended reading of "run the WASM gate".
          if [ "$EVENT_NAME" != "push" ]; then
            echo "event=$EVENT_NAME (not a push) — running the WASM tests"
            echo "wasm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # First push of a branch: `before` is all zeros, there is no range to diff.
          if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$ZERO_SHA" ]; then
            echo "first push of ${GITHUB_REF#refs/heads/} (before=$PUSH_BEFORE) — running the WASM tests"
            echo "wasm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git fetch --depth 1 origin "$PUSH_BEFORE"; then
            echo "::warning::cannot fetch base commit $PUSH_BEFORE — fail-open: running the WASM tests"
            echo "wasm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `--no-renames`: with rename detection a file MOVED out of vantadb-wasm/
          # prints only its new path — a false negative. `-z` + `quotePath=false`:
          # git C-quotes non-ASCII paths by default ("vantadb-wasm/src/\303\261.rs"),
          # so the leading quote breaks the `^vantadb-wasm/` match.
          if ! changed="$(git -c core.quotePath=false diff --name-only --no-renames -z "$PUSH_BEFORE" "$PUSH_AFTER" | tr '\0' '\n')"; then
            echo "::warning::git diff $PUSH_BEFORE..$PUSH_AFTER failed — fail-open: running the WASM tests"
            echo "wasm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "--- files changed in $PUSH_BEFORE..$PUSH_AFTER ---"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -q '^vantadb-wasm/'; then
            echo "wasm=true" >> "$GITHUB_OUTPUT"
          else
            echo "wasm=false" >> "$GITHUB_OUTPUT"
          fi

  wasm-test:
    name: WASM (wasm-pack browser tests)
    needs: [wasm-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # CATEGORY: BEST-EFFORT — WASM is Tier 3 Experimental.
    # Browser tests require wasm-pack + Chrome. Failures are non-blocking.
    continue-on-error: true # CATEGORY: EXPERIMENTAL - target wasm (browser) experimental: el gate de WASM no bloquea el PR; el contrato de la API lo fija el gate de docs
    # `!cancelled()` on purpose (not `always()`): with no status function GitHub
    # applies an implicit `success()` over `needs`, so a failed/timed-out scope job
    # would skip the tests — the silent-coverage hole this task closes, reopened
    # through the dependency. `result != 'success'` is the fail-open branch.
    if: >-
      !cancelled() && github.actor != 'dependabot[bot]' &&
      (needs.wasm-scope.outputs.wasm == 'true' || needs.wasm-scope.result != 'success')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install wasm-pack (prebuilt binary, no cargo compile)
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: wasm-pack

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Run browser tests (Chrome)
        working-directory: vantadb-wasm
        run: wasm-pack test --chrome --headless

  experimental-check:
    name: Experimental Crates Check
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fmt, clippy]
    # CATEGORY: EXPERIMENTAL — server, MCP, WASM, and adapter crates. These
    # crates are not in workspace default-members; this job checks them so
    # regressions surface in CI. Must pass before merge.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          install-system-deps: true
          swap-mb: 4096

      - name: Check experimental server + MCP + WASM crates
        run: cargo check -p vantadb-server -p vantadb-mcp -p vantadb-wasm --locked

      - name: Check experimental adapter crates
        # providers/* are intentionally NOT workspace members (MSVC linker
        # crash on Windows) — check them individually via --manifest-path.
        run: |
          cargo check --manifest-path providers/openai/Cargo.toml --locked
          cargo check --manifest-path providers/ollama/Cargo.toml --locked
          cargo check --manifest-path providers/litellm/Cargo.toml --locked

  release-combo:
    # FIND-231: no job compiled the release profile of the published binaries
    # under `-D warnings` (tests run in debug; desktop.yml builds the same
    # combo but without RUSTFLAGS), so the combo that broke the first
    # release-binaries run (0.8.0, FIND-229: unused imports + dead code under
    # -D warnings with debug_assertions off) only surfaced at release time and
    # burned the cycle. This gate checks the exact release combo — keep in
    # sync with release-binaries.yml:109-122: `server` + allocator for
    # vanta-cli, allocator for vantadb-server.
    # RED-proven against the fix reverted — docs/dev/tasks/FIND-231.md.
    # RUSTFLAGS mirrors the release lane: actions-rust-lang/setup-rust-toolchain
    # (release-binaries) defaults to `-D warnings`; dtolnay/rust-toolchain (used
    # by ./rust-setup) does not — hence the explicit env.
    name: Release Combo (server + allocator, -D warnings)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fmt, clippy]
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          install-system-deps: true
          swap-mb: 4096

      - name: Check release combo — vanta-cli (server + jemalloc)
        run: cargo check --release --features "server,jemalloc" --package vantadb --bin vanta-cli --locked

      - name: Check release combo — vantadb-server (jemalloc)
        run: cargo check --release --features "jemalloc" --package vantadb-server --locked

  feature-combos:
    # FIND-219: the operator build documented in
    # docs/user/operations/DEPLOYMENT_GUIDE.md:65 - `cli,server,tls,opentelemetry,
    # advanced-tokenizer,remote-inference` - had no gate. It is not a subset of an
    # existing lane: the test lanes carry `arrow` in place of
    # `advanced-tokenizer`, so this build also covers the branch where the
    # columnar code path is OFF while `server` is ON, which `clippy
    # --all-features` can never reach (features are additive; the union build
    # compiles exactly one combination).
    # Scope and cost are the contract: `check` - not a test lane - because the
    # behaviour is already covered per feature by the test lanes, and this is a
    # build promise. Measured peers on run 45949538624: Release Combo 1.6 min,
    # Experimental Crates Check 1.6 min, so ~2 min for this one.
    # The ledger this job answers to is docs/feature-matrix.md §2 row 6: change
    # the feature string there in the same commit, or the matrix starts lying.
    # Not added to the `develop` ruleset on purpose: a new combination should
    # earn its track record in red-and-look before it can block a merge.
    name: Feature Combo (server-full)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          install-system-deps: true
          swap-mb: 4096

      - name: Check server-full (the documented self-hosted build)
        run: cargo check --locked --features "cli,server,tls,opentelemetry,advanced-tokenizer,remote-inference" --package vantadb

  audit:
    name: Security Audit
    # Sin guard de dependabot (FIND-472): un job omitido por `if:` reporta
    # 'skipped' y GitHub cuenta 'skipped' como required check SATISFECHO.
    # Este check es barato (cargo-audit: sin el, un bump con CVE entra sin mirar) y es required: si se omite, un PR de
    # Dependabot mergearia sin el. Los jobs caros siguen blindados.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          install-nextest: false
          install-llvm-cov: false
          install-system-deps: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit

      - name: Security Audit
        # Ignores managed in .cargo/audit.toml + deny.toml [advisories]
        run: cargo audit

  osv:
    # FIND-150: OSV-Scanner alongside cargo audit (DoD v2). Same triage as
    # audit/deny lives in osv-scanner.toml (IgnoredVulns mirror) so both
    # scanners agree; licenses stay in deny.toml (OSV does not check licenses).
    # Scope is the root ./Cargo.lock (config does not propagate to
    # desktop/fuzz/providers/node locks). Pinned v2.6.0 via go install;
    # runner Go auto-switches toolchain via GOTOOLCHAIN.
    name: OSV-Scanner
    # Sin guard de dependabot (FIND-472): un job omitido por `if:` reporta
    # 'skipped' y GitHub cuenta 'skipped' como required check SATISFECHO.
    # Este check es barato (OSV-Scanner: segundos y detecta CVEs nuevas en el lockfile) y es required: si se omite, un PR de
    # Dependabot mergearia sin el. Los jobs caros siguen blindados.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install osv-scanner (pinned v2.6.0)
        run: |
          mkdir -p "${{ runner.temp }}/bin"
          curl -fsSL --retry 5 --retry-all-errors "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64" -o "${{ runner.temp }}/bin/osv-scanner"
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  ${{ runner.temp }}/bin/osv-scanner" | sha256sum -c -
          chmod +x "${{ runner.temp }}/bin/osv-scanner"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: OSV scan (root lockfile)
        run: osv-scanner scan source --lockfile ./Cargo.lock --config ./osv-scanner.toml ./

  machete:
    # FIND-150: cargo-machete alongside coverage (DoD v2, deuda P2-5/P2-8).
    # Justified ignores live in [package.metadata.cargo-machete] per crate
    # (build.rs usage + #[path] shared harness); this gate fails on any NEW
    # unjustified unused dep. Pinned 0.9.2, --locked for reproducibility.
    name: Unused Deps (cargo-machete)
    # Sin guard de dependabot (FIND-472): un job omitido por `if:` reporta
    # 'skipped' y GitHub cuenta 'skipped' como required check SATISFECHO.
    # Este check es barato (cargo-machete: segundos, deps sin usar) y es required: si se omite, un PR de
    # Dependabot mergearia sin el. Los jobs caros siguen blindados.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          install-nextest: false
          install-llvm-cov: false
          install-system-deps: false

      - name: Install cargo-machete (pinned 0.9.2)
        run: cargo install cargo-machete --version 0.9.2 --locked

      - name: Unused dependency check (workspace + standalone crates)
        run:
          cargo machete --with-metadata . vantadb-python vantadb-server vantadb-mcp vantadb-wasm
          vanta-memory vanta-proxy vantadb-node

  miri:
    name: Miri (UB Detection)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          components: miri
          install-system-deps: true
          shared-key: miri-nightly

      - name: Miri Setup (core)
        # No --locked: `miri setup` builds a sysroot from rust-src with its own
        # lockfile via rustc-build-sysroot — extra cargo flags are not forwarded
        # to it, so --locked would be a silent no-op here (it is applied to the
        # workspace `cargo test` that `miri test` invokes below).
        run: cargo +nightly miri setup --manifest-path Cargo.toml -p vantadb
        env:
          MIRI_NO_HOST_FALLBACK: 1

      - name: Miri Test (core — unsafe patterns)
        # Run WITHOUT the `roaring` feature: croaring is C FFI that Miri cannot
        # execute. FilterBitset falls back to the pure-Rust Vec<u64> impl so the
        # engine's from_raw_parts/alignment paths still run under the checker.
        # FIND-591: `encryption` is now part of the gate so the decrypted-blob
        # decode paths and `miri_aead_*` run under the checker. `cpufeatures`
        # 0.3 detects `cfg(miri)` and disables CPU-feature detection
        # (`cpufeatures-0.3.0/src/miri.rs`), so `aes`/`polyval` fall back to
        # their software backend — no extra `--cfg` needed.
        run:
          cargo +nightly miri test --manifest-path Cargo.toml -p vantadb --no-default-features
          --locked --features "cli,fjall,memmap2,fs2,encryption" -- miri
        env:
          MIRI_NO_HOST_FALLBACK: 1
          # Header::new reads SystemTime::now() when opening the engine;
          # Miri blocks clock_gettime(REALTIME) under default isolation.
          MIRIFLAGS: "-Zmiri-disable-isolation"
          RUSTFLAGS: "-Zrandomize-layout"

      # ERR-009: Tree Borrows variant (catches violations Stacked Borrows misses,
      # e.g. RUSTSEC-2026-0002 class). Bonus: reuses cached sysroot from above.
      # CATEGORY: BEST-EFFORT — TB can flag false-positives; failures reviewed
      # manually, do not gate releases.
      - name: Miri Test (tree borrows - best effort)
        continue-on-error: true # CATEGORY: BEST-EFFORT - Miri es best-effort por diseno (tree borrows): el gate real de UB es el job `miri`, que es required
        # FIND-591: same `encryption` coverage as the step above.
        run:
          cargo +nightly miri test --manifest-path Cargo.toml -p vantadb --no-default-features
          --locked --features "cli,fjall,memmap2,fs2,encryption" -- miri
        env:
          MIRI_NO_HOST_FALLBACK: 1
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-tree-borrows"
          RUSTFLAGS: "-Zrandomize-layout"

  deny:
    name: Dependency Policy Check
    # Sin guard de dependabot (FIND-472): un job omitido por `if:` reporta
    # 'skipped' y GitHub cuenta 'skipped' como required check SATISFECHO.
    # Este check es barato (deny.toml: politica de licencias y advisories) y es required: si se omite, un PR de
    # Dependabot mergearia sin el. Los jobs caros siguen blindados.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          install-nextest: false
          install-llvm-cov: false
          install-system-deps: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny

      - name: Dependency Policy Check
        run: cargo deny check

  sanitizer-asan:
    name: ASan (AddressSanitizer)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # CI closure (2026-10-06/07): 45 -> 75 min. FIND-244 (fixed) unblocked the
    # suite; it then progressed into the Heavy Certification set under ASan
    # (hardware_certification_full alone: 17.8 min) and was killed at the 45m
    # timeout while running hnsw_validation. The Heavy-tier tests are now
    # skipped below (CI_POLICY tiering: Heavy never gates; it runs in NIGHTLY
    # Heavy Certification) — 75 min is margin for the non-Heavy suite.
    timeout-minutes: 75
    needs: [fmt, clippy]
    # CATEGORY: BEST-EFFORT — nightly ASan can produce false positives.
    # Failures are reviewed manually. Does not gate releases.
    continue-on-error: true # CATEGORY: NON-CRITICAL - ASan no bloquea el PR: es una senal de seguridad costosa y ruidosa; los required checks siguen siendo fmt, clippy y la matriz de tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly
        uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          components: rust-src
          install-system-deps: true
          shared-key: asan-nightly

      - name: Install system deps (llvm-symbolizer)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm

      # FIND-226: without llvm-symbolizer the ASan/LSan leak report printed raw
      # addresses only (BuildId + offsets) — no triage possible. apt `llvm`
      # provides /usr/bin/llvm-symbolizer (Ubuntu noble filelist); the env var
      # is the documented override (clang.llvm.org/docs/AddressSanitizer.html
      # §"Symbolizing the Reports"). Fail loud if absent: a symbolized report
      # is the entire point of this job (job is best-effort by design).
      - name: Resolve llvm-symbolizer (ASan/LSan)
        run: |
          SYMBOLIZER="$(command -v llvm-symbolizer || true)"
          if [ -z "$SYMBOLIZER" ]; then
            SYMBOLIZER="$(find /usr/lib/llvm-* -name llvm-symbolizer -type f 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$SYMBOLIZER" ]; then
            echo "::error::llvm-symbolizer not found after installing llvm"
            exit 1
          fi
          echo "ASAN_SYMBOLIZER_PATH=$SYMBOLIZER" >> "$GITHUB_ENV"
          echo "Using symbolizer: $SYMBOLIZER"

      # CATEGORY: BEST-EFFORT — job-level continue-on-error covers this
      # FIND-236 (2026-10-04): `sift1m_competitive_benchmark` is skipped below —
      # it carries a release-only guard that panics in debug by design
      # (tests/certification/competitive_bench.rs:64), keeping this job red with
      # pre-existing noise (run 37102066714 / job 111086294644). With leaks at zero
      # (FIND-226), red should mean "real leak", not the guard.
      # CI closure (2026-10-06/07): FIND-244 fixed the stale all-zeros test, so
      # the suite ran past it — and spent the whole budget inside the Heavy
      # Certification set (hardware_certification_full 17.8 min, then
      # hnsw_validation killed at the 45m timeout). Heavy-tier material is
      # skipped here (CI_POLICY tiering: hnsw validation / SIFT / competitive
      # bench / stress never gate; they run in NIGHTLY Heavy Certification), so
      # this job stays red only for real memory findings.
      # 2nd pass (2026-10-07): the suite then reached the timing-bound stress
      # tests — their own budgets (60s / 120s) cannot hold under ASan's
      # 10-20x slowdown (multi_namespace_stress: 265s vs its 60s assert) —
      # skipped as timing-bound, not correctness.
      - name: Test with AddressSanitizer
        run: |
          cargo +nightly test \
            --lib --tests --bins \
            --target x86_64-unknown-linux-gnu \
            --package vantadb \
            --locked \
            --features "cli,arrow,tls,opentelemetry" \
            --config 'target.x86_64-unknown-linux-gnu.rustflags = ["-Zsanitizer=address", "-Cunsafe-allow-abi-mismatch=sanitizer"]' \
            -- \
            --skip test_benchmark_internal_10k \
            --skip sift1m_competitive_benchmark \
            --skip hardware_certification_full \
            --skip hnsw_hard_validation_certification \
            --skip hnsw_core_logic_certification \
            --skip recall_certification_runner \
            --skip stress_protocol_certification \
            --skip glove_dimension_scale \
            --skip validate_sift_dataset_integrity \
            --skip test_glove100_hnsw_basic \
            --skip hnsw_recall_snapshot_baseline \
            --skip hnsw_recall_snapshot_deterministic_across_scales \
            --skip test_hybrid_ranking_metrics \
            --skip deterministic_corpus_certifies_text_vector_hybrid_and_phrase_paths \
            --skip extended_corpus_certifies_bm25_ranking_edge_cases_and_multi_namespace \
            --skip concurrent_multi_namespace_stress \
            --skip memory_volume_kpi_10k
        env:
          ASAN_OPTIONS: "detect_stack_use_after_return=1:detect_leaks=1:halt_on_error=0"
          LSAN_OPTIONS: "suppressions=.lsan_suppressions"
