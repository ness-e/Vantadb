name: "CERT: Linux Snapshot & Restore"

# This isolated lane covers the binary excluded from nextest's fast filter.
# A push trigger also certifies develop before this file reaches the default
# branch, where GitHub requires workflow_dispatch workflows to be registered.
#
# FIND-797 - why these entries are crate-wide instead of a hand-picked list:
# the `paths:` blocks below are the ONLY thing that decides whether the 7 phases
# ever run, so they have to be derived from what those phases execute. They were
# not: the push ending at `66404bedc` (`dca7d5818..66404bedc`, 31 files) changed
# `vanta-memory/src/ingest/runner_config.rs` and four `vantadb-mcp/src/*.rs` -
# crates phases 06 and 07 run - and no run of this workflow exists for that SHA,
# because the list named only `core/record/**`, `utils/backup.rs`,
# `validation.rs` and `handlers/tools.rs`. The phases run
# `cargo nextest -p <crate>`, and their `--test` targets import the crate:
# `snapshot_certification` imports `vantadb::{index,node,sdk,storage,wal,config}`,
# `mcp_tests` imports `vantadb_mcp::*`, and the `--lib` phases select by test NAME
# (`test(snapshot)`), not by module - so a smaller subset cannot be justified by
# the selector. Each crate a phase runs therefore brings its `Cargo.toml`, its
# `build.rs` (it compiles for every target) and all of its `src/**`, plus the test
# files those phases name. `vantadb-server` is NOT here: no phase runs it, and
# watching it would cost runs with nothing to certify.
# `dev-tools/check-cert-lane-paths.mjs` enforces this derivation on every edit of
# this file (it is the first `run:` step below), so the two sides cannot drift
# again in silence.
on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/snapshot-certification.yml"
      - ".github/actions/rust-setup/**"
      - ".cargo/**"
      - ".config/nextest.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "build.rs"
      - "dev-tools/check-cert-lane-paths.mjs"
      - "src/**"
      - "tests/**"
      - "vanta-memory/Cargo.toml"
      - "vanta-memory/src/**"
      - "vanta-memory/tests/backup_snapshot.rs"
      - "vanta-memory/tests/rollback.rs"
      - "vantadb-mcp/Cargo.toml"
      - "vantadb-mcp/src/**"
      - "vantadb-mcp/tests/mcp_tests.rs"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/snapshot-certification.yml"
      - ".github/actions/rust-setup/**"
      - ".cargo/**"
      - ".config/nextest.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "build.rs"
      - "dev-tools/check-cert-lane-paths.mjs"
      - "src/**"
      - "tests/**"
      - "vanta-memory/Cargo.toml"
      - "vanta-memory/src/**"
      - "vanta-memory/tests/backup_snapshot.rs"
      - "vanta-memory/tests/rollback.rs"
      - "vantadb-mcp/Cargo.toml"
      - "vantadb-mcp/src/**"
      - "vantadb-mcp/tests/mcp_tests.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-certification-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2

jobs:
  snapshot-linux:
    name: Linux Snapshot Certification
    runs-on: ubuntu-latest
    # Includes a cold native C++ build; nextest's per-test limit stays 180 s.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # FIND-797 - the `paths:` blocks above decide whether these phases run at
      # all, so they are derived here instead of being trusted. The script reads
      # this same file twice (the `-p <crate>` and `--test <name>` of every
      # `run_phase`, and the entries of every `paths:` block) and fails in seconds
      # when a phase runs a crate whose `Cargo.toml`/`src/**` the filter does not
      # watch. Placed before rust-setup because it needs nothing but the checkout:
      # a divergence must cost seconds, not the toolchain install. It is not
      # circular - editing this workflow always fires the lane (it lists itself),
      # which is exactly the mutation that opens the gap.
      - name: Verify the paths filter covers every crate the phases run
        run: node dev-tools/check-cert-lane-paths.mjs

      - uses: ./.github/actions/rust-setup
        with:
          install-nextest: "true"
          install-system-deps: "true"
          shared-key: linux-snapshot-ci
          free-disk: "false"
          swap-mb: "0"

      - name: Record native Linux execution context
        run: |
          mkdir -p artifacts/snapshot-certification
          {
            git rev-parse HEAD
            uname -a
            id
            rustc --version --verbose
            cargo nextest --version
            df -h .
            free -h
          } | tee artifacts/snapshot-certification/context.txt
          test "$(uname -s)" = Linux
          test "$(id -u)" -ne 0

      # FIND-768 - why each phase counts its own population: a phase that never
      # counts what it selected cannot tell "42 of 56 passed" from "56 of 56
      # passed", which is how 14 tests stayed unexecuted behind a green lane.
      # `coverage` says which population is meant: `scoped` counts with the
      # phase's own -E (the filter IS the intended population); `full` counts the
      # whole target, so a selector that narrows the run shows up as
      # executed < listed instead of shrinking both sides.
      #
      # FIND-785 - why the count reads JSON and no longer the rendered list: the
      # lane sets CARGO_TERM_COLOR, so `nextest list` wraps every token in ANSI,
      # and it prints `package mod::test` (space, not `pkg::mod::`) on `oneline`,
      # which `-T auto` picks whenever stdout is a pipe. The FIND-768 counter
      # anchored `^...::` on that rendered text: it counted 0 on a 42-test
      # artifact and the guard aborted all seven phases before a single test ran.
      # The JSON list is the same data without the presentation: the population is
      # every test whose `filter-match` is `matches` (the phase's -E is already
      # applied there, and an ignored test arrives as a mismatch).
      #
      # FIND-785 - why a failed count never aborts a phase, and how the two ways
      # of not having a number stay distinguishable. `nextest list` exit != 0
      # aborts, because there is nothing to measure at all. Everything else goes
      # on: 0 tests counted from an exit-0 list is `measurement=suspect` (a real
      # measurement of zero), while a jq that cannot read the JSON - or a JSON
      # that is not even that - is `measurement=unmeasured` (the counter itself
      # broke). Both keep the phase alive with the state written into
      # listed-vs-executed.txt, because a broken counter must not switch the
      # certification off - that is the failure this guard exists to prevent,
      # inverted. listed > 0 keeps the FIND-768 assertion untouched, so a run
      # that executes a different number than it listed is still red; and any
      # state that is not `counted` is still red when the run executes 0 tests.
      #
      # FIND-785 - keep this `run:` block statement-tight. actionlint's embedded
      # shellcheck stops returning on this script as soon as it gains one
      # statement: a 6377 B block lints in 0 s and tolerates +148 B of blank
      # lines, but +1 statement (113 B) never finished in 100 s, and removing a
      # line does not recover it while more remain. That is why the state is a
      # `case` (one compound replacing two) and why all prose lives up here, the
      # same ceiling FIND-766 recorded for certification.yml.
      - name: Certify core snapshots, native RocksDB and their callers
        run: |
          out=artifacts/snapshot-certification
          report=target/nextest/audit/junit.xml

          command -v jq > /dev/null || { echo "jq not found: cannot measure the population." >&2; exit 1; }

          run_phase() {
            local phase="$1" coverage="$2" selector="$3"
            shift 3
            local status listed list_status executed measurement
            local -a pipeline_status run_args expect
            touch "$out/$phase.started"
            if [[ -f "$report" ]]; then
              mv "$report" "$out/$phase.prior-report.txt"
            fi

            run_args=("$@")
            expect=("$@")
            if [[ -n "$selector" ]]; then
              run_args+=(-E "$selector")
              if [[ "$coverage" == "scoped" ]]; then
                expect+=(-E "$selector")
              fi
            fi

            set +e
            cargo nextest list \
              --profile audit --cargo-profile ci \
              --locked --build-jobs 2 \
              --ignore-default-filter \
              --message-format json \
              "${expect[@]}" > "$out/$phase.listed.json" 2> "$out/$phase.list.stderr.txt"
            list_status=$?
            set -e
            listed=$(jq -r '[ ."rust-suites"[] | .testcases[] | select(."filter-match".status == "matches") ] | length' "$out/$phase.listed.json" 2>/dev/null || true)
            jq -r '."rust-suites" | to_entries[] as $s | $s.value.testcases | to_entries[] | select(.value."filter-match".status == "matches") | "\($s.key) \(.key)"' "$out/$phase.listed.json" > "$out/$phase.listed.txt" 2>/dev/null || true
            case "$listed" in
              '' | *[!0-9]*) measurement=unmeasured; listed=0 ;;
              0) measurement=suspect ;;
              *) measurement=counted ;;
            esac

            if [[ "$list_status" -ne 0 ]]; then
              echo "$phase: nextest list exited $list_status; the population could not be measured." >&2
              printf '%s\n' 1 > "$out/$phase.exit-code.txt"
              return 1
            fi
            if [[ "$measurement" != "counted" ]]; then
              echo "::warning title=Population not measured::$phase measurement=$measurement; continuing without the listed/executed check."
            fi

            set +e
            cargo nextest run \
              --profile audit --cargo-profile ci \
              --locked --build-jobs 2 --test-threads 1 \
              --ignore-default-filter --no-tests fail \
              "${run_args[@]}" 2>&1 | tee "$out/$phase.txt"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            status="${pipeline_status[0]}"
            if [[ "${pipeline_status[1]}" -ne 0 && "$status" -eq 0 ]]; then
              status=1
            fi

            if [[ -f "$report" ]]; then
              cp "$report" "$out/$phase.junit.xml"
              executed=$(grep -o '<testcase' "$out/$phase.junit.xml" | wc -l || true)
              printf '%s listed=%s executed=%s coverage=%s measurement=%s\n' \
                "$phase" "$listed" "$executed" "$coverage" "$measurement" \
                | tee -a "$out/listed-vs-executed.txt"
              if [[ "$measurement" != "counted" ]]; then
                if [[ "$executed" -eq 0 ]]; then
                  echo "$phase: no usable population count ($measurement) and the run executed 0 test(s)." >&2
                  status=1
                fi
              elif [[ "$executed" -ne "$listed" ]]; then
                echo "$phase: population is $listed test(s) but $executed executed." >&2
                status=1
              fi
            elif [[ "$status" -eq 0 ]]; then
              echo "Successful phase did not produce a fresh JUnit report." >&2
              status=1
            fi
            printf '%s\n' "$status" > "$out/$phase.exit-code.txt"
            return "$status"
          }

          run_phase 01-unit-plain scoped 'test(snapshot) or test(pending_restore)' \
            -p vantadb --lib --features failpoints
          run_phase 02-unit-encrypted scoped 'test(snapshot) or test(pending_restore)' \
            -p vantadb --lib --features failpoints,encryption
          # full: every test in the binary, whatever its name (FIND-768).
          run_phase 03-certification-plain full 'binary(snapshot_certification)' \
            -p vantadb --test snapshot_certification --features failpoints
          run_phase 04-certification-encrypted full 'binary(snapshot_certification)' \
            -p vantadb --test snapshot_certification --features failpoints,encryption
          run_phase 05-rocksdb-native scoped 'test(test_snapshot_rocksdb_native_checkpoint_roundtrip)' \
            -p vantadb --test snapshot_certification --features failpoints,encryption,rocksdb
          run_phase 06-memory-snapshots scoped 'test(snapshot)' \
            -p vanta-memory --test backup_snapshot --test rollback
          run_phase 07-mcp-snapshots scoped 'test(snapshot)' \
            -p vantadb-mcp --test mcp_tests

      - name: Upload execution logs, exit codes and JUnit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-certification-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/snapshot-certification/
          if-no-files-found: warn
          retention-days: 14
