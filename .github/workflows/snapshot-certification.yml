name: "CERT: Linux Snapshot & Restore"

# This isolated lane covers the binary excluded from nextest's fast filter.
# A push trigger also certifies develop before this file reaches the default
# branch, where GitHub requires workflow_dispatch workflows to be registered.
on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/snapshot-certification.yml"
      - ".github/actions/rust-setup/**"
      - ".cargo/**"
      - ".config/nextest.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/backend.rs"
      - "src/backends/**"
      - "src/index/**"
      - "src/storage/**"
      - "src/sdk/builder.rs"
      - "src/utils/fs.rs"
      - "src/wal*.rs"
      - "tests/**"
      - "vanta-memory/Cargo.toml"
      - "vanta-memory/src/core/record/**"
      - "vanta-memory/src/utils/backup.rs"
      - "vanta-memory/tests/backup_snapshot.rs"
      - "vanta-memory/tests/rollback.rs"
      - "vantadb-mcp/Cargo.toml"
      - "vantadb-mcp/src/handlers/tools.rs"
      - "vantadb-mcp/src/validation.rs"
      - "vantadb-mcp/tests/mcp_tests.rs"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/snapshot-certification.yml"
      - ".github/actions/rust-setup/**"
      - ".cargo/**"
      - ".config/nextest.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/backend.rs"
      - "src/backends/**"
      - "src/index/**"
      - "src/storage/**"
      - "src/sdk/builder.rs"
      - "src/utils/fs.rs"
      - "src/wal*.rs"
      - "tests/**"
      - "vanta-memory/Cargo.toml"
      - "vanta-memory/src/core/record/**"
      - "vanta-memory/src/utils/backup.rs"
      - "vanta-memory/tests/backup_snapshot.rs"
      - "vanta-memory/tests/rollback.rs"
      - "vantadb-mcp/Cargo.toml"
      - "vantadb-mcp/src/handlers/tools.rs"
      - "vantadb-mcp/src/validation.rs"
      - "vantadb-mcp/tests/mcp_tests.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-certification-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2

jobs:
  snapshot-linux:
    name: Linux Snapshot Certification
    runs-on: ubuntu-latest
    # Includes a cold native C++ build; nextest's per-test limit stays 180 s.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          install-nextest: "true"
          install-system-deps: "true"
          shared-key: linux-snapshot-ci
          free-disk: "false"
          swap-mb: "0"

      - name: Record native Linux execution context
        run: |
          mkdir -p artifacts/snapshot-certification
          {
            git rev-parse HEAD
            uname -a
            id
            rustc --version --verbose
            cargo nextest --version
            df -h .
            free -h
          } | tee artifacts/snapshot-certification/context.txt
          test "$(uname -s)" = Linux
          test "$(id -u)" -ne 0

      - name: Certify core snapshots, native RocksDB and their callers
        run: |
          out=artifacts/snapshot-certification
          report=target/nextest/audit/junit.xml

          run_phase() {
            local phase="$1" coverage="$2" selector="$3"
            shift 3
            # Remaining args select the targets this phase covers
            # (package, --lib/--test, --features).
            local status listed list_status executed
            local -a pipeline_status run_args expect
            touch "$out/$phase.started"
            if [[ -f "$report" ]]; then
              mv "$report" "$out/$phase.prior-report.txt"
            fi

            run_args=("$@")
            expect=("$@")
            if [[ -n "$selector" ]]; then
              run_args+=(-E "$selector")
              # scoped: the filter IS the intended population. full: the
              # population is the whole target, so a selector that narrows it
              # shows up as executed < listed instead of shrinking both sides.
              if [[ "$coverage" == "scoped" ]]; then
                expect+=(-E "$selector")
              fi
            fi

            # FIND-768: listed == executed, counted before running. A green
            # that never counted its population cannot tell "42 of 56 passed"
            # from "56 of 56 passed" - which is exactly how 14 tests stayed
            # unexecuted behind a green lane.
            set +e
            cargo nextest list \
              --profile audit --cargo-profile ci \
              --locked --build-jobs 2 \
              --ignore-default-filter \
              "${expect[@]}" > "$out/$phase.listed.txt" 2> "$out/$phase.list.stderr.txt"
            list_status=$?
            set -e
            listed=$(grep -oE '^[^[:space:]]+::[^[:space:]]+ ' "$out/$phase.listed.txt" | wc -l || true)
            if [[ "$list_status" -ne 0 || "$listed" -eq 0 ]]; then
              echo "$phase: nextest list exited $list_status selecting $listed test(s)." >&2
              printf '%s\n' 1 > "$out/$phase.exit-code.txt"
              return 1
            fi

            set +e
            cargo nextest run \
              --profile audit --cargo-profile ci \
              --locked --build-jobs 2 --test-threads 1 \
              --ignore-default-filter --no-tests fail \
              "${run_args[@]}" 2>&1 | tee "$out/$phase.txt"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            status="${pipeline_status[0]}"
            if [[ "${pipeline_status[1]}" -ne 0 && "$status" -eq 0 ]]; then
              status=1
            fi

            if [[ -f "$report" ]]; then
              cp "$report" "$out/$phase.junit.xml"
              executed=$(grep -o '<testcase' "$out/$phase.junit.xml" | wc -l || true)
              printf '%s listed=%s executed=%s coverage=%s\n' \
                "$phase" "$listed" "$executed" "$coverage" \
                | tee -a "$out/listed-vs-executed.txt"
              if [[ "$executed" -ne "$listed" ]]; then
                echo "$phase: population is $listed test(s) but $executed executed." >&2
                status=1
              fi
            elif [[ "$status" -eq 0 ]]; then
              echo "Successful phase did not produce a fresh JUnit report." >&2
              status=1
            fi
            printf '%s\n' "$status" > "$out/$phase.exit-code.txt"
            return "$status"
          }

          run_phase 01-unit-plain scoped 'test(snapshot) or test(pending_restore)' \
            -p vantadb --lib --features failpoints
          run_phase 02-unit-encrypted scoped 'test(snapshot) or test(pending_restore)' \
            -p vantadb --lib --features failpoints,encryption
          # full: every test in the binary, whatever its name (FIND-768).
          run_phase 03-certification-plain full 'binary(snapshot_certification)' \
            -p vantadb --test snapshot_certification --features failpoints
          run_phase 04-certification-encrypted full 'binary(snapshot_certification)' \
            -p vantadb --test snapshot_certification --features failpoints,encryption
          run_phase 05-rocksdb-native scoped 'test(test_snapshot_rocksdb_native_checkpoint_roundtrip)' \
            -p vantadb --test snapshot_certification --features failpoints,encryption,rocksdb
          run_phase 06-memory-snapshots scoped 'test(snapshot)' \
            -p vanta-memory --test backup_snapshot --test rollback
          run_phase 07-mcp-snapshots scoped 'test(snapshot)' \
            -p vantadb-mcp --test mcp_tests

      - name: Upload execution logs, exit codes and JUnit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-certification-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/snapshot-certification/
          if-no-files-found: warn
          retention-days: 14
