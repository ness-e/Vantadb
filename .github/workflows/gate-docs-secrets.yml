name: 'GATE: Docs — Secret leak'

# Fails a PR that writes a credential-shaped string into the PUBLISHED
# documentation tree. Separate from gate-docs-links.yml on purpose: that one
# measures link integrity, this one measures exposure, and they have different
# tolerances. A docs gate that is never red and a security gate that is always
# red are both useless; keeping them separate means one can tighten without
# moving the other's baseline.
#
# Baseline measured 2026-09-29 over 1650 files: 0 errors, 28 warnings. The
# warnings are anonymised hostnames in 9 research notes (docs.lan, blog.lan,
# ipc.local, ...), not credentials. See docs/dev/workflow/gate-docs-secrets.md.
#
# Rules obeyed (docs/dev/workflow/RULES.md): SHA pins (3), timeouts (2),
# least-privilege permissions (4), branches declared on pull_request (7),
# push+PR scoped by paths (1). No continue-on-error anywhere, so rule 6 is
# satisfied by absence -- a red run here means a real finding.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/docs/**'
      - 'README.md'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'scripts/docs/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gate reads the tree and nothing else. It publishes
# nothing, and it must never be the job that could exfiltrate a secret.
permissions:
  contents: read

jobs:
  docs-secrets:
    name: No credential in published docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Assert the rules themselves still detect their own shapes
        run: node scripts/docs/check-secrets.mjs --self-test
      - name: Scan prose for credential shapes
        run: node scripts/docs/check-secrets.mjs

  docs-secrets-json:
    name: Machine-readable report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Same scan, second surface. The human job prints a per-file report a
      # reviewer can act on; this one emits the aggregate that a later promotion
      # or a weekly trend report can consume without re-deriving it from logs.
      - name: Emit the JSON report
        run: node scripts/docs/check-secrets.mjs --json
