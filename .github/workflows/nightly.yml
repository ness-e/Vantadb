# Nightly - heavy certification subset (HARD-02, owner decision (c) 2026-09-26).
#
# Why a separate file (decision + evidence: CI_POLICY.md "Nightly Certification Subset"):
# - heavy-certification.yml stays the WEEKLY full suite (stress_protocol ~2h,
#   memory_brutality, mutation_test, other_heavy - deliberately heavy, weekly).
# - This lane is the DAILY safety net on the failure-critical certification
#   subset (crash recovery / durability / HNSW correctness / text-index
#   recovery): a regression surfaces in <=24h instead of <=7d. It is also the
#   designated reception point for slow gates (>5min) moved out of the fast
#   gate (HARD-01 coordination, plan 2026-09-26 stop condition).
# - Schedules deconflicted (FIND-141): bench nightly 02:00, full cert Sun 03:00,
#   OCR 04:00 - this lane 05:00 UTC daily.
# - Job commands are IDENTICAL to their heavy-certification.yml counterparts
#   (copy, not re-derive). When a test-binary list changes, change both files
#   together - same rule as .config/nextest.toml structural exclusions.
# - Since owner decision (c) 2026-09-27, this lane also carries the coverage
#   report + per-directory budget (job `coverage-budget`, script
#   dev-tools/coverage-budget.ps1) that used to run in the local fast gate
#   (verify.ps1) - restoring the local <5min target. CI canonical coverage gate
#   (ADR-018, ci-rust.yml) is unchanged.
# - Never publishes: the release dry-run job only verifies packaging and
#   publishability (`cargo publish --dry-run` - "all checks without uploading";
#   no upload, no registry token). release-plz remains the only publisher
#   (release.yml) and semver_check stays in its lane.
# - Failure notification: auto-issue (deduped) so a red run never becomes
#   chronic silence (F2 pre-mortem of HARD-02). Minimal permission: the
#   `issues: write` grant lives ONLY on the notify job (RULES.md §4).
#
# CI-08 Step 3 (SRV-10, 2026-10-15): this file absorbs the 4 informational
# workflows as jobs. Origin -> job table (no job lost, none killed):
#   arch-metrics-informational.yml        -> arch-metrics
#   bench-canonical-p99-informational.yml -> toolchain-check + bench-informational
#   ocr-delegate.yml                      -> ocr-delegate
# Event gating (Fast Gate / Heavy split preserved):
# - Heavy jobs (ci-gate call + 7 certification jobs) run ONLY on
#   `schedule`/`workflow_dispatch` (`if: != 'pull_request'`) — a PR that
#   matches the informational paths must NOT trigger 120-min HNSW runs.
# - Informational jobs run ONLY on `pull_request`/`workflow_dispatch`
#   (their original triggers) — they never run on the daily schedule.
# - `notify-failure` intentionally does NOT list informational jobs in `needs`:
#   informational findings open their own issues; they never page nightly.
# Trigger narrowing (documented, accepted): `ocr-delegate.yml` used to run on
# EVERY PR (bare `pull_request:`); as a job it runs when the union paths
# below match. Docs-only PRs skip the advisory OCR spec (gate-docs lanes
# still cover them).
# RULES.md §7 note: the absorbed `pull_request:` trigger is intentionally
# unscoped (no `branches:`) — verbatim preservation of the 4 originals, which
# never declared branches. Tightening to `[main]` is a follow-up, not part
# of this lossless consolidation.
# NOTE (review gate): check names change from `<old-file> / <job>` to
# `nightly / <job>` — branch protection required checks MUST be updated
# accordingly before merge (only if any old name was required).

name: 'NIGHTLY: Heavy Certification Subset'

on:
  schedule:
    - cron: '0 5 * * *'  # daily 05:00 UTC - deconflicted, see header
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.opencode/**'
      - 'evals/agent/**'
      - '.github/workflows/nightly.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  # Heavies de schedule llevan override cancel:false en su propio bloque
  # (un push no debe matar una cert de horas ya en curso).

jobs:
  ci-gate:
    # CI-08: heavy gate only — skipped on PR (fast gate covers pre-merge).
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci-gate.yml
    permissions:
      checks: read

  failpoint-tests:
    name: "Nightly: failpoint_injections"
    # CI-08: schedule/dispatch only — never on PR (see header).
    if: github.event_name != 'pull_request'
    needs: ci-gate
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.job }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: Run failpoint tests
        env:
          RUST_BACKTRACE: 1
        run: >
          cargo test --features failpoints
          --test chaos_integrity
          --test wal_resilience
          --test crash_injection
          --
          --test-threads=1

  storage-persistence:
    name: "Nightly: storage_persistence"
    # CI-08: schedule/dispatch only — never on PR (see header).
    if: github.event_name != 'pull_request'
    needs: ci-gate
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.job }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 4096
          free-disk: true
      - name: Run storage persistence & recovery tests
        timeout-minutes: 75
        run: >
          cargo test --release --features cli
          --test backend_tests
          --test storage
          --test durability_recovery
          --test derived_index_recovery
          --test index_reconstruction
          --test fjall_cold_copy_restore
          --test property_durability
          --test file_locking_stress
          --test schema_evolution
          --test gc
          --test mmap_index
          --test mutations
          --test antilocality_layout
          --test tombstone_ann_vstore
          --test multi_process_lock
          --test operational_metrics
          --test prefetch_benchmark
          --
          --test-threads=1

  hnsw-validation:
    name: "Nightly: hnsw_validation"
    # CI-08: schedule/dispatch only — never on PR (see header).
    if: github.event_name != 'pull_request'
    needs: ci-gate
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.job }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 8192
          free-disk: true
      - name: Run HNSW validation
        run: cargo test --release --test hnsw_validation -- --nocapture --test-threads=1

  hnsw-recall:
    name: "Nightly: hnsw_recall_certification"
    # CI-08: schedule/dispatch only — never on PR (see header).
    if: github.event_name != 'pull_request'
    needs: ci-gate
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.job }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          free-disk: true
      - name: Run HNSW recall certification
        timeout-minutes: 25
        run: cargo test --release --test hnsw_recall_certification -- --nocapture --test-threads=1

  text-index:
    name: "Nightly: text_index_recovery"
    # CI-08: schedule/dispatch only — never on PR (see header).
    if: github.event_name != 'pull_request'
    needs: ci-gate
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.job }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 4096
      - name: Run text index recovery tests
        timeout-minutes: 45
        run: cargo test --release --test text_index_recovery -- --test-threads=1 --nocapture

  coverage-budget:
    name: "Nightly: coverage report + per-directory budget"
    # CI-08: schedule/dispatch only — never on PR (see header).
    if: github.event_name != 'pull_request'
    needs: ci-gate
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.job }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          components: llvm-tools-preview
          install-nextest: true
          install-llvm-cov: true
          install-system-deps: true
          swap-mb: 8192
          free-disk: true
      - name: Run coverage report + per-directory budget (HARD-02)
        # JSON report + per-directory budget (ratchet baseline -1.0 pt); exit 1 ONLY on
        # an explicit bucket violation. Baselines calibrated on Windows (2026-09-26);
        # ubuntu delta expected <1pt (24 cfg lines) - recalibrate if the first run
        # differs (CI_POLICY.md Coverage). Same script as local on-demand
        # (`verify.ps1 -IncludeCoverage`).
        run: pwsh -NoProfile -File dev-tools/coverage-budget.ps1
      - name: Upload coverage report JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: target/coverage-report.json
          if-no-files-found: warn

  release-dry-run:
    name: "Nightly: release dry-run (packaging only - never publishes)"
    # CI-08: schedule/dispatch only — never on PR (see header).
    if: github.event_name != 'pull_request'
    needs: ci-gate
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.job }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: cargo publish --dry-run (root crate, no upload)
        # release-plz publishes `vantadb` to crates.io; this job catches
        # packaging/publishability regressions (missing files, manifest errors,
        # verify-build failures) daily without touching any registry.
        # `cargo package` has no --dry-run flag - the canonical release dry run is
        # `cargo publish --dry-run` ("perform all checks without uploading"; exit 0
        # verified locally 2026-09-27). `vantadb-wasm` ships via npm
        # (release-npm-61.yml) and is intentionally out of scope here.
        run: cargo publish -p vantadb --dry-run

  # ---- Informational jobs (CI-08 Step 3: absorbed workflows, PR/dispatch only) ----

  # Origin: arch-metrics-informational.yml. Architecture metrics -
  # INFORMATIONAL ONLY (C2M1 baseline). Never blocks.
  # Scope: cargo-modules -p vantadb --lib, default features, no --cfg-test.
  # KNOWN artifact: item-level self-edge accumulator::GraphAccumulator <->
  # GraphAccumulator::new (struct-owns-ctor, NOT an ADP package cycle).
  # Ratchet: compare against docs/dev/reviews/*-baseline.json; tighten
  # thresholds only after M3/S3 re-measurement. Pins: cargo-modules 0.27.0,
  # cargo-coupling 0.4.0. rust-dsm stays local-only (run manually).
  arch-metrics:
    name: ADP + coupling thermometers
    # CI-08: PR/dispatch only — never on the daily schedule (see header).
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CATEGORY: INFORMATIONAL - advisory thermometers, never gate merge (Regla 2)
    continue-on-error: true # CATEGORY: INFORMATIONAL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install thermometers (pinned)
        # CATEGORY: INFORMATIONAL
        continue-on-error: true # CATEGORY: INFORMATIONAL
        run: |
          cargo install cargo-modules --version 0.27.0 --locked
          cargo install cargo-coupling --version 0.4.0 --locked

      - name: ADP acyclic check (-p vantadb --lib, default features)
        # CATEGORY: INFORMATIONAL
        continue-on-error: true # CATEGORY: INFORMATIONAL
        run: |
          cargo modules dependencies -p vantadb --lib --acyclic \
            | tee acyclic-report.txt
          echo "KNOWN-ARTIFACT: GraphAccumulator<->new self-edge, see job header"

      - name: Khononov coupling gate (lax ratchet, informational)
        # CATEGORY: INFORMATIONAL
        continue-on-error: true # CATEGORY: INFORMATIONAL
        run: |
          cargo coupling ./src --check --max-deps 60 --max-dependents 250 \
            | tee coupling-report.txt
          echo "Ratchet: error=221 in / engine hotspot=324 (2026-09-13 baseline)"

      - name: Upload reports
        # CATEGORY: INFORMATIONAL
        continue-on-error: true # CATEGORY: INFORMATIONAL
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-metrics
          path: |
            acyclic-report.txt
            coupling-report.txt

  # Origin: bench-canonical-p99-informational.yml (job 1 of 2). BENCH toolchain
  # gate: compiles canonical_p99 in release WITHOUT running it. A broken
  # toolchain opens a HALLAZGO issue with an owner instead of false-green.
  toolchain-check:
    name: Toolchain compiles bench (release, no run)
    # CI-08: PR/dispatch only — never on the daily schedule (see header).
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # HALLAZGO issue on toolchain failure (RULES.md §4: least privilege, job-level)
    # CATEGORY: INFORMATIONAL - a broken toolchain is a finding with an owner,
    # never a merge blocker and never false-green (see finding step below).
    continue-on-error: true # CATEGORY: INFORMATIONAL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 6144
          free-disk: true

      - name: Perf-path gate (skip unless perf sources changed)
        id: perf
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(src/index/|src/storage/|benches/canonical_p99|benchmarks/)'; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "Perf sources untouched — skipping toolchain compile, keeping fast signals."
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile canonical_p99 in release (no run)
        id: compile
        if: steps.perf.outputs.hit != 'false'
        continue-on-error: true # CATEGORY: INFORMATIONAL
        run: cargo bench -p vantadb --bench canonical_p99 --no-run 2>&1 | tee toolchain-check.log

      - name: Report toolchain failure as HALLAZGO (never false-green)
        if: steps.compile.outcome == 'failure'
        continue-on-error: true # CATEGORY: INFORMATIONAL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('toolchain-check.log', 'utf8').slice(-4000); }
            catch (e) { log = '(no log captured)'; }
            const body = `## Toolchain HALLAZGO - canonical_p99 does not compile\n\n` +
              `**Commit:** \`${context.sha}\`\n` +
              `**Workflow:** [${context.workflow}](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})\n` +
              `**Owner:** toolchain / CI (triage: fix toolchain vs document - Gate V, F3B-B1)\n\n` +
              `The release compile-gate \`cargo bench -p vantadb --bench canonical_p99 --no-run\` failed. ` +
              `This workflow stays green by design (informational); this issue is the signal.\n\n` +
              `<details><summary>Tail of toolchain-check.log</summary>\n\n\`\`\`\n${log}\n\`\`\`\n</details>`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['benchmark', 'toolchain'],
            });
            const existing = issues.find(i =>
              i.title.startsWith('[Benchmark] Toolchain cannot compile canonical_p99')
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `**Re-checked on ${new Date().toISOString()}** - toolchain still broken.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '[Benchmark] Toolchain cannot compile canonical_p99',
                labels: ['benchmark', 'toolchain'],
                body: body,
              });
            }

      - name: Upload toolchain log
        if: always()
        continue-on-error: true # CATEGORY: INFORMATIONAL
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-p99-toolchain-check
          path: toolchain-check.log
          retention-days: 14

  # Origin: bench-canonical-p99-informational.yml (job 2 of 2). Runs ONLY
  # canonical_p99 (perf-source paths src/index + src/storage; bench-file PRs
  # stay owned by heavy-bench-nightly — strictly disjoint triggers, see
  # original header). Regression policy (>10% p99 vs baseline needs
  # ADR-or-revert) is EVALUATED here but never enforced: regressions open an
  # issue, the PR stays green (Q5 informativo primero).
  bench-informational:
    name: Run canonical_p99 vs baseline (informational)
    # CI-08: PR/dispatch only — never on the daily schedule (see header).
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    # Sin needs: toolchain-check (corre en paralelo; ambos son informativos
    # con issue propia y el bench recompila de todos modos para correr).
    runs-on: ubuntu-latest
    # FIND-317 (2026-10-07): 90 -> 240 min (criterion estimate ~128 min for the
    # insert bench alone on the runner). If this still times out, next step:
    # split insert/search into parallel jobs.
    timeout-minutes: 240
    permissions:
      contents: read
      issues: write # regression finding issue (RULES.md §4: least privilege, job-level)
    # CATEGORY: INFORMATIONAL - numbers are published for Regla 9 decisions;
    # regressions open issues, they never fail the PR (Q5 informativo primero).
    continue-on-error: true # CATEGORY: INFORMATIONAL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 6144
          free-disk: true

      - name: Perf-path gate (skip unless perf sources changed)
        id: perf
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(src/index/|src/storage/|benches/canonical_p99|benchmarks/)'; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "Perf sources untouched — skipping 2h bench, keeping fast signals."
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run canonical_p99
        id: bench
        if: steps.perf.outputs.hit != 'false'
        continue-on-error: true # CATEGORY: INFORMATIONAL
        run: |
          mkdir -p metricas/benchmarks
          cargo bench -p vantadb --bench canonical_p99 -- --nocapture 2>&1 | tee metricas/benchmarks/canonical_p99_results.txt

      - name: Run param_sweep (sift-128 recall-QPS curve)
        if: steps.perf.outputs.hit != 'false'
        continue-on-error: true # CATEGORY: INFORMATIONAL
        run: cargo bench -p vantadb --bench param_sweep -- --nocapture 2>&1 | tee -a metricas/benchmarks/canonical_p99_results.txt

      - name: Publish p50/p95/p99 vs baseline to summary
        if: always()
        continue-on-error: true # CATEGORY: INFORMATIONAL
        run: |
          {
            echo "## canonical_p99 (informational)"
            echo ""
            echo "Baseline: docs/user/operations/BENCHMARKS.md §11 (consumo guard) + §1."
            echo "Regression policy: p99 >10% vs baseline needs ADR-or-revert - evaluated here, never enforced (Q5)."
            echo ""
            grep -E "canonical_p99 search" metricas/benchmarks/canonical_p99_results.txt || echo "(p50/p95/p99 line not found - see artifact)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Extract criterion estimates
        if: always()
        continue-on-error: true # CATEGORY: INFORMATIONAL
        run: |
          python scripts/bench_regression.py extract \
            --criterion-root target/criterion \
            --output metricas/benchmark_report_canonical_p99.json

      # CATEGORY: INFORMATIONAL - compare may fail with no baseline or format
      # drift. Non-blocking by design.
      - name: Compare against baseline
        id: compare
        if: always()
        continue-on-error: true # CATEGORY: INFORMATIONAL
        run: |
          python scripts/bench_regression.py compare \
            metricas/benchmark_report_canonical_p99.json \
            --format json \
            --output metricas/bench_comparison_canonical_p99.json \
            --fail-on-regression
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Open regression finding (never blocks merge)
        if: always()
        continue-on-error: true # CATEGORY: INFORMATIONAL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            let cmp = null;
            try { cmp = JSON.parse(fs.readFileSync('metricas/bench_comparison_canonical_p99.json', 'utf8')); }
            catch (e) { console.log('No comparison report - skipping finding.'); return; }
            if (!cmp.has_regression) { console.log('No regression - nothing to file.'); return; }
            let numbers = '';
            try {
              const txt = fs.readFileSync('metricas/benchmarks/canonical_p99_results.txt', 'utf8');
              const m = txt.match(/canonical_p99 search.*/);
              numbers = m ? m[0] : '(numbers line not found)';
            } catch (e) { numbers = '(results file missing)'; }
            let body = `## canonical_p99 Regression (informational, non-blocking)\n\n` +
              `**Commit:** \`${context.sha}\`\n` +
              `**Workflow:** [${context.workflow}](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})\n` +
              `**Numbers:** \`${numbers}\`\n` +
              `**Baseline:** docs/user/operations/BENCHMARKS.md §11 + benchmarks/criterion_baseline.json\n` +
              `**Policy:** p99 >10% vs baseline needs ADR-or-revert (Regla 9). This issue is the finding; the PR stays green (Q5).\n\n` +
              `### Regressions\n\n| Benchmark | Before (ms) | After (ms) | Change | Severity |\n|---|---|---|---|---|\n`;
            for (const r of cmp.regressions || []) {
              const icon = r.severity === 'critical' ? '!!' : '!';
              body += `| ${r.label} | ${r.prev_ms} | ${r.current_ms} | +${r.change_pct}% | ${icon} ${r.severity} |\n`;
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['benchmark', 'regression'],
            });
            const existing = issues.find(i =>
              i.title.startsWith('[Benchmark] canonical_p99 regression')
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `**Re-checked on ${new Date().toISOString()}** - regression still present.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Benchmark] canonical_p99 regression - ${new Date().toISOString().slice(0, 10)}`,
                labels: ['benchmark', 'regression'],
                body: body,
              });
            }

      - name: Upload bench results
        if: always()
        continue-on-error: true # CATEGORY: INFORMATIONAL
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-p99-results
          path: |
            metricas/benchmarks/canonical_p99_results.txt
            metricas/benchmark_report_canonical_p99.json
            metricas/bench_comparison_canonical_p99.json
          retention-days: 30

  # Origin: ocr-delegate.yml. OCR Delegation Spec - INFORMATIONAL ONLY.
  # Never blocks: every step carries continue-on-error (tagged CATEGORY). Publishes
  # `ocr delegate preview + rule` JSON as a PR artifact. No LLM endpoint
  # needed - delegation mode never calls a model. Pins: checkout v7.0.1,
  # setup-node v4.4.0, upload-artifact v4.6.2,
  # @alibaba-group/open-code-review 1.12.9 (npm).
  ocr-delegate:
    name: OCR preview + rules spec
    # CI-08: PR/dispatch only — never on the daily schedule (see header).
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CATEGORY: INFORMATIONAL - advisory spec only, never gates merge (Regla 2)
    continue-on-error: true # CATEGORY: INFORMATIONAL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        # CATEGORY: INFORMATIONAL
        continue-on-error: true # CATEGORY: INFORMATIONAL
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install OCR CLI
        # CATEGORY: INFORMATIONAL
        continue-on-error: true # CATEGORY: INFORMATIONAL
        run: npm install -g @alibaba-group/open-code-review@1.12.9

      - name: Delegation preview (base..head)
        # CATEGORY: INFORMATIONAL
        continue-on-error: true # CATEGORY: INFORMATIONAL
        run: |
          ocr delegate preview -f json \
            --from "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --to "${{ github.sha }}" \
            > ocr-preview.json || ocr delegate preview -f json > ocr-preview.json
          cat ocr-preview.json

      - name: Delegation rules
        # CATEGORY: INFORMATIONAL
        continue-on-error: true # CATEGORY: INFORMATIONAL
        run: |
          FILES=$(jq -r '.reviewable_files[]?.path | select(. != ".opencode")' ocr-preview.json | tr '\n' ' ')
          if [ -z "$FILES" ]; then echo "nothing reviewable"; exit 0; fi
          # shellcheck disable=SC2086
          ocr delegate rule $FILES -f json \
            --from "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --to "${{ github.sha }}" \
            > ocr-rules.json || echo '{"groups":[]}' > ocr-rules.json
          cat ocr-rules.json

      - name: Upload OCR spec
        # CATEGORY: INFORMATIONAL
        continue-on-error: true # CATEGORY: INFORMATIONAL
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-delegate-spec
          path: |
            ocr-preview.json
            ocr-rules.json

  notify-failure:
    name: "Notify failure (auto-issue)"
    # CI-08: informational jobs intentionally NOT in `needs` — their findings
    # open their own issues; they never page the nightly notify (see header).
    needs: [ci-gate, failpoint-tests, storage-persistence, hnsw-validation, hnsw-recall, text-index, coverage-budget, release-dry-run]
    if: github.actor != 'dependabot[bot]' && (failure())
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # listJobsForWorkflowRun (reporte de jobs fallidos)
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              filter: 'latest',
              per_page: 100,
            });
            const failed = data.jobs
              .filter(j => j.conclusion === 'failure')
              .map(j => `- ${j.name} ([log](${j.html_url}))`)
              .join('\n');

            const title = '[Nightly] Heavy certification subset failed';
            const body = `## Nightly heavy-certification subset failed\n\n` +
              `**Commit:** \`${context.sha}\`\n` +
              `**Run:** [${context.workflow}](${runUrl})\n\n` +
              `### Failed jobs\n\n${failed || '- (see run log)'}\n`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(i => i.title.startsWith(title));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `**Re-checked on ${new Date().toISOString()}** - still failing.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['ci'],
                body,
              });
            }
