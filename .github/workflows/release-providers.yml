name: 'RELEASE: Providers — PyPI Publish'

on:
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Upload built wheels to Production PyPI"
        required: false
        default: "true"
      publish_testpypi:
        description: "Upload built wheels to TestPyPI"
        required: false
        default: "false"
  pull_request:
    branches: ["main"]
    paths:
      - "providers/**"
      - ".github/workflows/release-providers.yml"
      - ".github/scripts/provider_wheel_smoke.py"
  # PRE-PUB lane manual: sin trigger de tags (el fanout ya no lo llama).
  # Se publica solo por workflow_dispatch. PR gate recortado a ubuntu
  # (eran 3 providers × 2 OS; windows vuelve al lanzar).

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.provider }} — ${{ matrix.wheel_id }})
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: openai
            wheel_id: linux-x86_64
            os: ubuntu-latest
          - provider: ollama
            wheel_id: linux-x86_64
            os: ubuntu-latest
          - provider: litellm
            wheel_id: linux-x86_64
            os: ubuntu-latest
          # PRE-PUB: recortado a linux-x86_64 (eran 12: +macos/windows/aarch64).
          # Al lanzar, reactivar la matriz completa.

    steps:
      - name: Configure pagefile (Windows — prevent OOM)
        if: matrix.os == 'windows-latest'
        uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc # v1.5
        with:
          minimum-size: 8GB
          maximum-size: 16GB

      # (Free-disk macOS retirado: matriz PRE-PUB solo ubuntu.)

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          shared-key: providers-${{ matrix.provider }}
          workspaces: |
            . -> target
            providers/openai -> target
            providers/ollama -> target
            providers/litellm -> target
          cache-bin: "false"

      - name: Install maturin (prebuilt binary, same route everywhere)
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: maturin

      - name: Build wheel
        run: maturin build --release --out dist --manifest-path providers/${{ matrix.provider }}/Cargo.toml

      - name: Install & smoke test
        shell: bash
        run: |
          # shellcheck disable=SC2012 # Safe for generated wheel names
          wheel="$(ls -t ./dist/vantadb_${{ matrix.provider }}-*.whl | head -n 1)"
          echo "Installing wheel: $wheel"
          python -m venv /tmp/.smoke-venv
          /tmp/.smoke-venv/bin/pip install --upgrade pip
          /tmp/.smoke-venv/bin/pip install "$wheel"
          /tmp/.smoke-venv/bin/python .github/scripts/provider_wheel_smoke.py ${{ matrix.provider }}

      # (Windows smoke retirado: matriz PRE-PUB solo ubuntu.)

      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.provider }}-${{ matrix.wheel_id }}
          path: ./dist/*.whl
          if-no-files-found: error

  publish-testpypi:
    name: Publish wheels to TestPyPI
    runs-on: ubuntu-latest
    needs: build-wheels
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi == 'true'
    environment: release
    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: ./dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          skip-existing: true
          # Publicacion por token, no por Trusted Publishing (mismo criterio
          # que el publish de produccion, que ya usa secrets.PYPI_TOKEN).
          password: ${{ secrets.TEST_PYPI_TOKEN }}

  verify-testpypi-install:
    name: Verify TestPyPI install (${{ matrix.provider }})
    runs-on: ubuntu-latest
    needs: publish-testpypi
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi == 'true'

    strategy:
      fail-fast: false
      matrix:
        provider: [openai, ollama, litellm]

    steps:
      - name: Checkout (for the smoke script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Extract provider version (tag or Cargo.toml)
        id: pkg_version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/providers-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/providers-v}" >> "$GITHUB_OUTPUT"
          else
            version=$(python -c "import tomllib; print(tomllib.load(open('providers/${{ matrix.provider }}/Cargo.toml','rb'))['package']['version'])")
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for TestPyPI CDN propagation
        run: sleep 30

      - name: Install from TestPyPI
        run: |
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "vantadb-${{ matrix.provider }}==${{ steps.pkg_version.outputs.version }}"

      - name: Functional smoke test - verify published wheel
        run: python .github/scripts/provider_wheel_smoke.py ${{ matrix.provider }}

  publish-pypi:
    name: Publish wheels to PyPI (Production)
    runs-on: ubuntu-latest
    needs: build-wheels
    timeout-minutes: 10
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/providers-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pypi != 'false' && inputs.publish_testpypi != 'true')
    environment: release
    permissions:
      id-token: write
      attestations: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: ./dist
          merge-multiple: true

      # CATEGORY: NON-CRITICAL — attest-build-provenance may fail if OIDC
      # tokens are unavailable (e.g., fork PRs). Does not block publishing.
      - name: Attest build provenance
        continue-on-error: true # CATEGORY: BEST-EFFORT - la atestacion de procedencia es una senal adicional sobre el publish (que ya valida el artefacto subido); no debe bloquear la publicacion
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: './dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          verbose: true
          # FIND-140 gate: a re-run of the same tag skips gracefully instead
          # of failing with HTTP 400 on an already-published version.
          skip-existing: true
          password: ${{ secrets.PYPI_TOKEN }}

  verify-pypi-install:
    name: Verify PyPI install (${{ matrix.provider }})
    runs-on: ubuntu-latest
    needs: publish-pypi
    timeout-minutes: 15
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/providers-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pypi != 'false' && inputs.publish_testpypi != 'true')

    strategy:
      fail-fast: false
      matrix:
        provider: [openai, ollama, litellm]

    steps:
      - name: Checkout (for the smoke script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Extract provider version (tag or Cargo.toml)
        id: pkg_version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/providers-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/providers-v}" >> "$GITHUB_OUTPUT"
          else
            version=$(python -c "import tomllib; print(tomllib.load(open('providers/${{ matrix.provider }}/Cargo.toml','rb'))['package']['version'])")
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install from PyPI with retry on CDN delay
        run: |
          set -e
          for i in 1 2 4 8 16 32 64; do
            python -m pip install --no-cache-dir \
              "vantadb-${{ matrix.provider }}==${{ steps.pkg_version.outputs.version }}" && break
            echo "Package not yet available, retrying in ${i}s..."
            sleep $i
          done

      - name: Functional smoke test - verify published wheel
        run: python .github/scripts/provider_wheel_smoke.py ${{ matrix.provider }}
