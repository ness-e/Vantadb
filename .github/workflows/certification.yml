name: 'HEAVY: Certification - tests, benches, chaos, fuzz'

# CI-08 Step 4 (SRV-10.md tabla migracion): consolida 4 workflows (21 jobs).
# Origenes: heavy-certification.yml, heavy-bench-nightly.yml, chaos.yml, fuzz.yml.
# DEDUP: los 3 jobs 'ci-gate' (reusable call a ci-gate.yml, identicos) -> 1.
# Triggers = push[main] + PR(sin branches: preserva fuzz verbatim, RULES True
#   follow-up igual que Step 3) + 3 schedules (bench 02:00 diario, cert dom
#   03:00, fuzz lun 06:00) + dispatch con inputs union.
# Deltas documentados vs origenes:
# - dispatch: max_seconds pasa de required:true a required:false default '60'
#   (un solo dispatch compartido; no romper triggers manuales de otros jobs).
# - bench jobs sin permissions job-level heredan write/issues del workflow
#   origen: se les inyecta permissions job-level identico (cero cambio real).
# - jobs cert/bench solo corrian en schedule/dispatch -> gate explicito.
# - chaos nunca corria en schedule -> gate != schedule.
# - fuzz nunca corria en push -> gate != push (fuzz en push seria carga nueva).
# - schedule: cada cron corre SOLO su familia (ventana por event.schedule):
#   bench 02:00 diario, cert dom 03:00, fuzz lun 06:00. Sin esto, cada cron
#   pagaba la suite completa (causa de runs de 79 min + 3 failures diarios).
# - heavy-cert sin concurrency group -> ahora grupo estandar serializado, no cancelable.
# - FIND-716: los 4 bench jobs (light-benchmarks/high-density/analyze/
#   critcmp-regression) llevaban ademas un concurrency job-level con el MISMO
#   group que el workflow. GitHub admite un solo job O run por group, asi que
#   el job no podia adquirir un slot que su propio run retiene: GitHub lo
#   fallaba al instante, sin runner ni steps (medido: started_at ==
#   completed_at, runner_name = none). Borrado: el workflow-level ya protege
#   el bench 02:00 de un push. No re-duplicar.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.config/nextest.toml'
      - 'fuzz/**'
      - 'vantadb-*/**'
      - 'vanta-memory/**'
      - '.github/workflows/certification.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.config/nextest.toml'
      - 'fuzz/**'
      - 'vantadb-*/**'
      - 'vanta-memory/**'
      - '.github/workflows/certification.yml'
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 3 * * 0'
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      include_sift:
        description: "Run SIFT-1M validation (requires dataset download)"
        type: boolean
        default: false
      include_competitive:
        description: "Run competitive benchmarks"
        type: boolean
        default: false
      enable_critcmp:
        description: 'Run critcmp regression comparison (requires a previous critcmp-baseline artifact from an earlier enabled run)'
        type: boolean
        default: false
      max_seconds:
        description: 'Seconds per fuzz target'
        required: false
        default: '60'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  # Heavies de schedule nunca se cancelan por un push (fuzz-pr lleva override
  # cancel:true por ser el unico pesado que corre en PRs).
  # FIND-716 — NO repetir este group en un `concurrency:` job-level: el run ya
  # lo ocupa, asi que GitHub no encola el job, lo falla al instante (failure,
  # 0 steps, sin runner). `cancel-in-progress: false` NO protege de eso: solo
  # impide cancelar lo que ya corre. Si un job necesita su propio gate, usar un
  # group DISTINTO (failpoint-tests, fuzz-pr).

permissions:
  contents: read

jobs:
  ci-gate:
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/ci-gate.yml
    permissions:
      checks: read
  stress-protocol:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')

    name: "Certification: stress_protocol"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 8192
          free-disk: true
      - name: Run stress protocol
        run: cargo test --release --test stress_protocol -- --nocapture --test-threads=1
  multi-namespace-stress:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')

    name: "Certification: multi_namespace_stress"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: Run multi-namespace stress test
        run: cargo test --release --test multi_namespace_stress -- --nocapture --test-threads=1
  hnsw-validation:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')

    name: "Certification: hnsw_validation"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 8192
          free-disk: true
      - name: Run HNSW validation
        run: cargo test --release --test hnsw_validation -- --nocapture --test-threads=1
  hnsw-recall:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')

    name: "Certification: hnsw_recall_certification"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          free-disk: true
      - name: Run HNSW recall certification
        timeout-minutes: 25
        run: cargo test --release --test hnsw_recall_certification -- --nocapture --test-threads=1
  sift-validation:
    name: "Certification: sift_validation"
    if: github.event_name == 'workflow_dispatch' && inputs.include_sift == true
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: Run SIFT validation
        timeout-minutes: 30
        run: cargo test --release --test sift_validation -- --nocapture --test-threads=1
  competitive-bench:
    name: "Certification: competitive_bench"
    if: github.event_name == 'workflow_dispatch' && inputs.include_competitive == true
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: Run competitive benchmark
        timeout-minutes: 30
        run: cargo test --release --test competitive_bench -- --nocapture --test-threads=1
  failpoint-tests:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')

    name: "Certification: failpoint_injections"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: failpoints-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: Run failpoint tests
        env:
          RUST_BACKTRACE: 1
        run: >
          cargo test --features failpoints
          --test chaos_integrity
          --test wal_resilience
          --test crash_injection
          --
          --test-threads=1
  storage-persistence:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')

    name: "Certification: storage_persistence"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 4096
          free-disk: true
      - name: Run storage persistence & recovery tests
        timeout-minutes: 75
        run: >
          cargo test --release --features cli
          --test backend_tests
          --test storage
          --test durability_recovery
          --test derived_index_recovery
          --test index_reconstruction
          --test fjall_cold_copy_restore
          --test property_durability
          --test file_locking_stress
          --test schema_evolution
          --test gc
          --test mmap_index
          --test mutations
          --test antilocality_layout
          --test tombstone_ann_vstore
          --test multi_process_lock
          --test operational_metrics
          --test prefetch_benchmark
          --
          --test-threads=1
  text-index:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')

    name: "Certification: text_index_recovery"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 4096
      - name: Run text index recovery tests
        timeout-minutes: 45
        run: cargo test --release --test text_index_recovery -- --test-threads=1 --nocapture
  memory-concurrency:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')

    name: "Certification: memory_concurrency"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 4096
          free-disk: true
      - name: Run memory & concurrency heavy tests (batch 1 — fast)
        timeout-minutes: 30
        run: >
          cargo test --release
          --features rocksdb
          --test concurrency_parity
          --test edge_cases
          --
          --test-threads=1
          --nocapture
      - name: Run memory & concurrency heavy tests (batch 2 — memory)
        timeout-minutes: 90
        run: >
          cargo test --release
          --features rocksdb
          --test memory_brutality
          --test memory_export_import
          --test memory_api
          --test memory_telemetry
          --
          --test-threads=1
          --nocapture
      - name: Run fuzz proptest
        timeout-minutes: 30
        run: >
          cargo test --release
          --test fuzz_proptest
          --
          --test-threads=1
  other-heavy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')

    name: "Certification: other_heavy"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 4096
          free-disk: true
      - name: Cache benchmark dataset (GloVe 100d)
        id: cache-benchmark
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/benchmark/glove.6B.100d.txt
          key: glove-100d-${{ hashFiles('scripts/download_benchmark_datasets.sh') }}
      - name: Download benchmark datasets
        if: steps.cache-benchmark.outputs.cache-hit != 'true'
        run: bash scripts/download_benchmark_datasets.sh
      # TBH-01 pre-test gate — fail fast if the dataset THIS job consumes is
      # missing, so benchmark_datasets.rs cannot silently skip.
      # FIND-328: scoped to GloVe-100 and moved AFTER the download. This job
      # downloads only GloVe-100 (scripts/download_benchmark_datasets.sh);
      # SIFT-1M, GloVe-300 and the ground-truth subsets belong to the opt-in
      # jobs (sift-validation / competitive-bench). The full 5-dataset check
      # (scripts/verify_datasets.sh) used to run here BEFORE any download, so
      # the job could never go green — a permanent red that looked like
      # protection. verify_datasets.sh keeps its exit 0/1 contract for local
      # and opt-in use; it is not the CI gate of this job.
      - name: Verify required benchmark dataset (TBH-01, GloVe-100)
        run: |
          if [ ! -s data/benchmark/glove.6B.100d.txt ]; then
            echo "::error::GloVe-100 missing — benchmark_datasets.rs would silently skip (TBH-01, FIND-328)"
            exit 1
          fi
          VEC_COUNT=$(wc -l < data/benchmark/glove.6B.100d.txt)
          if [ "$VEC_COUNT" -lt 1000 ]; then
            echo "::error::GloVe-100 truncated: $VEC_COUNT lines (expected 400000) — same guard as scripts/download_benchmark_datasets.sh"
            exit 1
          fi
      - name: Run remaining heavy tests
        # ponytail: 45 min fit cached runs; bump to 60 so a cold release
        # compile (~40 min) + tests (~18 min) fits within the job window.
        timeout-minutes: 75
        run: |
          cargo test --release --features cli,arrow \
            --test benchmark_internal \
            --test benchmark_datasets \
            --test cli_tests \
            --test structured_api_v2 \
            --test python_sdk_boundary \
            --test hybrid_ranking_metrics \
            --test hybrid_retrieval_quality \
            --test basic_node \
            --test hardware_profiles \
            --test vector_scale_check \
            --test integration \
            --test multilingual_tokenizer_integration \
            --test columnar \
            -- \
            --test-threads=1
          cargo test --release \
            --package vantadb-server \
            --features prometheus \
            --test mcp_integration \
            --test e2e \
            --test benchmarks \
            --test server \
            -- \
            --test-threads=1
          cargo test --release \
            --package vantadb-mcp \
            --test mcp_tests \
            -- \
            --test-threads=1
          cargo test --release \
            --package vantadb \
            --lib index::tests::concurrent_insert_preserves_hnsw_invariants \
            -- \
            --nocapture
  mutation-test:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')

    name: "Certification: mutation_test (cargo-mutants)"
    needs: ci-gate
    runs-on: ubuntu-latest
    # FIND-717 budget: 105 min for the job, 90 of them for the mutation run
    # itself (the step below). Do not raise either number without a new
    # measurement — docs/dev/tasks/FIND-717.md §Medición.
    timeout-minutes: 105
    env:
      # FIND-717 — pinned mutation surface, one `--file` per entry.
      # The scope IS the budget: `cargo mutants --list -p vantadb` finds
      # 12,676 mutants (231 files) and the diff since v0.9.0 finds 3,741.
      # Neither fits any CI budget, so this job measures a small, fixed,
      # high-value surface instead of pretending to cover the crate.
      # Growing the list needs a new `--list` count + cost measurement;
      # sharding (`--shard k/n` + matrix) is the documented way to grow it
      # without growing wall-time: https://mutants.rs/shards.html
      MUTANTS_FILES: "src/physical_plan/dedup.rs src/index/search/pool.rs"
      # Baseline of KNOWN survivors, measured on 2026-11-26 (FIND-717
      # §Medición): 7 of the 9 mutants on the surface are killed, these two
      # are genuinely untested behaviours, not noise:
      #   * dedup.rs:63 `PhysicalDedup::close -> Ok(())` — no test asserts the
      #     close propagates to the child operator (the mock's close is a no-op).
      #   * pool.rs:16 `take_nl -> Default::default()` — the test only asserts
      #     the recycled buffer is empty, which a fresh empty vec also satisfies.
      # Excluding them keeps "0 survivors" meaning what it says: any NEW
      # survivor turns the job red. Remove the matching entry in the same PR
      # that adds the test — the two assertions are written out in
      # docs/dev/tasks/FIND-717.md §Deuda.
      MUTANTS_KNOWN_SURVIVORS: "src/physical_plan/dedup\\.rs:63:9|src/index/search/pool\\.rs:16:5"
      # Two-sided mechanical guard on the budget. Measured cost is ~4.4
      # min/mutant plus ~4 min of warm baseline (FIND-717 §Medición), so the
      # ceiling is what fits 90 min including margin for new branches in the
      # pinned files; the floor stops the surface from being trimmed down to
      # a single file by a quiet edit. Both fail in seconds with the reason
      # instead of timing out the step or shipping a near-empty gate.
      MUTANTS_MIN_SURFACE: "6"
      MUTANTS_MAX_SURFACE: "12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: Install cargo-mutants
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-mutants
      # FIND-717: the crate-wide inventory is CONTEXT, not the gate — it is
      # what tells a reader how small the tested surface is (the step below
      # prints `surface` vs `crate`). Plain text, not `--json`: the json form
      # embeds a full diff per mutant and nothing consumes it; the artifact
      # only needs the count plus the mutant names.
      - name: Mutant inventory (whole crate, `-p vantadb`)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p benchmarks
          cargo mutants --list -p vantadb > benchmarks/mutation_inventory.txt
          test -s benchmarks/mutation_inventory.txt || {
            echo "::error::empty mutant inventory — cargo-mutants produced no output (FIND-328)"
            exit 1
          }
          wc -l benchmarks/mutation_inventory.txt
      # FIND-717 replaced the two failure modes this job used to have:
      #   * `--check` = "Cargo check generated mutants, but don't run tests"
      #     (cargo-mutants --help), so it never measured test quality;
      #   * a trailing `|| true` turned every outcome green.
      # What runs now: for each mutant on MUTANTS_FILES, cargo-mutants
      # recompiles and runs `cargo test --lib -p vantadb`; a survivor (exit 2)
      # must turn this job red, so there is no `|| true` and no
      # `continue-on-error` here (AGENTS.md Regla 2).
      - name: Mutation gate — 0 survivors on the pinned surface
        timeout-minutes: 90
        run: |
          set -euo pipefail
          files=()
          for f in $MUTANTS_FILES; do files+=(--file "$f"); done
          surface=$(cargo mutants --list -p vantadb "${files[@]}" --exclude-re "$MUTANTS_KNOWN_SURVIVORS" | wc -l)
          crate=$(wc -l < benchmarks/mutation_inventory.txt)
          {
            echo "### cargo-mutants — pinned surface (FIND-717)"
            echo ""
            echo "| scope | mutants |"
            echo "|---|---|"
            echo "| crate \`-p vantadb\` (inventory, **not** tested) | $crate |"
            echo "| pinned surface (**tested**, threshold: 0 survivors) | $surface |"
            echo "| known survivors excluded from the threshold | 2 (see FIND-717 §Deuda) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$surface" -eq 0 ]; then
            echo "::error::the pinned mutation surface selected 0 mutants — a filter that matches nothing is not a gate (FIND-717)"
            exit 1
          fi
          if [ "$surface" -lt "$MUTANTS_MIN_SURFACE" ] || [ "$surface" -gt "$MUTANTS_MAX_SURFACE" ]; then
            echo "::error::surface=$surface is outside the declared budget [$MUTANTS_MIN_SURFACE..$MUTANTS_MAX_SURFACE] mutants. Either the pinned files were edited (mutant count changed), MUTANTS_FILES was trimmed/expanded, or the budget needs a new measurement: re-run 'cargo mutants --list -p vantadb <files>' and update MUTANTS_* in docs/dev/tasks/FIND-717.md + this workflow (or shard: https://mutants.rs/shards.html)."
            exit 1
          fi
          # No --timeout and no --build-timeout value below the measured build:
          #   * `--timeout` caps the TEST phase only, and the measured baseline
          #     test is 63 s — a fixed 90 s cap classified a healthy mutant as
          #     TIMEOUT (exit 3) on a loaded machine. The default is 5x the
          #     baseline, which is the right number and adapts to the runner.
          #   * with `--in-place` there is no build timeout at all, and
          #     `--cap-lints=true` can make rustc hang; 900 s is ~4x the
          #     measured per-mutant build (192-256 s).
          set +e
          cargo mutants -p vantadb "${files[@]}" \
            --exclude-re "$MUTANTS_KNOWN_SURVIVORS" \
            --in-place --cap-lints=true --build-timeout 900 -- --lib
          rc=$?
          set -e
          case "$rc" in
            0) echo "::notice::all $surface mutants on the pinned surface were caught by cargo test --lib" ;;
            2) echo "::error::$surface mutants tested, at least one SURVIVED — a survivor is an untested behaviour (see mutants.out/missed.txt)" ;;
            3) echo "::error::a mutant timed out (default 5x baseline test time) — inspect mutants.out/timeout/ before assuming a hang" ;;
            4) echo "::error::baseline suite failed before mutating — cargo test --lib -p vantadb is not green on this commit" ;;
            *) echo "::error::cargo-mutants failed with exit $rc (see mutants.out)" ;;
          esac
          exit "$rc"
      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results
          path: |
            benchmarks/mutation_inventory.txt
            mutants.out/
          if-no-files-found: error
  light-benchmarks:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *')
    permissions:
      contents: read

    name: Light benchmarks
    needs: ci-gate
    # No concurrency propio: ver la nota del concurrency de workflow (FIND-716).
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 6144
          free-disk: true

      - name: Ensure metricas landing zone (tee fails if dir is missing)
        run: mkdir -p metricas/benchmarks

      - name: Run HNSW benchmarks
        run: cargo bench --bench hnsw_pure -- --nocapture 2>&1 | tee metricas/benchmarks/nightly_hnsw_results.txt

      - name: Run hybrid queries benchmarks
        run: cargo bench --bench hybrid_queries -- --nocapture 2>&1 | tee metricas/benchmarks/nightly_hybrid_results.txt

      - name: Run stress test benchmarks
        run: cargo bench --bench stress_test -- --nocapture 2>&1 | tee metricas/benchmarks/nightly_stress_results.txt

      - name: Run concurrent benchmarks
        run: cargo bench --bench bench_concurrent -- --nocapture 2>&1 | tee metricas/benchmarks/nightly_concurrent_results.txt

      # FIND-70: `ingestion_concurrent` requires `--features async-ingestion`
      # (Cargo.toml `required-features`) — without the flag cargo silently
      # SKIPS it, so the nightly gate cited in docs/user/operations/BENCHMARKS.md
      # §13 never ran. Run it explicitly with the feature.
      - name: Run ingestion_concurrent benchmarks
        run: cargo bench --bench ingestion_concurrent --features async-ingestion -- --nocapture 2>&1 | tee metricas/benchmarks/nightly_ingestion_results.txt

      - name: Run canonical_p99 benchmarks
        run: cargo bench --bench canonical_p99 -- --nocapture 2>&1 | tee metricas/benchmarks/nightly_canonical_p99_results.txt

      - name: Run memory_budget benchmarks
        env:
          MEMORY_BUDGET_SCALE: lite
        run: cargo bench --bench memory_budget -- --nocapture 2>&1 | tee metricas/benchmarks/nightly_memory_budget_results.txt

      - name: Run incremental_bench benchmarks
        run: cargo bench --bench incremental_bench -- --nocapture 2>&1 | tee metricas/benchmarks/nightly_incremental_bench_results.txt

      - name: Run ivf_bench benchmarks
        run: cargo bench --bench ivf_bench -- --nocapture 2>&1 | tee metricas/benchmarks/nightly_ivf_bench_results.txt

      - name: Run tokenizer benchmarks (advanced-tokenizer feature)
        run: cargo bench --bench tokenizer_bench --features advanced-tokenizer -- --nocapture 2>&1 | tee metricas/benchmarks/nightly_tokenizer_results.txt

      - name: Run wal_throughput benchmarks
        run: cargo bench --bench wal_throughput -- --nocapture 2>&1 | tee metricas/benchmarks/nightly_wal_results.txt

      - name: Run batch_existing_check benchmarks
        run: cargo bench --bench batch_existing_check -- --nocapture 2>&1 | tee metricas/benchmarks/nightly_batch_check_results.txt

      - name: Run acorn filtered-search benchmarks
        run: cargo bench --bench acorn_filtered_search -- --nocapture 2>&1 | tee metricas/benchmarks/nightly_acorn_results.txt

      - name: Upload light results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: light-bench-results
          path: |
            metricas/benchmarks/nightly_*_results.txt
            target/criterion/
  high-density:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *')
    name: High density
    needs: ci-gate
    # No concurrency propio: ver la nota del concurrency de workflow (FIND-716).
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 6144
          free-disk: true

      - name: Run high density benchmarks
        run: cargo bench --bench high_density -- --nocapture 2>&1 | tee metricas/benchmarks/nightly_density_results.txt

      - name: Upload density results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: density-bench-results
          path: |
            nightly_density_results.txt
            target/criterion/
  analyze:
    # always(): corre aunque light/high-density fallen o se skipeen — los steps
    # de descarga llevan continue-on-error y el merge tolera dirs ausentes,
    # asi se conservan resultados parciales en vez de perderlos todos.
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *'))
    permissions:
      contents: write
      issues: write

    name: Analyze
    needs: [ci-gate, light-benchmarks, high-density]
    # No concurrency propio: ver la nota del concurrency de workflow (FIND-716).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang librocksdb-dev

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download light results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: light-bench-results
          path: light/

      - name: Download density results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: density-bench-results
          path: density/

      - name: Merge criterion results
        run: |
          mkdir -p target/criterion
          if [ -d light/target/criterion ]; then
            cp -r light/target/criterion/* target/criterion/
          fi
          if [ -d density/target/criterion ]; then
            cp -r density/target/criterion/* target/criterion/
          fi
          cp light/nightly_*_results.txt . 2>/dev/null || true
          cp density/nightly_*_results.txt . 2>/dev/null || true

      - name: Extract criterion estimates
        id: extract
        run: |
          python scripts/bench_regression.py extract \
            --criterion-root target/criterion \
            --output metricas/benchmarks/benchmark_report_criterion.json

      # CATEGORY: INFORMATIONAL — regression comparison may fail when no
      # baseline exists (first run) or baseline format changes. Non-blocking.
      - name: Compare against baseline
        id: compare
        continue-on-error: true # CATEGORY: INFORMATIONAL - comparacion contra el baseline: informa de la regresion de rendimiento; el gate que decide es el step anterior
        run: |
          python scripts/bench_regression.py compare \
            metricas/benchmarks/benchmark_report_criterion.json \
            --format json \
            --output metricas/benchmarks/bench_comparison_result.json \
            --fail-on-regression
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Detect regressions
        id: check_regression
        run: |
          if [ -f metricas/benchmarks/bench_comparison_result.json ]; then
            HAS_REG=$(python -c "import json; print(json.load(open('metricas/benchmarks/bench_comparison_result.json'))['has_regression'])")
            echo "has_regression=$HAS_REG" >> "$GITHUB_OUTPUT"
            echo "Regression detected: $HAS_REG"
          else
            echo "has_regression=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create regression issue
        if: steps.check_regression.outputs.has_regression == 'True'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('metricas/benchmarks/bench_comparison_result.json', 'utf8'));
            const markdown = fs.readFileSync('metricas/benchmarks/nightly_hnsw_results.txt', 'utf8').slice(0, 500)
              + '\n...\n*(truncated — see workflow artifacts for full logs)*';

            let body = `## ⚠️ Benchmark Regression Detected

            **Commit:** \`${context.sha}\`
            **Workflow:** [${context.workflow}](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})
            **Threshold:** ${report.threshold_pct}%

            ### Regressions

            | Benchmark | Before (ms) | After (ms) | Change | Severity |
            |---|---|---|---|---|
            `;

            for (const r of report.regressions) {
              const icon = r.severity === 'critical' ? '🔴' : '🟡';
              body += `| ${r.label} | ${r.prev_ms} | ${r.current_ms} | +${r.change_pct}% | ${icon} ${r.severity} |\n`;
            }

            body += `\n<details><summary>Raw benchmark logs (truncated)</summary>\n\n\`\`\`\n${markdown}\n\`\`\`\n</details>`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['benchmark', 'regression'],
            });

            const existing = issues.find(i =>
              i.title.startsWith('[Benchmark] Regression detected')
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `**Re-checked on ${new Date().toISOString()}** — regression still present.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Benchmark] Regression detected — ${new Date().toISOString().slice(0, 10)}`,
                labels: ['benchmark', 'regression'],
                body: body,
              });
            }

      - name: Store benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-benchmark-results
          path: |
            nightly_*_results.txt
            metricas/benchmarks/benchmark_report_criterion.json
            metricas/benchmarks/bench_comparison_result.json
          retention-days: 30

      # AUD-030: promote tonight's clean run to the new baseline so the
      # regression gate never compares against a stale baseline. Nightly
      # (schedule) only — PR runs must NOT mutate the repo baseline. Skipped
      # when a regression was detected so a bad run is never baked in.
      - name: Update and commit baseline (nightly only)
        if: github.event_name == 'schedule' && steps.check_regression.outputs.has_regression != 'True'
        run: |
          python scripts/bench_regression.py update-baseline metricas/benchmarks/benchmark_report_criterion.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/criterion_baseline.json
          git commit -m "chore(ci): update criterion bench baseline (nightly) [skip ci]" || echo "No baseline change"
          git push

  # critcmp regression candidate — OFF by default.
  # Enabled via `workflow_dispatch` input `enable_critcmp=true`. On the first
  # enabled run there is no prior baseline, so it only seeds the
  # `critcmp-baseline` artifact; on subsequent enabled runs it downloads that
  # artifact and compares base vs candidate. Gated by `if:` (NOT
  # continue-on-error) so it never breaks the default nightly run. The main
  # bench runs above stay on criterion's default `new/` output so
  # scripts/bench_regression.py keeps working.
  critcmp-regression:
    permissions:
      contents: read

    name: critcmp regression (candidate)
    if: github.actor != 'dependabot[bot]' && (github.event.inputs.enable_critcmp == 'true')
    needs: ci-gate
    # No concurrency propio: ver la nota del concurrency de workflow (FIND-716).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 6144
          free-disk: true

      - name: Install critcmp
        run: cargo install critcmp --version 0.1.8 --locked

      - name: Run hnsw_pure bench with candidate baseline
        run: cargo bench --bench hnsw_pure -- --save-baseline candidate

      - name: Fetch previous critcmp baseline (if any)
        id: getbase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.name=="critcmp-baseline" and .expired==false) | .id' \
                | head -n1 || true)
          if [ -n "$AID" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$AID/zip" \
              -H "Accept: application/vnd.github+zip" > /tmp/critcmp_base.zip
            mkdir -p /tmp/critcmp_prev
            unzip -o /tmp/critcmp_base.zip -d /tmp/critcmp_prev
            if [ -d /tmp/critcmp_prev/hnsw_pure/candidate ]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare with critcmp
        if: steps.getbase.outputs.found == 'true'
        run: |
          set -euo pipefail
          mkdir -p target/criterion/hnsw_pure
          cp -r /tmp/critcmp_prev/hnsw_pure/candidate target/criterion/hnsw_pure/base
          critcmp base candidate

      - name: Upload candidate as new baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: critcmp-baseline
          path: target/criterion/
          retention-days: 30
  chaos:
    # Corre en la ventana cert semanal + dispatch (ya no bloquea PRs: flaky-prone).
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0'))

    name: Chaos Tests (failpoints)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          install-nextest: true
          install-system-deps: true
          swap-mb: 4096

      - name: Run chaos tests (chaos nextest profile)
        run: cargo nextest run --profile chaos --features failpoints -p vantadb
  build:
    name: Build fuzz targets
    needs: ci-gate
    # el fuzz completo queda para el cron de fuzz (lun 06:00)/dispatch; PRs usan fuzz-pr
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef # v2.9.1
        with:
          shared-key: fuzz-build

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@25f25a6eff908c77b40880d0b1f5d2a032b6e75a # v2.83.4
        with:
          tool: cargo-fuzz

      - name: Build all fuzz targets
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: [ci-gate, build]
    # el fuzz completo queda para el cron de fuzz (lun 06:00)/dispatch; PRs usan fuzz-pr
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_parser
          - fuzz_node_deserialize
          - fuzz_wal
          - fuzz_archive

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef # v2.9.1
        with:
          shared-key: fuzz-build

      - name: Restore fuzz corpus cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.ref_name }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Clean stale crash artifacts
        run: rm -rf fuzz/artifacts/${{ matrix.target }}/

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@25f25a6eff908c77b40880d0b1f5d2a032b6e75a # v2.83.4
        with:
          tool: cargo-fuzz

      - name: Run ${{ matrix.target }}
        env:
          MAX_SECONDS: ${{ inputs.max_seconds || '60' }}
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time="$MAX_SECONDS" -max_len=8192

      - name: Upload fuzz corpus + crashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14  # FIND-141: corpus por run_id efimero (weekly Mon 06:00)
  fuzz-pr:
    # Gate acotado para PRs: 75s por target (4 targets en paralelo ≈ 5-8 min).
    # Ubuntu-only (Windows da flaky en fuzz); timeout <= 15 min; sin continue-on-error (Regla 2).
    name: Fuzz PR gate ${{ matrix.target }}
    if: github.actor != 'dependabot[bot]' && ((github.event_name == 'pull_request') && (github.event_name != 'push'))
    # Unico pesado en PRs: se cancela al pushear (el top es cancel:false).
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.job }}
      cancel-in-progress: true
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_parser
          - fuzz_node_deserialize
          - fuzz_wal
          - fuzz_archive

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef # v2.9.1
        with:
          shared-key: fuzz-build

      - name: Restore fuzz corpus cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.ref_name }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@25f25a6eff908c77b40880d0b1f5d2a032b6e75a # v2.83.4
        with:
          tool: cargo-fuzz

      - name: Run bounded fuzz on ${{ matrix.target }}
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=75 -max_len=8192

      - name: Upload fuzz corpus + crashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-pr-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14  # FIND-141: mismo criterio que job fuzz (artefactos PR efimeros)

  # FIND-767 — the only lane that executes `security_audit`.
  #
  # Counted by FIND-752: the binary holds 6 tests, it sits in the
  # `default-filter` exclusion list (`.config/nextest.toml:68`) and
  # `git log -S"security_audit" -- .github/workflows` returned 0 commits
  # before this job existed, so none of them ever ran. Both local gates skip
  # it too — `dev-tools/verify.ps1:117`
  # by name in the `cargo test` fallback, `dev-tools/coverage-budget.ps1:79` by
  # `--skip`. "Exists and never runs" was the whole story.
  #
  # Why this lane and not a PR lane in ci-rust.yml (measured, not assumed):
  # the 6 tests take 63-81 s wall over two sessions (target/debug on Windows,
  # 1/4/8 test-threads; this session 68-81 s, the P2-01 review re-measured
  # 63-76 s), with `security_audit_resource_exhaustion` alone at 63-89 s.
  # That is over the "worth it per PR" bar, so it runs weekly instead of
  # charging every PR a minute-plus for a suite most diffs cannot affect.
  # If the suite is ever cut to <30 s, revisit: a per-PR lane is strictly better
  # coverage than this one (this runs `main` on Sundays only, and `main` trails
  # `develop` — see FIND-752 §(b)).
  #
  # Deliberately isolated (FIND-766 edits `other-heavy` in the next wave): own
  # job, own `name:`, no dataset download, no step borrowed from `other-heavy`.
  # It also has no `needs: ci-gate`, and that is a decision, not an omission:
  # this is the ONLY lane that runs these tests, and `needs: ci-gate` turns it
  # into `skipped` (which GitHub reports as success) whenever main CI is red —
  # the invisible-coverage failure mode FIND-752 measured. ~70 s of tests plus
  # one debug build once a week is cheaper than a gate that reports green
  # without measuring.
  security-audit:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')
    name: "Certification: security_audit"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          install-nextest: true
          shared-key: security-audit
          # Same mitigation as the other heavy jobs (other-heavy /
          # memory-concurrency): resource_exhaustion does 10 000 batch puts,
          # 30 open/close cycles and 8 threads x 250 puts
          # (tests/security/security_audit.rs:363,410). Unmeasured on a Linux
          # runner, so keep the swap the siblings already ask for.
          swap-mb: 4096
      # `--ignore-default-filter` cancels the exclusion in
      # `.config/nextest.toml:68`; without it the selection matches 0 tests and
      # exits 0 — FIND-738's failure mode, and the reason this suite could look
      # wired up while measuring nothing. `--no-tests fail` is the mechanical
      # guard: an empty selection is red, never green (`auto` —the default—
      # already resolves to fail; `fail` pins it instead of inheriting a
      # default that can change). The count is not a claim in this file:
      # nextest prints its own `6 tests run: 6 passed` summary, and the first
      # real run is what publishes it.
      - name: Run the security audit suite (6 tests)
        run: >
          cargo nextest run -p vantadb --test security_audit
          --ignore-default-filter --profile audit --no-tests fail --locked
