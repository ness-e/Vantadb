name: 'GATES: Docs - lint, links, secrets, API surface, examples, rustdoc'

# CI-08 Step 4 (SRV-10.md tabla migracion): consolida 6 workflows (16 jobs 1:1
# tras fusionar docs-secrets×2 y retirar lint-markdown subsumido por baseline 0).
# Origenes: gate-docs.yml, gate-docs-links.yml, gate-api-docs.yml,
#   gate-doc-examples.yml, gate-docs-secrets.yml, ci-rustdoc.yml.
# Triggers = `push` filtrado por paths, `pull_request` SIN filtro (FIND-765) +
# schedule semanal de docs-links (lun 07:23 UTC).
# Deltas documentados vs origenes:
# - rustdoc usaba concurrency group 'rustdoc-${{ github.ref }}'; ahora grupo
#   estandar (evita runs huerfanos fuera del grupo; historial en git).
# - jobs no-links llevan gate != schedule (nunca corrian en schedule).
# - ci-rust.yml / release-* con continue-on-error bare: fuera de alcance
#   (NOTICED BUT NOT TOUCHING, ver SRV-10.md).
# - actionlint job + inventory gate (conteo vs CI_POLICY.md); paths incluyen
#   .github/workflows/** para lintar workflow-only PRs. Nota: 'vantadb-*/**'
#   ya cubre vantadb-python/** completo (pyproject/tests incluidos).
on:
  push:
    branches: [main, develop]
  # FIND-816 (2026-11-27): `push` TAMPOCO lleva `paths:` ya. Misma solucion que
  # `FIND-807` en `ci-rust.yml` (`1c6cee680`, ya probada en produccion): el
  # filtro se resuelve DENTRO del workflow, en el job `docs-scope`, con el rango
  # `event.before`..`HEAD` del push / `base.sha`..`HEAD` del PR.
  #
  # Lo medido, no deducido (y re-medido al escribir esto, con `git ls-files` y
  # los 21 patrones aplicados con la semantica de GitHub -`*` no cruza `/`, `**`
  # si-): **430 de 2415 ficheros trackeados (17,8 %) caian fuera del filtro**
  # (la fila decia 426 de 2351; el arbol crecio). El reparto, medido igual:
  # integrations/ 81, vanta-proxy/ 61, dev-tools/ 52, examples/ 38, benches/ 27,
  # skills/ 26, evals/ 25, benchmarks/ 21, assets/ 16, fuzz/ 12, .github/ 11 (los
  # de la raiz del directorio, no `.github/workflows/**` ni `.github/actions/**`),
  # embeddings/ 8, y el resto sueltos (Justfile, deny.toml, build.rs, LICENSE...).
  #
  # Por que importa: de este fichero salen **4 contexts required** de `develop`
  # (`Internal links resolve`, `Frontmatter schema, kind agreement, orphans`,
  # `Generated indexes are current`, `Generate API reference (rustdoc)`). Un
  # push cuyo rango solo toque lo que el filtro deja fuera no dispara el
  # workflow, y esos 4 quedan **ausentes** = `Pending` para siempre (el deadlock
  # de `FIND-765`), tapado hoy por el bypass de admin del ruleset.
  #
  # El coste que `paths` ahorraba, medido en `45771790202`: 967 s de runner y
  # 10m38s de pared por PR, de los que **84 % son 3 jobs** (doc-examples 466 s,
  # doctests 270 s, rustdoc 73 s). Esos 3 son los unicos gateados por
  # `docs-scope`; el resto (los 13 baratos, <=4m10s en total) reporta siempre,
  # que es justo lo que compra que los required tengan veredicto.
  # FIND-765 (2026-11-26): por esto NINGUN evento de este fichero lleva `paths:`.
  # Un workflow que no dispara no reporta NINGUN check-run, y los contexts
  # required que se le atribuyen quedan en "Pending" para siempre: la doc dice
  # "Avoid requiring workflows that can be skipped" (docs.github.com/en/pull-
  # requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-
  # status-checks). Contraste: un JOB que se salta por `if:` SI reporta, y
  # GitHub lo cuenta como Success ("Successful check statuses are success,
  # skipped, and neutral", /en/pull-requests/reference/status-checks).
  # De este fichero salen **4** de los 15 contexts required de `develop`
  # (23692587; el comentario original decia 3 de 13, escrito antes de que
  # `Generate API reference (rustdoc)` fuera required) y 6 de los 18 de `main`
  # (16844590).
  # El reparto de los 430 ficheros fuera de los 21 patrones esta arriba, medido;
  # un PR que solo los tocara era inmergeable y el PR no decia por que.
  # Coste medido de los 16 jobs en un PR (run 45771790202): 967 s de runner y
  # 10m38s de pared, pero 84% de ese tiempo son 3 jobs (doc-examples 466 s,
  # doctests 270 s, rustdoc 73 s) que un PR de docs no puede afectar. Ese
  # filtrado fino va DENTRO de esos tres con su `if:` + el job `docs-scope`
  # (fail-closed) - nunca en el disparador, que es lo que hacia este fichero
  # hasta FIND-816.
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

# FIND-771: en `push` NO se cancela; en `pull_request` SI. No es una concesion:
# las dos superficies no pierden lo mismo.
# El defecto: desde FIND-763 este workflow hospeda un check REQUIRED
# (`Generate API reference (rustdoc)`, hoy en los rulesets de `develop` y
# `main`), y la ventana del run es la del job mas caro del repo: 13m08s medidos
# (run 45821094074, 12:35:36 -> 12:48:44; el job rustdoc 13m05s de esos 13m08s,
# o sea 99.6%; el resto de los 16 jobs, <=4m10s). Con cache caliente el JOB
# rustdoc baja a ~1m30s, pero el run lo marca el job mas lento: 4m00s y 10m38s
# medidos (45832678767 / 45771790202).
# Un push dentro de la ventana cancelaba el run entero. Lo que queda NO es un
# context ausente ni un `Expected` eterno: el check-run SI se reporta, con
# conclusion `cancelled` (comprobado en el SHA 337ee796 del run 45802050777:
# `completed / cancelled`, arrancado 10:39:45, matado 10:45:46 por el push de
# las 10:45:27). El coste real, en la superficie donde se mide: (a) 6m01s de
# rustdoc tirados a la basura; (b) ese commit queda con un required en
# `cancelled` - en `develop` no hay merge que bloquear, pero el HEAD de la rama
# queda con un no-success que `ci-gate.yml:66` lee como fallo, y la historia
# acumula commits cuyo gate de doc NUNCA midio, que es la clase de FIND-764 (SHA
# sin suite verificada) encima de un gate required. En un PR la cancelacion se
# resuelve sola: el run siguiente reporta sobre el merge ref nuevo.
#
# Por que solo en `push`: el grupo es `${{ github.ref }}`, y en `pull_request`
# ese ref es `refs/pull/N/merge`, que GitHub reconstruye en CADA push. O sea que
# el head revisado siempre trae su propio run y cancelar el anterior no pierde
# ningun context: solo tira el trabajo de un SHA que ya nadie revisa. Ahi
# cancelar es lo correcto (un fix-up no espera 13 min detras del run viejo). En
# `push` el ref es la rama, el SHA es el que queda en la historia, y no hay run
# nuevo que reporte por el: por eso no se cancela.
# Con `false` en push el coste esta acotado: GitHub mantiene como maximo uno en
# curso + uno pendiente por grupo (workflow-syntax §concurrency / "Control the
# concurrency of workflows and jobs"), y un tercer push cancela el PENDIENTE,
# cuyo SHA ya esta superado por el que lo cancela. Para que cada push de un
# burst reciba su run existe `concurrency.queue: max` (hasta 100 pendientes);
# hoy no se usa: con runs de 13 min, encolar mas de uno es encolar SHAs muertos.
# Techo declarado (eventos que NO son pull_request): `schedule` y
# `workflow_dispatch` evaluan la expresion a false, o sea que tampoco cancelan, y
# su `github.ref` es la rama por defecto (`refs/heads/main`) - el MISMO grupo que
# los push a main. Consecuencia a vigilar: un run programado o un dispatch que
# quede PENDIENTE detras de un push a main es el que `queue: single` descarta
# cuando llega el push siguiente, asi que el barrido semanal puede no correr sin
# que nadie lo note (el mismo modo de fallo "un run que nunca ocurre"). El
# dispatch manual se reintenta; el schedule se pierde hasta el lunes siguiente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs-scope:
    # FIND-816 (2026-11-27): el filtro que vivia en `on.push.paths` (21 patrones)
    # resuelto DENTRO del job, el mismo idioma que `rust-scope` en `ci-rust.yml`
    # (FIND-807, `1c6cee680`). El workflow ahora arranca en todo push y en todo
    # PR, asi que los 4 contexts required de este fichero SIEMPRE reportan; lo
    # que este job decide es si los 3 jobs caros (84 % del coste medido) tienen
    # algo que juzgar.
    #
    # Contesta dos cosas, y la segunda es el chequeo que la fila pide:
    #   (1) `docs=true|false` - algun fichero del rango casa con los 21 patrones?
    #   (2) imprime los ficheros del rango que NO casan. Ese es el 17,8 % medido
    #       (430 de 2415 trackeados): si crece o si aparece algo que un gate de
    #       docs SI lea, se ve en el log de cada run en vez de deducirse.
    #
    # Fail-open en el resto (misma politica que `rust-scope`, FIND-725/770/807):
    # evento que no es push/PR, base irresoluble, fetch o diff fallido, o patron
    # malformado -> `docs=true`, o sea que los jobs caros corren. Un falso
    # positivo cuesta minutos; un falso negativo pierde un gate en silencio.
    name: Docs Scope (push or PR range)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Lo consume el `if:` de los 3 jobs caros. Sin esta declaracion,
      # `needs.docs-scope.outputs.docs` no existe para actionlint ni para el
      # evaluador de expresiones.
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow basta: la base se busca por SHA y un diff de arboles no
          # necesita historia (mismo criterio que `rust-scope`).
          fetch-depth: 1

      - name: Decide whether the docs gates have anything to judge
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request) base="${BASE_SHA:-}" ;;
            push) base="${PUSH_BEFORE:-}" ;;
            *) echo "event=$EVENT_NAME (neither pull_request nor push) - the heavy docs jobs run"
               echo "docs=true" >> "$GITHUB_OUTPUT"
               exit 0 ;;
          esac

          # Primer push de una rama: `before` es la SHA nula, no hay rango.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::no usable base for $EVENT_NAME ($base) - fail-open: the heavy docs jobs run"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git fetch --depth 1 origin "$base"; then
            echo "::warning::cannot fetch base commit $base - fail-open: the heavy docs jobs run"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `--no-renames` + `-z`/`quotePath=false`: los mismos dos traps que
          # `rust-scope` (un fichero movido imprime solo su ruta nueva; git
          # C-quotea rutas no-ASCII y el `"` inicial romperia el match).
          if ! changed="$(git -c core.quotePath=false diff --name-only --no-renames -z "$base" HEAD | tr '\0' '\n')"; then
            echo "::warning::git diff $base..HEAD failed - fail-open: the heavy docs jobs run"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Los 21 patrones que `on.push.paths` llevaba hasta FIND-816, uno a uno
          # y sin inventar ninguno. `vantadb-[^/]+/` cubre `vantadb-*/**` y las
          # dos entradas `vantadb-python/...` quedan como estaban (son un
          # subconjunto, y mantenerlas deja el diff de este cambio legible).
          PATTERNS='^(docs/|scripts/|src/|tests/|vantadb-python/vantadb_py/|vantadb-python/vantadb/|vantadb-ts/src/|vantadb-ts/package\.json$|vantadb-node/package\.json$|vantadb-[^/]+/|vanta-memory/|providers/|\.github/workflows/|\.github/actions/|Cargo\.toml$|Cargo\.lock$|README\.md$|llms\.txt$|\.github/markdownlint-cli2\.yaml$|release-manifest\.json$|cliff\.toml$)'

          echo "--- files changed in $base..HEAD ---"
          printf '%s\n' "$changed"

          # Here-string, no pipe: `printf ... | grep -q` bajo `set -o pipefail`
          # hace que un `grep` que sale en el primer match cierre el pipe y
          # `printf` muera con SIGPIPE (141), y la respuesta seria `docs=false`
          # con un push que SI toca docs. Ver el mismo comentario, con la
          # medicion, en `rust-scope` (FIND-807).
          #
          # `rc`: 0 = match, 1 = sin match, 2 = regex rota. Tratar 2 como "sin
          # match" apagaria los jobs caros en TODOS los runs por un typo, sin
          # que nada se ponga rojo: fail-open.
          rc=0
          grep -qE "$PATTERNS" <<< "$changed" || rc=$?
          case "$rc" in
            0) echo "docs=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "docs=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::warning::grep exited $rc (malformed pattern?) - fail-open: the heavy docs jobs run"
               echo "docs=true" >> "$GITHUB_OUTPUT" ;;
          esac

          # (2) El chequeo de cobertura: lo que cae fuera de los 21 patrones y,
          # por lo tanto, no lo juzga ningun job de este fichero. Se imprime
          # siempre -en el push con `docs=true` tambien- para que el numero sea
          # evidencia de cada run, no una cifra de un comentario.
          outside="$(grep -vE "$PATTERNS" <<< "$changed" || true)"
          echo "--- outside the 21 patterns (no docs gate here reads them) ---"
          printf '%s\n' "${outside:-none}"

  # (lint-markdown removed: subsumed by docs-lint-regression with baseline 0,
  # same config, wider trigger incl. schedule sweep. Saves one runner per run.)
  check-format:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'schedule')

    name: Check Frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check frontmatter required fields
        shell: bash
        run: |
          PASS=true
          while IFS= read -r -d '' f; do
            if head -1 "$f" | grep -q "^---$"; then
              title=$(sed -n '/^---$/,/^---$/p' "$f" | grep -i "^title:" | head -1)
              if [ -z "$title" ]; then
                echo "::error file=$f::Missing frontmatter field: title"
                PASS=false
              fi
            fi
          done < <(find docs -name '*.md' -print0)
          if [ "$PASS" != "true" ]; then exit 1; fi
          echo "All documents have valid frontmatter."
  check-api-version:
    # Sin guard de dependabot (FIND-472): un job omitido por `if:` reporta
    # 'skipped' y GitHub cuenta 'skipped' como required check SATISFECHO.
    # Este check es barato (checks de docs: segundos) y es required: si se omite, un PR de
    # Dependabot mergearia sin el. Los jobs caros siguen blindados.
    if: (github.event_name != 'schedule')

    name: Check API Docs Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check OpenAPI/router parity (GOV-B4)
        run: node scripts/check_openapi_parity.mjs
      - name: Check docs/api headers match workspace version
        run: |
          VER=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | grep '^version' | head -1 | awk '{print $3}' | tr -d '"')
          echo "Workspace version: $VER"
          FAIL=0
          # openapi.yaml info.version (first version: line in file)
          OAPI=$(grep -m1 '^  version:' docs/api/openapi.yaml | awk '{print $2}' | tr -d '"')
          echo "openapi.yaml: $OAPI"
          if [ "$OAPI" != "$VER" ]; then
            echo "::error file=docs/api/openapi.yaml::version $OAPI != workspace $VER"
            FAIL=1
          fi
          # MCP.md implementation version (tracks workspace version; HTTP_API.md is protocol version 0.0.4 — intentionally not checked)
          MCP=$(grep -m1 'Current MCP implementation version:' docs/api/MCP.md | awk '{print $NF}')
          echo "MCP.md: $MCP"
          if [ "$MCP" != "$VER" ]; then
            echo "::error file=docs/api/MCP.md::version $MCP != workspace $VER"
            FAIL=1
          fi
          if [ "$FAIL" != "0" ]; then exit 1; fi
          echo "All tracked API doc headers match workspace version $VER."

  # FIND-230: the sibling of `check-api-version` for npm packaging. A stale
  # `vantadb-ts/package.json` made the 0.8.0 tag ask npm for an already
  # published version, so release-npm-61 skipped the publish in a green run
  # (run 37045932895). Pure string comparison, no network, no build.
  check-npm-versions:
    # Sin guard de dependabot (FIND-472): un job omitido por `if:` reporta
    # 'skipped' y GitHub cuenta 'skipped' como required check SATISFECHO.
    # Este check es barato (checks de docs: segundos) y es required: si se omite, un PR de
    # Dependabot mergearia sin el. Los jobs caros siguen blindados.
    if: (github.event_name != 'schedule')

    name: Check npm package versions match workspace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Self-test
        run: node scripts/docs/check-npm-versions.mjs --self-test
      - name: Gate — npm versions match the workspace version
        run: node scripts/docs/check-npm-versions.mjs
      # FIND-468/FIND-469: single audit of every version-coupled manifest
      # (package.json, Cargo manifests incl. [workspace.dependencies] path-dep
      # reqs, openapi.yaml, MCP.md, pyproject bounds, release-manifest.json,
      # package-lock.json). Without this step, drift between registries is only
      # discovered at publish time — the class of failure that shipped the
      # broken 0.9.0 manifests (post-mortem docs/dev/reviews/2026-10-20).
      - name: Self-test — sync-workspace-version
        run: node scripts/docs/sync-workspace-version.mjs --self-test
      - name: Gate — all versioned manifests match workspace version
        run: node scripts/docs/sync-workspace-version.mjs --check
      - name: Gate - Surface manifest reconciliation (DOC-10)
        run: node scripts/docs/verify-surface-manifest.mjs
      - name: Machine-readable report on failure
        if: failure()
        run: node scripts/docs/check-npm-versions.mjs --json
        continue-on-error: true # CATEGORY: INFORMATIONAL - extra detail for a red build; the gate step already failed
  check-frontier:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'schedule')

    name: Check Product Frontier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate product frontier (docs vs features/routes)
        run: pwsh -NoProfile -File scripts/validate-frontier.ps1
  docs-links:
    name: Internal links resolve
    # Sin guard de dependabot (FIND-472): un job omitido por `if:` reporta
    # 'skipped' y GitHub cuenta 'skipped' como required check SATISFECHO.
    # Este check es barato (links internos rotos: segundos) y es required: si se omite, un PR de
    # Dependabot mergearia sin el. Los jobs caros siguen blindados.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Budgets live in the script: broken links = 0 (P0-P2 drained by the F1
      # triage, docs/dev/tasks/DOCS-F1.md; P3 frozen trees -- avance/historial/**
      # and tasks/** -- are excluded there, and P4 external URLs never gate:
      # they are counted and swept by the weekly schedule instead, the
      # qdrant/lancedb `fail: false` pattern), wikilinks = 20 occurrences.
      - name: Check internal Markdown links and legacy wikilinks
        run: node scripts/docs/check-links.mjs
  docs-schema:
    name: Frontmatter schema, kind agreement, orphans
    # Sin guard de dependabot (FIND-472): un job omitido por `if:` reporta
    # 'skipped' y GitHub cuenta 'skipped' como required check SATISFECHO.
    # Este check es barato (frontmatter y huerfanos: segundos) y es required: si se omite, un PR de
    # Dependabot mergearia sin el. Los jobs caros siguen blindados.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # 2026-11-23: a UTF-8 BOM made parseFrontmatter report "no frontmatter" and
      # stamp-frontmatter injected a SECOND block — 33 documents damaged and
      # repaired by hand. The writer's assertions existed but only ran when
      # someone remembered to invoke them, so the next regression would have
      # shipped the same way. The self-test covers every reader of the same file:
      # parseFrontmatter, the compose/recompose path, and segment() (whose output
      # wikilinks-to-md.mjs writes back).
      - name: Self-test — stamp-frontmatter (frontmatter reader, writer, segmenter)
        run: node scripts/docs/stamp-frontmatter.mjs --self-test
      - name: Validate frontmatter against docs/_schema/frontmatter.schema.json
        run: node scripts/docs/check-docs.mjs
      - name: Reduction hints
        if: failure()
        run: node scripts/docs/check-docs.mjs --fix-hints
  docs-index:
    name: Generated indexes are current
    # Sin guard de dependabot (FIND-472): un job omitido por `if:` reporta
    # 'skipped' y GitHub cuenta 'skipped' como required check SATISFECHO.
    # Este check es barato (indices generados al dia: segundos) y es required: si se omite, un PR de
    # Dependabot mergearia sin el. Los jobs caros siguen blindados.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: docs/index.md, ADR index and llms.txt must match the frontmatter
        run: node scripts/docs/gen-index.mjs --check
      # Gate de no-regresion del claim de cifrado en reposo (ADR-0057 W0, riesgo R-12).
      # Falla si la doc afirma cifrado en reposo sin el matiz que lo desmiente (el P0
      # FIND-407 volvio a colarse) o si el cableado ya aterrizo y la doc sigue
      # diciendo que no lo esta (claim falsa inversa).
      - name: encryption claim matches the wired state
        run: node scripts/docs/check-encryption-claim.mjs
  docs-structure:
    name: No section has lost its body
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # A 2026-09-29 regression in lib.mjs segment() reordered file content on
      # write-back: code-free lines were buffered and flushed at the END of the
      # file, which pushed each affected file's H1 hundreds of lines down and
      # emptied the sections above it. Every read-only checker stayed green
      # because proseOf() does not care about segment order -- only the writer
      # reproduced it. 32 files were damaged before it was found.
      #
      # BUDGET counts DAMAGED FILES and is a ratchet, not a target: it must only
      # go down. It has come down 109 -> 101 -> 96 -> 87 -> 40, and two of those
      # steps were the gate's own bugs, not the docs getting better:
      #   109 -> 101  66 files wrote their title as `#Fjall` with no space, so
      #               GitHub rendered them as a paragraph and every
      #               heading-anchored check blamed the surrounding content.
      #               498 of 511 "stranded prose" findings were that one space.
      #   96  -> 40   the blank-line test treated any `Key: value` as YAML, so
      #               every ADR's `## Status` read as an empty section. 47 of
      #               87 damaged files were sections that are perfectly full.
      - name: Segmenter round-trip must be lossless
        run: node scripts/docs/wikilinks-to-md.mjs --self-test
      - name: Empty sections, stranded prose, malformed headings
        # The budget is a flag, not an env var: check-structure.mjs reads
        # --budget=. Wiring it as BUDGET: silently ran with a budget of 0, so
        # the gate would have failed on a tree whose only damage predates it.
        run: node scripts/docs/check-structure.mjs --budget=40
      - name: Attribute any new defect to this change or to the last commit
        if: failure()
        run: node scripts/docs/attribute-structure.mjs
  docs-lint-regression:
    name: Markdownlint does not regress
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # 2026-10-04 (DOCS-F1): the migration debt is drained -- the 7 errors in
      # BENCHMARKS/CONFIGURATION are gone and the 1 MD052 the generated index
      # carried is fixed in gen-index.mjs -- so every controlled file must stay
      # at 0. There is no per-file exception: the old master-plan carve-out
      # existed because machine-appended recitation blocks carried indented
      # lists (MD007); that is fixed at the source (`updateRecitation` fences the
      # block — FIND-264), so the count is now the whole controlled tree. A count
      # is easier to hold than a rule set; markdownlint's own --fix is
      # deliberately not used, because these files are hand-written prose.
      - name: Lint
        run: npx markdownlint-cli2 --config .github/markdownlint-cli2.yaml "docs/**/*.md" 2>&1 | tee /tmp/lint.txt || true
      - name: Fail if the error count exceeds the recorded baseline
        env:
          BASELINE: '0'
        run: |
          # A missing/empty log is not "0 errors" — fail loudly instead of
          # reporting a green gate on a log that was never written.
          test -s /tmp/lint.txt
          N=$(grep -c 'error MD' /tmp/lint.txt || true)
          N=${N:-0}
          echo "markdownlint errors: $N (baseline $BASELINE)"
          if [ "$N" -gt "$BASELINE" ]; then
            echo "::error::markdownlint regressions: $N > baseline $BASELINE"
            grep 'error MD' /tmp/lint.txt | head -20
            exit 1
          fi
      - name: Weekly full-repo lint (informational, never blocks)
        if: github.event_name == 'schedule'
        run: npx markdownlint-cli2 --config .github/markdownlint-cli2.yaml "**/*.md" 2>&1 | tail -40
        continue-on-error: true # CATEGORY: INFORMATIONAL - advisory sweep across the whole repo, not the docs gate
  api-docs:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'schedule')

    name: Public API surface moves only with documentation
    runs-on: ubuntu-latest
    # Measured: 6s on a 2-ref diff of the full three-language surface. The
    # margin is for a cold runner and a cold git object cache.
    timeout-minutes: 5
    steps:
      # `fetch-depth: 0` is load-bearing, not a habit. The gate diffs two refs,
      # and `actions/checkout` defaults to a depth-1 clone of a synthetic merge
      # ref whose parents are not present — `git diff base..head` would fail and
      # the script would report DEGRADED. A full history is the only way to make
      # the base ref reliable without a second fetch step. Cost on this repo is
      # a few seconds; the alternative is a gate that cannot resolve its own base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Pick the base ref BEFORE the gate, and print what was chosen. On a PR
      # `github.event.pull_request.base.sha` is a commit that EXISTS in the
      # fetch-depth-0 clone, so no ref lookup can fail. On push/dispatch there is
      # no base and BASE is empty on purpose: there is nothing to diff against,
      # so the job reports it and does not pretend to have gated.
      - name: Resolve base ref
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            if git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
              echo "sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
              echo "resolved: PR base sha $PR_BASE_SHA"
            else
              # Loud, not silent. A missing base is a checkout problem, and
              # swallowing it would leave the job green having gated nothing.
              echo "::warning::base sha $PR_BASE_SHA is absent from the checkout; falling back to the base branch ref"
              echo "sha=origin/$PR_BASE_REF" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "no base ref (event=$EVENT_NAME) — this run reports the surface, it does not gate"
          fi

      - name: Self-test
        run: node scripts/docs/check-api-docs.mjs --self-test

      - name: Report the surface
        run: node scripts/docs/check-api-docs.mjs --api-surface

      # Exit 3 (DEGRADED) is a FAILURE here, deliberately. A gate that cannot
      # resolve its base has proven nothing, and a green check mark for "I did
      # not look" is the exact failure mode RULES.md rule 6 exists to prevent.
      - name: Gate — surface change requires a doc change
        id: gate
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "::notice::no base ref on this event — gate not applicable"
            exit 0
          fi
          set +e
          node scripts/docs/check-api-docs.mjs --changed "$BASE..HEAD"
          CODE=$?
          set -e
          if [ "$CODE" = "3" ]; then
            echo "::error::gate could not be evaluated (DEGRADED) — this is not a pass"
            exit 1
          fi
          exit "$CODE"

      - name: Machine-readable report on failure
        if: failure() && steps.base.outputs.sha != ''
        run: node scripts/docs/check-api-docs.mjs --changed "${{ steps.base.outputs.sha }}..HEAD" --json
        continue-on-error: true # CATEGORY: INFORMATIONAL - extra detail for a red build; the gate step already failed
  doc-examples:
    # FIND-816: de los 3 jobs caros (84 % del coste medido de este fichero), es
    # el primero. Se omite cuando `docs-scope` midio que el rango no toca nada
    # que estos gates lean; un job omitido reporta `skipped` y no rompe ningun
    # required (no lo es). El `|| needs.docs-scope.result != 'success'` es el
    # fail-closed: si el scope no termino bien, el job corre.
    needs: [docs-scope]
    if: >-
      github.actor != 'dependabot[bot]' && (github.event_name != 'schedule') &&
      (needs.docs-scope.outputs.docs == 'true' || needs.docs-scope.result != 'success')

    name: Python examples match the real SDK
    runs-on: ubuntu-latest
    # Calibrated from ci-examples.yml, which builds the same wheel: a cold debug
    # build of vantadb-python plus its core dependency dominates. 30 min is that
    # job's measured wall time; rule 2 wants measured + margin, not optimism.
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Same wheel, same toolchain, same approach as ci-examples.yml. Inventing a
      # second way to get the package into Python is how the two lanes drift.
      - uses: ./.github/actions/rust-setup
        with:
          install-system-deps: true
          swap-mb: 4096

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Build vantadb_py wheel (maturin)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --out dist --manifest-path ./vantadb-python/Cargo.toml

      - name: Install the wheel
        # bash on all runners: the wheel pick uses $(...) substitution, which the
        # default shell cannot parse. Same pattern as ci-examples.yml.
        shell: bash
        run: |
          # shellcheck disable=SC2012 # Safe for generated wheel names
          wheel="$(ls -t ./dist/vantadb_py-*.whl | head -n 1)"
          python -m pip install --upgrade pip
          python -m pip install "$wheel"
          python -c "import vantadb; print('vantadb', vantadb.__version__)"

      # The gate's own logic, proven on synthetic snippets: a real method must
      # pass, an invented method must fail, a fragment must classify as a
      # fragment. No test framework, 17 assertions, exits non-zero on any failure.
      # It runs AFTER the wheel is installed so the two API assertions execute
      # for real instead of printing SKIP.
      - name: Self-test the gate logic
        run: node scripts/docs/check-doc-examples.mjs --self-test

      - name: Every attribute a runnable example touches exists
        run: node scripts/docs/check-doc-examples.mjs

  # DOCS-F2 (2026-10-04): la mitad Python del contrato T13 se cumplía a nivel
  # de EJEMPLOS (el job de arriba resuelve cada bloque runnable contra el
  # paquete real). Lo que no existía era el chequeo docstring ↔ firma del
  # propio binding: pydoclint. Medido 2026-10-04: 4 violaciones (DOC109/110/105
  # en error_to_dict, DOC203 en SearchRequest.asdict) → drenadas a 0 en el
  # mismo commit que cablea este job. No necesita el wheel: es análisis
  # estático de los .py del binding, por eso es un job aparte y barato.
  # En pydoclint 0.11 `--check-style` se renombró a `--style` (el comando del
  # plan docs-consolidation quedó viejo); versión pinneada para reproducibilidad.
  python-docstrings:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'schedule')

    name: Python docstrings match signatures (pydoclint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pydoclint (pinned)
        run: python -m pip install pydoclint==0.11.0
      - name: Docstrings must match signatures (numpy style)
        run: pydoclint --style=numpy vantadb-python/vantadb_py vantadb-python/vantadb
  docs-secrets:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'schedule')

    name: No credential in published docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Assert the rules themselves still detect their own shapes
        run: node scripts/docs/check-secrets.mjs --self-test
      - name: Scan prose for credential shapes
        run: node scripts/docs/check-secrets.mjs
      # Same scan, second surface. The human step prints a per-file report a
      # reviewer can act on; this one emits the aggregate that a later promotion
      # or a weekly trend report can consume without re-deriving it from logs.
      # Merged into this job (was docs-secrets-json): one checkout+setup for both.
      - name: Emit the JSON report
        run: node scripts/docs/check-secrets.mjs --json
  rustdoc:
    # FIND-816: REQUIRED (`Generate API reference (rustdoc)`, ruleset 23692587).
    # Gatearlo por `docs-scope` es la decision explicita que FIND-787 cerro: un
    # required puede reportar `skipped` (GitHub lo cuenta como Success), y la
    # unica alternativa peor es NO reportar, que es `Pending` para siempre
    # (FIND-765). `skipped` ocurre solo cuando el rango no toca ni `src/` ni
    # `Cargo.*` ni ningun crate: nada que rustdoc pueda leer. El coste de
    # runner NO se paga en ese caso, y en el resto la lane corre como siempre.
    needs: [docs-scope]
    if: >-
      github.actor != 'dependabot[bot]' && (github.event_name != 'schedule') &&
      (needs.docs-scope.outputs.docs == 'true' || needs.docs-scope.result != 'success')

    name: Generate API reference (rustdoc)
    runs-on: ubuntu-latest
    # FIND-137: 30 = build rustdoc ~10min medido (FIND-133) + margen cold-cache
    # con bindgen rocksdb (margen 3×, criterio FIND-135: duración real + margen).
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-setup composite: toolchain stable + sccache + cache.
      # --all-features pulls rocksdb -> librocksdb-sys (bindgen) which needs
      # libclang: system deps ARE required for the doc build itself.
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: 1.95.0
          components: ''
          install-nextest: false
          install-llvm-cov: false
          install-system-deps: true
          swap-mb: 0

      # FIND-763: el step del artefacto de abajo NO mide. Corre `cargo doc` sin
      # `RUSTDOCFLAGS`, así que genera el tarball y no juzga nada (medido
      # 2026-11-26: exit 0 con 36 warnings). Este step es el gate de la
      # superficie PÚBLICA, con el comando que FIND-755 dejó en verde, sin
      # `--all-features` ni `--document-private-items`: la vista privada es OTRA
      # superficie (los 36 lints, cerrados en FIND-761) y el artefacto conserva
      # su semántica. Sin `continue-on-error`, mismo criterio que clippy.
      # `env:` va en el step, no en el job: en el job contaminaría el build del
      # artefacto. Va antes porque no comparte fingerprint (default vs
      # --all-features).
      # FIND-769: esta superficie NO es la de tu máquina, y no por el toolchain
      # (1.95.0 en ambos lados): la doc de un `pub` bajo `#[cfg(unix)]` no la
      # procesa rustdoc en Windows, y `--workspace` unifica features (vanta-proxy
      # activa `encryption`) que un `-p vantadb` no ve. Correr SIEMPRE el comando
      # exacto de abajo; un verde con `-p` no predice este step.
      # FIND-771 (B): el gate no publicaba CUANTO midio, asi que "verde" y
      # "verde que midio" se veian igual desde la UI mientras no hubiera un rojo
      # - y en este step la unica forma de saberlo era leer el log. El resumen
      # publica el tamano del arbol de doc que el paso anterior acaba de
      # escribir, y la asercion de abajo convierte un 0 en un rojo: un summary
      # que siempre dice "ok" sin contar nada es la misma vacuidad con mejor
      # tipografia.
      # Alcance honesto del numero: son DIRECTORIOS con `index.html` bajo
      # `target/doc` (targets de lib y de bin), y cargo acumula doc entre
      # invocaciones, asi que el `target/` que restaura el cache puede aportar
      # alguno. No es "crates que este step compilo": es el tamano de la
      # superficie publicada, y para lo que sirve -que el verde no sea de 0- es
      # exactamente lo que hace falta.
      - name: Deny rustdoc warnings (doc gate)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --no-deps --workspace --keep-going
          DOCS=$(find target/doc -mindepth 2 -maxdepth 2 -name index.html | wc -l)
          {
            echo "## Doc gate (rustdoc public surface)"
            echo ""
            echo "- Doc directories under \`target/doc\`: **${DOCS}** (lib + bin targets with an \`index.html\`)"
            echo "- rustdoc warnings: **0** (\`RUSTDOCFLAGS=-D warnings\`; the first one aborts this step)"
            echo "- Command: \`cargo doc --no-deps --workspace --keep-going\`"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$DOCS" -gt 0

      # `--no-deps` evita descargar/parsear crates externos (la doc de dependencias
      # la sirve docs.rs). `--workspace` cubre core + vantadb-*/providers.
      # `--all-features` consistente con cargo clippy --all-features del job clippy.
      # OJO: este step documenta la vista privada para el artefacto; no niega
      # warnings (el gate es el step de arriba). Negar aquí NO sustituye a ese
      # gate: son dos superficies distintas (FIND-761/FIND-763).
      - name: Generate rustdoc
        run: cargo doc --no-deps --workspace --all-features --document-private-items

      - name: Compress API reference
        run: |
          tar -czf api-reference-rust.tar.gz -C target/doc .
          du -h api-reference-rust.tar.gz

      - name: Upload API reference artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-reference-rust
          path: api-reference-rust.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "## Rustdoc Build Summary"
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Ref: ${{ github.ref }}"
            echo "- Artifact: api-reference-rust.tar.gz (30-day retention)"
            echo "- Command: cargo doc --no-deps --workspace --all-features --document-private-items"
          } >> "$GITHUB_STEP_SUMMARY"

  # DOCS-F2 (2026-10-04): los ejemplos de la documentación nunca se ejecutaban
  # en CI. `cargo doc` construye el artefacto y valida links, pero los doctests
  # (bloques ``` de los docstrings) sólo corren con `cargo test --doc`. Medido
  # 2026-10-04 (Windows, warm): `RUSTDOCFLAGS="-D warnings" cargo test --doc
  # --workspace` → EXIT 0 (13 + 1 ignored en vantadb, 1 en vanta-memory, 1 en
  # vantadb-mcp; compile 2m47s + 16.8s de tests). `vantadb_py` queda fuera por
  # tipo cdylib — warning de cargo, no error. Job separado del artefacto para que
  # un fallo nombre el doctest roto, no el build de docs (mismo criterio que
  # ci-examples.yml). `-D warnings` convierte cada warning de rustdoc en error:
  # un ejemplo que no compila no llega a un humano. Primer run real en
  # ubuntu-latest (medición local en Windows): un fallo platform-specific
  # es finding real, no ruido.
  doctests:
    # FIND-816: el tercero de los caros (270 s medidos). Mismo gate que sus dos
    # hermanos; ver `doc-examples` para el razonamiento completo.
    needs: [docs-scope]
    if: >-
      github.actor != 'dependabot[bot]' && (github.event_name != 'schedule') &&
      (needs.docs-scope.outputs.docs == 'true' || needs.docs-scope.result != 'success')

    name: Doc-tests (RUSTDOCFLAGS=-D warnings)
    runs-on: ubuntu-latest
    # 30 = mismo margen que el job rustdoc hermano (build del workspace en
    # perfil test + 20s de tests; medido warm: 2m47s + 16.8s; cold = margen 3×).
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mismo composite que el job rustdoc: toolchain stable + sccache + cache.
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: 1.95.0
          components: ''
          install-nextest: false
          install-llvm-cov: false
          install-system-deps: true
          swap-mb: 0

      - name: Doc-tests must compile and pass with warnings denied
        run: cargo test --doc --workspace

  actionlint:
    name: actionlint (workflows lint + inventory gate)
    # Sin guard de dependabot (FIND-472): un job omitido por `if:` reporta
    # 'skipped' y GitHub cuenta 'skipped' como required check SATISFECHO.
    # Este check es barato (lint de workflows: segundos) y es required: si se omite, un PR de
    # Dependabot mergearia sin el. Los jobs caros siguen blindados.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint v1.7.7 (pinned sha256)
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint

      - name: Lint workflows
        run: |
          /tmp/actionlint -color

      # FIND-702: actionlint only lints .github/workflows — a composite action
      # `run:` step without `shell:` is invalid (GitHub refuses to load the
      # action) and sails through every gate. Caught in review on 2026-11-23
      # (H04-01) after a one-line step was added without it.
      # ponytail: count-based check (shell: >= run: per file); a per-step map
      # would be stricter — upgrade if a false negative ever appears.
      - name: Composite actions declare a shell for every run step
        run: |
          status=0
          for f in .github/actions/*/action.yml; do
            runs=$(grep -cE '^[[:space:]]*run:' "$f" || true)
            shells=$(grep -cE '^[[:space:]]*shell:' "$f" || true)
            echo "$f: run=$runs shell=$shells"
            if [ "$shells" -lt "$runs" ]; then
              echo "::error file=$f::a run: step is missing its required shell: key"
              status=1
            fi
          done
          exit $status

      - name: Workflow inventory gate (count vs CI_POLICY.md)
        run: |
          expected=$(grep -oP '\*\*\K[0-9]+(?= active workflow files)' docs/dev/operations/CI_POLICY.md)
          actual=$(find .github/workflows -maxdepth 1 -name '*.yml' | wc -l)
          echo "workflows: $actual (CI_POLICY.md: $expected)"
          test "$actual" = "$expected"
