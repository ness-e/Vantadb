name: 'OPS: Platform - CodeQL, opencode bot, OCR nightly'

# CI-08 Step 4 (SRV-10.md tabla migracion): consolida 4 workflows (8 jobs 1:1).
# Origenes: desktop.yml, sec-codeql.yml, opencode.yml, ocr-nightly.yml.
# FREEZE 2026-10-16 (decisión owner): jobs desktop (windows/macos/linux)
# eliminados — la app vive congelada en feature-freez/desktop/ (ver FIND-341).
# Triggers = push/PR[main] paths src/server + schedules (codeql dom 00:00, ocr
#   04:00 diario) + issue_comment/review_comment (opencode) + dispatch.
# Deltas documentados vs origenes:
# - codeql push/PR sin paths en origen: ahora acotado a paths desktop (docs-only
#   ya no dispara CodeQL; sigue schedule semanal + PRs con codigo).
# - opencode conserva su concurrency anti-doble-run (FIND-146) a nivel de job
#   + gate a eventos de comentario (antes imposible otro evento).
# - resto de jobs excluyen eventos de comentario (un comentario no debe
#   compilar Tauri ni correr CodeQL).
# - ocr/codeql cancel-in-progress: false del origen -> grupo estandar;
#   codeql lleva concurrency job-level false (scan semanal protegido).
#   cancelable (runs nocturnos supersedidos se cancelan; deseable).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'vantadb-server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/platform-ops.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'vantadb-server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/platform-ops.yml'
  schedule:
    - cron: '0 0 * * 0'
    - cron: '0 4 * * *'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')

    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust, python, javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.1 (PIN: mismo SHA que init — skew init/analyze rompe el post-action)
  opencode:
    concurrency:
      group: opencode-${{ github.event.comment.id }}
      cancel-in-progress: false

    if: (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && (contains(github.event.comment.body, ' /oc') || startsWith(github.event.comment.body, '/oc') || contains(github.event.comment.body, ' /opencode') || startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@10765ff2a9da8c3b88e4de873aa383a49c318912 # dev
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/hy3-free
  delegate:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')

    name: Delegation spec, last 24h (no key required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install OCR CLI
        run: npm install -g @alibaba-group/open-code-review@1.12.9

      - name: Resolve 24h window
        id: window
        run: |
          SINCE=$(git log --since="24 hours ago" --pretty=format:%H | tail -n 1)
          echo "since=${SINCE:-HEAD}" >> "$GITHUB_OUTPUT"
          echo "Window base: ${SINCE:-HEAD (empty window — workspace preview fallback)}"

      - name: Self-test rule mapping (deterministic, must pass)
        run: |
          for p in src/wal.rs src/index/core.rs src/parser/mod.rs src/memory_governor.rs src/ingestion.rs src/engine.rs src/sdk/mod.rs vantadb-server/src/main.rs vantadb-python/src/lib.rs vantadb-wasm/src/lib.rs Cargo.toml; do
            SRC=$(ocr rules check --rule .opencodereview/rule.json "$p" | sed -n '2p')
            echo "$p -> $SRC"
            echo "$SRC" | grep -q "Custom" || { echo "::error::no custom rule for $p"; exit 1; }
          done

      - name: Delegation preview (24h window)
        run: |
          ocr delegate preview -f json \
            --from "${{ steps.window.outputs.since }}" --to HEAD \
            > ocr-preview.json || ocr delegate preview -f json > ocr-preview.json
          cat ocr-preview.json

      - name: Delegation rules (repo rule.json auto-loaded)
        run: |
          FILES=$(jq -r '.reviewable_files[]?.path | select(. != ".opencode")' ocr-preview.json | tr '\n' ' ')
          if [ -z "$FILES" ]; then echo "nothing reviewable in window"; echo '{"groups":[]}' > ocr-rules.json; exit 0; fi
          # shellcheck disable=SC2086
          ocr delegate rule $FILES -f json \
            --from "${{ steps.window.outputs.since }}" --to HEAD \
            > ocr-rules.json
          cat ocr-rules.json

      - name: Upload delegation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocr-nightly-delegate
          path: |
            ocr-preview.json
            ocr-rules.json
          retention-days: 30
  check-key:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')

    name: Check for LLM key (no secret exposure)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        env:
          HAS_KEY: ${{ secrets.OCR_LLM_TOKEN != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi
  full:
    name: Full LLM review, last 24h (requires secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Delegation is the default: without a key this job is skipped (green) —
    # `secrets` is not allowed in job `if:`, so the check lives in `check-key`.
    needs: [check-key]
    if: needs.check-key.outputs.has_key == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install OCR CLI
        run: npm install -g @alibaba-group/open-code-review@1.12.9

      - name: Configure LLM from secrets (never logged)
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: |
          ocr config set llm.url "$OCR_LLM_URL"
          ocr config set llm.model "$OCR_LLM_MODEL"
          # shellcheck disable=SC2016 # Token variable intentionally expanded by ocr subshell at runtime
          ocr config set llm.auth_token_cmd 'printf "%s" "$OCR_LLM_TOKEN"'

      - name: Full review (24h window, json evidence)
        env:
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
        run: |
          SINCE=$(git log --since="24 hours ago" --pretty=format:%H | tail -n 1)
          ocr review --format json --audience agent \
            --from "${SINCE:-HEAD}" --to HEAD \
            -o ocr-result.json
          cat ocr-result.json

      - name: Export session index for viewer replay (best-effort)
        # CATEGORY: BEST-EFFORT — internal session layout may change across ocr versions; evidence is ocr-result.json
        continue-on-error: true
        run: ocr session list --json > ocr-sessions.json || echo '[]' > ocr-sessions.json

      - name: Upload full-review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocr-nightly-full
          path: |
            ocr-result.json
            ocr-sessions.json
          retention-days: 30
