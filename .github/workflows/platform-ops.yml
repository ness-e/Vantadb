name: 'OPS: Platform - CodeQL'

# CodeQL static analysis for Rust, Python, and JavaScript/TypeScript.
on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'vantadb-server/**'
      - 'vantadb-python/**'
      - 'vantadb-ts/**'
      - 'vantadb-mcp/**'
      - 'vanta-memory/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/platform-ops.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'vantadb-server/**'
      - 'vantadb-python/**'
      - 'vantadb-ts/**'
      - 'vantadb-mcp/**'
      - 'vanta-memory/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/platform-ops.yml'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    # Escanea en push/PR (build-mode:none, barato) y en schedule semanal.
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust, python, javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2 (PIN: mismo SHA que init - skew init/analyze rompe el post-action)
