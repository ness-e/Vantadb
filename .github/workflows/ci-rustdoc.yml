name: 'CI: Rust API Reference (cargo doc artifact)'

# RES-11 / FND-17 Fase 1 — job rustdoc en CI.
# Genera HTML navegable de la API del workspace entero (cero deps nuevas: rustdoc
# viene con la toolchain) y lo sube como artifact para que cada PR/merge tenga
# una API reference del estado actual — adoptantes pre-docs.rs la pueden abrir
# desde la pestaña "Artifacts" del run sin esperar al publish en docs.rs.
#
# Gate de calidad acoplado: `cargo doc --no-deps` falla si un docstring Rust
# tiene sintaxis inválida de markdown/links, así que convierte docstrings
# rotos en error de CI sin costo adicional.
#
# Fase 2 (defer): deploy del artifact a GitHub Pages cuando exista decisión de
# docs site. Ver `docs/research/archive/FND-17-api-reference-docs-as-code.md`.
#
# FIND-137 (2026-09-22): unificado con `rustdoc-70.yml` (eliminado vía `git rm`:
# mismo `cargo doc`, mismo concurrency group `rustdoc-${{ github.ref }}` que se
# canibalizaban). El survivor conserva: toolchain stable + push [main,develop]
# de este archivo; PR [main,develop], `--document-private-items`, artifact
# tar.gz 30d, env determinista y summary de `rustdoc-70.yml`. Decisión por
# evidencia en `docs/tasks/FIND-137.md` §8.

on:
  push:
    branches: ["main", "develop"]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vantadb-*/**'
      - 'vanta-memory/**'
      - 'providers/**'
      - '.github/workflows/ci-rustdoc.yml'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vantadb-*/**'
      - 'vanta-memory/**'
      - 'providers/**'
      - '.github/workflows/ci-rustdoc.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel-in-progress coincide con la convención del repo (fmt/clippy/semver-checks
# usan el mismo patrón en ci-rust.yml). Evita acumulación de runs obsoletos
# cuando se pushea una cadena de commits sobre la misma rama.
concurrency:
  group: rustdoc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustdoc:
    name: Generate API reference (rustdoc)
    runs-on: ubuntu-latest
    # FIND-137: 30 = build rustdoc ~10min medido (FIND-133) + margen cold-cache
    # con bindgen rocksdb (margen 3×, criterio FIND-135: duración real + margen).
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-setup composite: toolchain stable + sccache + cache.
      # --all-features pulls rocksdb -> librocksdb-sys (bindgen) which needs
      # libclang: system deps ARE required for the doc build itself.
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: stable
          components: ''
          install-nextest: false
          install-llvm-cov: false
          install-system-deps: true
          swap-mb: 0

      # `--no-deps` evita descargar/parsear crates externos (la doc de dependencias
      # la sirve docs.rs). `--workspace` cubre core + vantadb-*/providers.
      # `--all-features` consistente con cargo clippy --all-features del job clippy.
      # Falla por defecto en docstrings con links rotos / markdown inválido (gate de calidad).
      - name: Generate rustdoc
        run: cargo doc --no-deps --workspace --all-features --document-private-items

      - name: Compress API reference
        run: |
          tar -czf api-reference-rust.tar.gz -C target/doc .
          du -h api-reference-rust.tar.gz

      - name: Upload API reference artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-reference-rust
          path: api-reference-rust.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "## Rustdoc Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact: api-reference-rust.tar.gz (30-day retention)" >> $GITHUB_STEP_SUMMARY
          echo "- Command: cargo doc --no-deps --workspace --all-features --document-private-items" >> $GITHUB_STEP_SUMMARY