name: 'RELEASE: Verify — Artifacts live check'

# Post-release verification (DIST-05): a release is complete only when every
# artifact is live. Dispatch checks `releases/latest` (empty `tag` input) or any
# tag. The weekly cron is OFF until the next publish lands (see `on:` below);
# until it is re-enabled the gate only speaks when someone runs:
#   gh workflow run release-verify.yml -f tag=vX.Y.Z
# Remediation: docs/dev/workflow/PUBLISH.md, Post-release verification.
on:
  # PRE-PUB dispatch-only: el schedule semanal daba FAIL cronico (verifica
  # registros tras approvals pendientes). Al lanzar, reactivar el cron.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. v0.9.0). Empty = latest release.'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release (assets + registries + smoke)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }} # avoids anonymous API rate limits
          TARGET_TAG: ${{ inputs.tag }} # passed via env (never interpolated into the script)
        run: |
          # Hash splatting binds by NAME. Array splatting binds POSITIONALLY:
          # @("-Smoke") lands on [string]$Tag and the script exits with
          # "FAIL invalid tag '-Smoke' (expected vX.Y.Z)" (FIND-789).
          $params = @{ Smoke = $true }
          if ($env:TARGET_TAG) { $params['Tag'] = $env:TARGET_TAG }
          ./scripts/verify-release.ps1 @params

  tarball-build:
    # FIND-342 (slice E): the crates.io tarball must not only exist — it must
    # BUILD. Installs the published version locked into an isolated root and
    # runs the binary. No network/unpublished tarball = NO-VERIFICADO declared
    # (warning + skip), never invented; a failed build is a real FAIL.
    name: Tarball builds from crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve version (dispatch tag or latest release)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          # -R: this job has no checkout, so gh cannot infer the repo from git
          # ("failed to run git: fatal: not a git repository") (FIND-789).
          # $GITHUB_REPOSITORY is a runner-provided default env var, so the repo
          # reaches the script through the environment, never interpolated.
          if [ -n "$TARGET_TAG" ]; then TAG="$TARGET_TAG"; else TAG="$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"; fi
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) VER="${TAG#v}";; *) echo "FAIL invalid tag '$TAG' (expected vX.Y.Z)"; exit 1;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Probe the published tarball (network)
        id: probe
        run: |
          if curl -fsSL -o /dev/null "https://crates.io/api/v1/crates/vantadb/${{ steps.ver.outputs.ver }}/download"; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::crates.io tarball for vantadb ${{ steps.ver.outputs.ver }} not reachable (network or unpublished) — tarball build NO-VERIFICADO, not failed."
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the published tarball (locked, isolated root)
        if: steps.probe.outputs.reachable == 'true'
        run: |
          cargo install vantadb --vers "${{ steps.ver.outputs.ver }}" --locked --root "${{ runner.temp }}/tarball-check" --force
          "${{ runner.temp }}/tarball-check/bin/vanta-cli" --version
