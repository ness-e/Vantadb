# Markdown libre salvo lo grave: la mayoria de reglas estan apagadas a proposito.
# Solo gatean 3 basicas (MD009 espacios al final, MD031 fences rodeados de
# lineas en blanco, MD047 una sola linea final). Si activas otra regla,
# primero limpia docs/** hasta baseline 0 (job docs-lint-regression).
config:
  MD013: false
  MD029: false
  MD032: false
  MD033: false
  MD041: false
  MD060: false
  MD001: false
  MD004: false
  MD012: false
  MD018: false
  MD022: false
  MD024: false
  MD025: false
  MD026: false
  MD034: false
  MD036: false
  MD037: false
  MD038: false
  MD040: false
  MD046: false
  MD050: false
  MD051: false
  MD056: false
  MD058: false
  MD028: false

gitignore: true

ignores:
  - ".github/ISSUE_TEMPLATE/*.yml"
  - "docs/dev/tasks/**"
  - "docs/dev/reviews/**"
  - "docs/dev/research/**"
  - "docs/dev/reports/**"
  - "docs/dev/plans/**"
  - "docs/dev/avance/**"
  - "docs/dev/workflow/**"
  - "docs/dev/strategy/**"
  - "docs/dev/Backlog*.md"
  - "docs/dev/backlog*.md"
  - "docs/dev/FASE-A.md"
  - "docs/dev/master-index.md"
