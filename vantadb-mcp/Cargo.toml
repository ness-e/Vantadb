[package]
name = "vantadb-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Autocontained Model Context Protocol (MCP) interface for VantaDB"
publish = false

[dependencies]
# WIRE-07 feature decouple: same non-`cli` default set as `vantadb-server`
# (both are dependents of the HTTP binary; keeping either on `default` would
# re-enable `cli` through feature unification).
vantadb = { path = "../", default-features = false, features = [
    "advanced-tokenizer",
    "arrow",
    "fjall",
    "fs2",
    "memmap2",
    "rayon",
    "roaring",
    "server",
    "sysinfo",
] }
# MEM-52: fachada productiva de ingest wiki — el tool wiki_ingest dispara el
# worker de vanta-memory en un hilo de fondo (era dev-dep desde MEM-44;
# dirección ciclo-free verificada vía cargo tree).
vanta-memory = { path = "../vanta-memory", features = ["llm-driver"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "rt-multi-thread", "signal", "time", "io-util", "io-std", "net", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = "0.39"
axum = { version = "0.8" }

[features]
embed-local = ["vantadb/embed-local"]
remote-inference = ["vantadb/remote-inference"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

