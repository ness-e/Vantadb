# getrandom backend for WebAssembly.
#
# `wasm32-unknown-unknown` has no OS RNG, so `getrandom` 0.3/0.4 refuse to
# compile without an explicit backend (compile_error in backends.rs). The
# 0.3.4 copy reaches the wasm graph transitively via ahash 0.8 / rand_core 0.9
# and cannot be bumped away (third-party pins). Select the Web Crypto (JS)
# backend for every wasm32 build — local, CI and wasm-pack honor this file.
# See https://docs.rs/getrandom#webassembly-support
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# R1 (2026-11-27, auditoria de recursos): incremental fuera por defecto en este repo.
# Medido: `target/debug/incremental` llegaba a 14,43 GB creciendo 1,64 GB cada 25 min,
# con 843 `dep-graph.bin` y 614 perfiles - porque cada carril compila con un feature
# set distinto, asi que el incremental apenas acierta y solo ocupa. Nada lo podaba.
#
# R1-bis (2026-11-28): ESTA SECCION NO DESACTIVA EL INCREMENTAL. Medido: el
# directorio volvio a 17,08 GB con esta linea presente. `[env]` fija el entorno
# de los procesos hijos (rustc, build scripts); cargo lee `incremental` del
# PERFIL. La desactivacion real vive en `Cargo.toml` -> `[profile.dev]
# incremental = false`. Se deja aqui por si algun build script consulta la
# variable, pero no es lo que apaga la cache.
[env]
CARGO_INCREMENTAL = "0"

# R5 (2026-11-27): lld-link en vez del link.exe de MSVC. Ya estaba instalado en
# C:\Program Files\LLVM\bin y sin usar. MSVC medía 380-392 MB por link.
# Reversible en una linea; si el PDB de un perfil con debug necesita MSVC, se quita.
[target.x86_64-pc-windows-msvc]
linker = "lld-link"
