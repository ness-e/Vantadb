# release-plz — automated versioning and publishing
# https://release-plz.dev/

[workspace]
# Publish all workspace crates in dependency order
publish = true
# Don't publish these crates (no public API)
publish_allow_dirty = false

# Release only when the Release PR is merged (not on every main push):
# avoids publishing before the changelog entry lands on main (HIG-01 / 0.7.0 race).
release_always = false

# Git
git_tag_enable = true
git_tag_name = "v{{ version }}"

# GitHub release
git_release_enable = true

# Semver validation
semver_check = true

# Changelog
changelog_update = true

[[package]]
name = "vantadb"
changelog_path = "docs/CHANGELOG.md"

[[package]]
name = "vantadb-wasm"
# WASM bindings are distributed via npm (wasm-pack), not crates.io.
# release = false: skip update/changelog/publish entirely. The version is
# inherited automatically via version.workspace = true in the workspace.
release = false

[[package]]
name = "vanta-memory"
# DIST-01 (2026-10-04): publicable en Cargo.toml (dry-run verde), pero EN HOLD
# hasta completar el bootstrap de la primera publicación: crates.io Trusted
# Publishing solo se configura después de que el crate existe (la primera
# publicación requiere API token — https://crates.io/docs/trusted-publishing).
# Unblock (owner, ventana #238): (1) primera publicación con token temporal;
# (2) configurar Trusted Publishing (repo ness-e/Vantadb, workflow release.yml);
# (3) borrar esta entrada → release-plz gestiona vanta-memory como vantadb.
# Ver docs/dev/tasks/DIST-01.md §Decisión release-plz.
#
# ACTUALIZADO 2026-10-07 (dry-run del bootstrap falló): el primer publish NO
# puede ser antes de que exista vantadb 0.9.0 — el build empaquetado usa
# `Embedded::reinforce`/`ReinforceOutcome` (MEMG-02, post-0.8.0) y el spec
# `vantadb = "^0.8.0"` resuelve contra el 0.8.0 publicado → no compila aislado.
# Orden revisado: publicar vantadb 0.9.0 (release) → actualizar el spec a
# "0.9.0" → primer publish vanta-memory 0.9.0 (token) → TP (owner) → borrar
# esta entrada (release-plz lo gestiona desde el release siguiente).
release = false

# NOTE: the desktop Tauri app (desktop/src-tauri, isolated workspace, versions
# in desktop/package.json + tauri.conf.json + src-tauri/Cargo.toml) is
# intentionally NOT listed here: [[package]] overrides must reference root
# workspace members, and release-plz never touches non-members anyway
# (engine publishes via release.yml; desktop bundles via desktop.yml).

# Changelog header — must stay byte-compatible with the docs frontmatter
# (scripts/docs/check-docs.mjs gates on title+kind): release-plz rewrites
# everything above `## [Unreleased]`, so the frontmatter must live here
# (otherwise the next release strips it from docs/CHANGELOG.md).
[changelog]
header = """---
title: Changelog
kind: changelog
description: All notable changes to this project will be documented in this file
---

# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

## [Unreleased]

"""
