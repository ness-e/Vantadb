[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vantadb-langchain"
version = "0.9.0"
description = "LangChain adapter for VantaDB — embedded vector memory for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "VantaDB Team"}]
keywords = ["vantadb", "langchain", "vector-store", "rag", "ai-memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "vantadb-py>=0.6.1,<0.10.0",
    # FIND-649: floor 0.3.81, not 0.3 — langgraph-checkpoint>=4.1 (inside the
    # >=2,<5 range below) calls Reviver(allowed_objects="core") at import
    # (langgraph/checkpoint/serde/jsonplus.py:47, since checkpoint 4.1.0) and
    # the `allowed_objects` kwarg only exists in langchain-core>=0.3.81
    # (verified against published wheels; upstream's declared dep stays
    # `langchain-core>=0.2.38`, so the resolver doesn't protect us).
    # 0.3.0–0.3.80 crash at pytest collection with
    # `TypeError: Reviver.__init__() got an unexpected keyword argument
    # 'allowed_objects'` — CI evidence: compat-matrix langchain/0.3 row.
    "langchain-core>=0.3.81,<1",
    # INTG-01: LangGraph adapters (checkpointer + BaseStore).
    # API inestable upstream → major pineado; spec en docs/dev/tasks/INTG-01.md.
    "langgraph-checkpoint>=2,<5",
]

[project.urls]
Homepage = "https://github.com/ness-e/Vantadb"
Repository = "https://github.com/ness-e/Vantadb"
Documentation = "https://github.com/ness-e/Vantadb/tree/main/integrations/langchain"

[tool.hatch.build.targets.wheel]
packages = ["vantadb_langchain"]
