[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vantadb-dspy"
version = "0.9.0"
description = "DSPy adapter for VantaDB — embedded vector memory for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "VantaDB Team"}]
keywords = ["vantadb", "dspy", "vector-store", "rag", "ai-memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "vantadb-py>=0.6.1,<0.10.0",
    # FIND-644: floor 3.0.4 — GHSA-vvw2-h478-xwr3/PYSEC-2026-1318 affect
    # everything <=3.0.3 and ship no 2.x fix. Adapter only consumes
    # `dspy.Prediction` (with ImportError fallback), stable across 3.x.
    "dspy>=3.0.4,<4",
]

[project.urls]
Homepage = "https://github.com/ness-e/Vantadb"
Repository = "https://github.com/ness-e/Vantadb"
Documentation = "https://github.com/ness-e/Vantadb/tree/main/integrations/dspy"

[tool.hatch.build.targets.wheel]
packages = ["vantadb_dspy"]
