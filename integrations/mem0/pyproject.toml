[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vantadb-mem0"
version = "0.9.0"
description = "Mem0 adapter for VantaDB — embedded vector memory for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "VantaDB Team"}]
keywords = ["vantadb", "mem0", "vector-store", "rag", "ai-memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "vantadb-py>=0.6.1,<0.10.0",
    # FIND-644: floor 2.0.18 — mem0ai <2.0.18 is covered by open advisories:
    # GHSA-7587-9684-52r6 (CVE-2026-115324, critical SQLi in the Databricks
    # vector store, fixed 1.0.8), GHSA-5324-3w58-qpp2 (CVE-2026-116575,
    # cross-tenant session-scope leak, fixed 2.0.18) and GHSA-xqxw-r767-67m7
    # (CVE-2026-7597, pickle deserialization in faiss.py, fixed 2.0.0b2).
    # Verified compatible: adapter only implements
    # mem0.vector_stores.base.VectorStoreBase, unchanged in 2.x (tested 2.2.1).
    "mem0ai>=2.0.18,<3",
]

[project.urls]
Homepage = "https://github.com/ness-e/Vantadb"
Repository = "https://github.com/ness-e/Vantadb"
Documentation = "https://github.com/ness-e/Vantadb/tree/main/integrations/mem0"

[tool.hatch.build.targets.wheel]
packages = ["vantadb_mem0"]
