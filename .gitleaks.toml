# .gitleaks.toml — Configuración estricta de detección de secretos en VantaDB
# Previene la exposición de tokens de crates.io, PyPI, npm, GitHub PATs, claves privadas y API keys.
# Implementación de TEC-10 (Q27 Opción B) y soporte para BIZ-18.

title = "VantaDB Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist para tests sintéticos, fixtures, documentación y artefactos de compilación"
paths = [
    '''(^|/)tests/''',
    '''(^|/)evals/fixtures/''',
    '''(^|/)docs/''',
    '''(^|/)scripts/docs/''',
    '''(^|/)target/''',
    '''(^|/)node_modules/''',
    '''(^|/)\.git/''',
    '''(^|/)\.gitleaks\.toml$''',
    '''(^|/)\.secretlintrc\.json$''',
    '''(^|/)\.secretlintignore$''',

    # --- Triage de hallazgos históricos (workflow_dispatch 2026-11-17, 194 findings) ---
    # `.opencode/` ya está en .gitignore y vive como repo separado (configOpencode);
    # no puede volver a entrar al historial de este repo. Los hallazgos eran URLs
    # prefirmadas de AWS EXPIRADAS (AWSAccessKeyId=ASIA... = credenciales temporales
    # STS + firma con caducidad <= 7 días) pegadas en un doc de investigación de
    # 2026-07 — datos muertos, no secretos utilizables.
    '''(^|/)\.opencode/''',
    # `todo.md` raíz está en .gitignore (dump local de exportaciones de chat).
    # Hallazgos: mismas URLs prefirmadas expiradas (ASIA2F3EMEYEQEPEB6MI).
    # Anclado a raíz para no silenciar otros `todo.md` futuros en subdirectorios.
    '''^todo\.md$'''
]

# regexTarget="line" aplica las regexes siguientes a la LÍNEA completa del hallazgo,
# no al secreto extraído. Ambas regexes describen líneas benignas concretas
# (comentarios doc y claves i18n), no patrones de secreto.
regexTarget = "line"
regexes = [
    # Falso positivo de `generic-api-key` sobre el keyword `auth` en un comentario
    # doc presente en `src/server/routing.rs:5` y embebido en `scripts/build_routing.ps1:73`
    # ("//! auth middleware, OTEL/tracing setup, TLS handshake, the bootstrap loop...").
    '''auth middleware, OTEL/tracing''',
    # Falso positivo de `generic-api-key` sobre claves i18n del 404 de la web
    # (`labelKey:`/`descriptionKey: "notFound.suggested.N.label|description"`) en
    # `web/src/app/not-found.tsx` y `web/src/app/[...slug]/page.tsx`. `web/` fue
    # extraído al repo ness-e/Vantadb-web; son identificadores de traducción.
    '''Key: "notFound\.suggested\.'''
]

# 1. crates.io API token (scope publish / token cio...)
# `\b` requerido: sin frontera de token, la regex matchea `cio` DENTRO de blobs
# base64 (ej. screenshots embebidos en reportes lighthouse `web/audit-baseline/`),
# generando falsos positivos (triage 2026-11-17: 18 findings, todos `XcioYYYY`
# mid-token). Los tokens reales `cio...` siempre aparecen delimitados
# (`TOKEN=cio...`, `"cio..."`, tras espacio) => `\b` no pierde detección real.
[[rules]]
id = "crates-io-token"
description = "crates.io API token"
regex = '''\bcio[a-zA-Z0-9]{32,}'''
secretGroup = 0
keywords = ["cio"]

# 2. PyPI upload API token
[[rules]]
id = "pypi-api-token"
description = "PyPI API upload token"
regex = '''pypi-[A-Za-z0-9_-]{50,}'''
secretGroup = 0
keywords = ["pypi-"]

# 3. npm access token (automation o publish)
[[rules]]
id = "npm-access-token"
description = "npm automation or publish access token"
regex = '''npm_[A-Za-z0-9]{36}'''
secretGroup = 0
keywords = ["npm_"]

# 4. GitHub Personal Access Token (classic o fine-grained)
[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''(ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9_]{82})'''
secretGroup = 0
keywords = ["ghp_", "github_pat_"]

# 5. Claves privadas PEM / SSH
[[rules]]
id = "private-key"
description = "Private Key (PEM, SSH, RSA, DSA, EC, PGP)"
regex = '''-----BEGIN (?:RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY-----'''
keywords = ["-----BEGIN"]

# 6. API Keys: OpenAI
[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''(sk-[a-zA-Z0-9]{20}T3BlbkFJ[a-zA-Z0-9]{20}|sk-proj-[a-zA-Z0-9_-]{50,})'''
keywords = ["sk-", "sk-proj-"]

# 7. API Keys: Anthropic
[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-[a-zA-Z0-9_-]{80,}'''
keywords = ["sk-ant-"]

# 8. API Keys: HuggingFace
[[rules]]
id = "huggingface-token"
description = "HuggingFace API Token"
regex = '''hf_[a-zA-Z0-9]{34,}'''
keywords = ["hf_"]
